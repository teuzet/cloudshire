id: living-bridge
title: Живой мост
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: ecology, sphere: prosperity }
pitch: "Корни двух старых деревьев по разные стороны оврага срослись в настил, по которому прошёл гружёный вол; садовники говорят, что так можно растить переправы."

objects:
  - id: thing
    type: landmark
    name: "Сросшиеся корни над оврагом"
    description: "Толстые корни двух деревьев, сплетённые над оврагом в крепкий настил."

fronts:
  - id: main
    title: "Научиться растить мосты"
    form: deed
    description: "Никто не знает, сам ли вырос этот мост или его кто-то направлял. Понять это можно, только начав растить второй."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело направляющие желоба для молодых корней, уход садовников год за годом, пробы на малых овражках."
    stake:
      create:
        type: capability
        name: "Живые мосты"
        description: "Садовники города умеют направлять корни и растят переправы там, где камень не держится."
        weight: SIGNIFICANT
        statProfile: { prosperity: 3, security: 2 }
        refs: [thing]
