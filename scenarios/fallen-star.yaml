id: fallen-star
title: Упавшая звезда
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: sky, sphere: knowledge }
pitch: Ночью на дальнее поле упал с неба камень; он до сих пор тёплый, и трава вокруг него растёт вдвое быстрее.

objects:
  - id: star
    type: mystery
    name: Небесный камень
    description: Чёрный оплавленный камень с бычью голову в свежей воронке на поле. Тёплый на ощупь и днём и ночью.
    weight: MINOR
    statProfile: { knowledge: 1 }
  - id: field
    type: site
    name: Поле вокруг воронки
    description: Трава и хлеб у воронки поднялись по пояс за две недели.
    refs: [star]

fronts:
  - id: study-star
    title: Что такое небесный камень
    description: Узнать, отчего камень греет и что он делает с землёй вокруг.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [star, field]
    alignment: |
      Двигают дело наблюдение за полем, опыты с осколками, сравнение с записями о прежних падениях.
    stake:
      reveal:
        text: Камень отдаёт тепло медленно и остынет через несколько лет; пока он тёплый, земля в двадцати шагах от него родит втрое, а дальше остаётся обычной.
    clues:
      - id: shard
        fact: Отколотый кусок остыл за ночь; греет только целый камень.
        alignment: Опыты с осколками камня.
  - id: star-grab
    title: Камень хотят растащить
    form: tension
    description: Хозяин поля, храм и кузнецы тянут камень каждый к себе, а по ночам от него откалывают куски на обереги.
    impact: MINOR
    drift: STEADY
    refs: [star]
    alignment: |
      Сберегают камень стража у воронки, решение о том, чей он, до конца изучения, доля хозяину поля.
    stake:
      delete: { target: star }
