id: sold-ford
title: Проданная тайна
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: custom, sphere: influence }
pitch: В прошлое сопряжение соседи откуда-то знали, сколько у города зерна и железа, и сбили цены; кто-то из своих продал им городской счёт.

objects:
  - id: council
    type: organization
    name: Торговый совет
    description: Десяток старшин, которые перед каждым сопряжением решают, чем и почём город будет торговать. Их счёт запасов держится в тайне.
    weight: MINOR
    statProfile: { influence: 1, prosperity: 1 }
  - id: seller
    type: person
    name: Писец торгового совета
    description: Писец совета переписал счёт запасов и в первую же ночь сопряжения отнёс его купцам соседей. Взамен ему обещали место и дом на их острове при следующей встрече; задаток чужой монетой он прячет в переплёте счётной книги.
    refs: [council]
    hidden: true

fronts:
  - id: who-sold
    title: Кто продал городской счёт
    description: Найти того, кто выдал соседям запасы и цены города.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [council]
    closes:
      - { target: council-rift, share: 0.7 }
    alignment: |
      Двигает дело проверка всех, кто видел счёт, поиск чужой монеты в городе, расспросы о ночных переходах в пору сопряжения.
    stake:
      uncover: { target: seller }
    clues:
      - id: coin
        fact: У менялы всплыла горсть монет соседнего острова, сданных уже после расхождения.
        alignment: Расспросы менял и торговцев о чужой монете.
      - id: copy
        fact: Счёт запасов в ту неделю переписывали дважды, хотя нужен был один список.
        alignment: Проверка бумаг и порядка в совете.
  - id: council-rift
    title: Старшины подозревают друг друга
    form: tension
    description: Каждый в совете кивает на соседа. Старшины перестали собираться, и к следующему сопряжению город рискует прийти без единого слова.
    impact: MINOR
    drift: SLOW
    refs: [council]
    alignment: |
      Удерживают совет разбирательство по правилам, общее дело до его конца, защита от наветов.
    stake:
      stats: { influence: -3, prosperity: -1 }
