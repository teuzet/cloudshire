id: light-metal
title: Лёгкий металл
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: prosperity }
pitch: В отвалах старой каменоломни нашли серебристые зёрна металла втрое легче железа; жила уходит под обжитую деревню.

objects:
  - id: ore
    type: resource
    name: Жила лёгкого металла
    description: Серебристые зёрна в серой породе. Металл из них лёгкий и не ржавеет. Жила тянется от старых отвалов под деревню каменотёсов.
  - id: village
    type: settlement
    name: Деревня каменотёсов
    description: Старая деревня над жилой. Здесь живут те, кто первым нашёл зёрна, и уходить им некуда.
    weight: MINOR
    statProfile: { prosperity: 1 }
    refs: [ore]

fronts:
  - id: mine-ore
    title: Добыть лёгкий металл
    form: deed
    description: Из лёгкого металла выйдут инструмент, кровля и доспех, каких город не знал. Чтобы взять жилу, надо решить, как копать под деревней и что будет с её людьми.
    impact: MAJOR
    refs: [ore, village]
    alignment: |
      Двигают дело пробные штольни в обход домов, опыты плавки, уговор с деревней о доле и новом месте.
      Помогают сами каменотёсы, если видят в жиле свою выгоду.
    stake:
      create:
        type: resource
        name: Рудник лёгкого металла
        description: Город добывает и плавит лёгкий нержавеющий металл.
        weight: MAJOR
        statProfile: { prosperity: 2, security: 1, knowledge: 1 }
        refs: [ore]
