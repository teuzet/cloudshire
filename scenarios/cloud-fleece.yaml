    description: "Руно держится на кустах считаные недели. Пряхи говорят, что нить из него тоньше льняной, только прясть её надо иначе."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело сборщики вдоль кромки со страховочными верёвками, пробы прях, новое веретено под скользкое волокно."
    stake:
      create:
        type: practice
        name: "Пряжа из облачного руна"
        description: "Пряхи города умеют работать с облачным волокном и берегут запас на плащи и паруса для сушилен."
        weight: MINOR
        statProfile: { prosperity: 2, security: 1 }
        refs: [thing]
