id: law-of-the-first
title: Закон первых
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: matter, sphere: influence }
pitch: В основании старой башни нашли бронзовые листы с законом основателей; по нему городом правит жребий, а дома и поля каждые семь лет делят заново. Нашлись те, кто требует жить по закону первых.

objects:
  - id: plates
    type: object
    name: Бронзовые листы основателей
    description: Двенадцать листов тёмной бронзы с ровным древним письмом. Подлинность их признали и храм, и хранители. По ним нет ни совета, ни наследных домов, а есть жребий и передел.
    weight: MINOR
    statProfile: { knowledge: 1, influence: 1 }
  - id: firsters
    type: community
    name: Ревнители закона первых
    description: Младшие сыновья, безземельные, часть жрецов и немало мастеров. Носят на шее бронзовую бляшку и говорят, что город живёт в трёхсотлетнем беззаконии.
    refs: [plates]

fronts:
  - id: lot-or-council
    title: Жребий против совета
    form: tension
    description: Ревнители назначили день, когда выйдут на площадь тянуть жребий о власти. Знатные дома собирают людей, чтобы этот день не настал.
    impact: MAJOR
    drift: STEADY
    refs: [plates, firsters]
    alignment: |
      Ведут город через спор открытое чтение листов всему народу, собор сословий о том, что из закона первых взять в нынешний уклад, жребий для части должностей как проба.
      Утаить листы или разогнать ревнителей значит признать их правоту.
    stake:
      stats: { influence: -6, security: -3 }
  - id: read-plates
    title: Дочитать закон первых
    description: Листы прочитаны наполовину; дальше письмо темнее и слова старее. Узнать, что основатели написали в конце.
    impact: MINOR
    beatCount: 2
    refs: [plates]
    closes:
      - { target: lot-or-council, share: 0.5 }
    alignment: |
      Двигает дело работа знатоков древнего письма, сличение с другими надписями основателей, чистка листов.
    stake:
      reveal:
        text: Последний лист гласит, что закон дан «на первые сто лет, пока нас мало», а после потомки должны собраться и написать свой; сто лет истекли двести лет назад, и собора так никто и не созвал.
    clues:
      - id: count
        fact: На первом листе стоит число жителей; их было меньше четырёх сотен.
        alignment: Чистка листов и чтение начала закона.
