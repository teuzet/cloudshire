id: under-city
title: Город под городом
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: security }
pitch: "Провал в старом квартале открыл целый ярус улиц основателей под нынешним городом: сухие каменные ходы, залы и склады, которых хватит укрыть всех жителей."

objects:
  - id: thing
    type: district
    name: "Нижние улицы"
    description: "Тёмные каменные улицы под городом. Своды целы, воздух сух, двери сняты с петель и сложены у стен."

fronts:
  - id: main
    title: "Открыть нижний город"
    form: deed
    description: "Нижние улицы тянутся под всем городом, и никто не знает, почему основатели ушли оттуда наверх. Заселить их значит зажить иначе: с укрытием от любой бури и складами на годы."
    impact: MAJOR
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело обход и карта всех ходов, продухи и лестницы, уговор домов о том, чьё под чьим, и первые склады внизу."
    stake:
      create:
        type: district
        name: "Нижний город"
        description: "Под городом живёт второй ярус: укрытия, склады и мастерские, куда не достают ни буря, ни огонь."
        weight: MAJOR
        statProfile: { security: 4, prosperity: 3, influence: 1 }
        refs: [thing]
    clues:
      - id: left-in-order
        fact: "Основатели ушли из нижних улиц спокойно: всё вынесено, двери сняты и сложены."
        alignment: "Обход и карта ходов."
