id: short-shelter
title: Укрытий не хватит
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: sky, sphere: security }
pitch: Приметы сулят бурю, какой не было полвека; каменных подвалов в городе хватит на две трети жителей, и надо решать, кого и куда вести.

objects:
  - id: storm
    type: threat
    name: Великая буря
    description: Небо на востоке третий день стоит жёлтой стеной. Старики помнят такое один раз, и тогда снесло половину крыш.
  - id: cellars
    type: structure
    name: Городские подвалы
    description: Каменные подвалы под храмом, амбаром и богатыми домами. Вмещают около двух третей города.
    weight: MINOR
    statProfile: { security: 1 }

fronts:
  - id: storm-comes
    title: Буря идёт на город
    description: Через считаные недели буря накроет остров. Кто не найдёт каменных стен, останется под открытым небом.
    impact: MAJOR
    drift: FAST
    refs: [storm, cellars]
    alignment: |
      Спасают людей новые укрытия в каменоломнях и погребах, порядок, кто куда идёт, открытые подвалы богатых домов, запасы в каждом убежище.
    stake:
      stats: { security: -5, prosperity: -3 }
    events:
      - id: doors
        description: Хозяева трёх больших домов навесили на подвалы новые замки и поставили сторожей.
