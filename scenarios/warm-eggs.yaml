id: warm-eggs
title: Тёплые камни в осыпи
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: creature, sphere: knowledge }
pitch: "В свежей осыпи нашли кладку гладких серых камней величиной с хлеб; они тёплые на ощупь, и тепло это не уходит ни ночью, ни в тумане."

objects:
  - id: thing
    type: object
    name: "Тёплые камни"
    description: "Дюжина гладких серых камней в песчаной ямке. Все одного размера и все тёплые."

fronts:
  - id: main
    title: "Понять, что такое тёплые камни"
    form: find
    description: "Одни говорят, что это яйца, другие, что такой камень. Хранители просят не трогать кладку, пока не станет ясно."
    impact: SIGNIFICANT
    beatCount: 2
    refs: [thing]
    alignment: "Двигают дело навес над кладкой, наблюдение днём и ночью, счёт тепла и осторожная проба одного камня."
    stake:
      create:
        type: resource
        name: "Каменные ящерки"
        description: "В подвалах и амбарах города живут серые ящерки, которые едят плесень и ржу; зерно и книги при них целее."
        weight: SIGNIFICANT
        statProfile: { knowledge: 2, prosperity: 3 }
        refs: [thing]
    clues:
      - id: they-move
        fact: "Камни понемногу поворачиваются в ямке сами."
        alignment: "Наблюдение днём и ночью."
      - id: they-hatch
        fact: "Это яйца: из них выходят серые ящерки, которые едят плесень и ржу."
        alignment: "Навес, тепло и терпение."
