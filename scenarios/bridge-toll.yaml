id: bridge-toll
title: Плата за мост
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: custom, sphere: influence }
pitch: Квартал у оврага перегородил единственный мост цепью и берёт плату с каждого воза; соседний квартал грозит сорвать цепь силой.

objects:
  - id: bridge
    type: structure
    name: Овражный мост
    description: Каменный мост через овраг, по которому идёт весь путь с полей на рынок. Его чинит квартал, что стоит рядом.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: keepers
    type: community
    name: Мостовой квартал
    description: Жители квартала у моста. Чинят его на свои деньги три поколения и решили, что пора городу платить.
    refs: [bridge]

fronts:
  - id: chain-on-bridge
    title: Цепь на мосту
    form: tension
    description: Возчики и рыночные торговцы платить не хотят и собираются рвать цепь. Мостовой квартал ставит у моста своих людей с дубинами.
    impact: MINOR
    drift: FAST
    refs: [bridge, keepers]
    alignment: |
      Снимают цепь доля на починку моста из городской казны, почёт мостовому кварталу, общий сбор по справедливой мере.
    stake:
      stats: { influence: -3, prosperity: -2 }
    events:
      - id: cart
        description: Воз с зерном опрокинули у цепи, мешки полетели в овраг.
