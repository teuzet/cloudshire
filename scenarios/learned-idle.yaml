id: learned-idle
title: Учёные без дела
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: custom, sphere: knowledge }
pitch: Школа хранителя выучила грамоте и счёту сотни юношей; писцов городу столько не нужно, а к плугу и горну они возвращаться не хотят.

objects:
  - id: school
    type: organization
    name: Школа хранителя
    description: Большая школа, куда берут детей всех сословий. Учит грамоте, счёту и началам наук.
    weight: SIGNIFICANT
    statProfile: { knowledge: 2 }
  - id: graduates
    type: community
    name: Грамотная молодёжь
    description: Сотни юношей и девушек, которые умеют читать и считать и не нашли себе места. Сидят по трактирам, спорят и пишут подмётные листки.
    refs: [school]

fronts:
  - id: idle-pens
    title: Грамотеи мутят город
    form: tension
    description: Листки высмеивают совет и храм, споры в трактирах кончаются драками с цеховыми. Отцы требуют закрыть школу.
    impact: MINOR
    drift: SLOW
    refs: [graduates, school]
    alignment: |
      Дают выход дело для грамотных; землемеры, счётчики при амбарах, учителя в деревнях, переписчики старых книг.
    stake:
      stats: { influence: -3, knowledge: -1 }
  - id: village-teachers
    title: Послать учителей в деревни
    form: deed
    description: В деревнях грамотен один из сотни. Если отправить туда выпускников школы, остров станет другим за одно поколение.
    impact: SIGNIFICANT
    refs: [graduates]
    closes:
      - { target: idle-pens, share: 0.6 }
    alignment: |
      Двигают дело жалованье и дом учителю от общины, уговор со старостами, уважение к деревенскому укладу.
    stake:
      create:
        type: practice
        name: Деревенские школы
        description: В деревнях острова учат грамоте и счёту.
        weight: SIGNIFICANT
        statProfile: { knowledge: 2, influence: 1 }
