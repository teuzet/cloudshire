id: iron-oath
title: Железная присяга
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: people, sphere: security }
pitch: Среди стражи расходится тайная присяга «порядок выше совета»; присягнувшие сами решают, кого бить и кого выгонять из города.

objects:
  - id: oath
    type: organization
    name: Братство железной присяги
    description: Стражники с железным колечком на мизинце. Считают, что совет мягок, а город спасёт только жёсткая рука.
    weight: MINOR
    statProfile: { security: 1 }
  - id: founder
    type: person
    name: Основатель присяги
    description: Присягу придумал и принимает начальник городской тюрьмы, человек тихий и исполнительный, которого никто не подозревает. Списки присягнувших он ведёт в тюремной книге под видом счёта колодок.
    refs: [oath]
    hidden: true

fronts:
  - id: oath-rules
    title: Стража судит сама
    form: tension
    description: Присягнувшие по ночам выбивают двери неугодным и выгоняют пришлых за ворота. Маршалу они кланяются, но приказы выбирают.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [oath]
    alignment: |
      Возвращают стражу под руку маршала разговор с рядовыми о том, что их злит, суд над самоуправством, перемены в службе, которые отвечают на их обиды.
    stake:
      stats: { security: -3, influence: -4 }
  - id: who-swears
    title: Кто принимает присягу
    description: Найти того, кто стоит за братством.
    impact: MINOR
    beatCount: 2
    refs: [oath]
    closes:
      - { target: oath-rules, share: 0.5 }
    alignment: |
      Двигает дело доверенный стражник внутри братства, поиск места, где присягают, проверка служебных книг.
    stake:
      uncover: { target: founder }
    clues:
      - id: rings
        fact: Колечки присяги выкованы из звеньев тюремных кандалов.
        alignment: Осмотр колец и расспросы кузнецов.
