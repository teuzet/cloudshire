id: mirror-tarn
title: Зеркальное озеро
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: knowledge }
pitch: "После долгого безветрия горное озеро стало показывать на своей глади небо под островом; в нём видно то, что идёт к острову снизу и из-за кромки."

objects:
  - id: thing
    type: landmark
    name: "Зеркальное озеро"
    description: "Тихое горное озеро. В безветренные часы в нём отражается небо, которого с берега не видно."

fronts:
  - id: main
    title: "Поставить дозор у зеркального озера"
    form: find
    description: "Озеро показывает нижнее небо только в тихую воду и только под одним углом. Хранители хотят понять, когда ему можно верить."
    impact: SIGNIFICANT
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело наблюдения по часам, щиты от ветра вокруг воды, сверка увиденного с дозорами на кромке."
    stake:
      create:
        type: building
        name: "Дозор у зеркального озера"
        description: "У озера стоит дозорный дом, и хранители видят то, что подходит к острову снизу."
        weight: SIGNIFICANT
        statProfile: { knowledge: 3, security: 3 }
        refs: [thing]
    clues:
      - id: still-hours
        fact: "Озеро показывает нижнее небо на рассвете и на закате, когда воздух над водой стоит."
        alignment: "Наблюдения по часам."
