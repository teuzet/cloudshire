id: shut-gates
title: Ворота, которые закрылись сами
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: phenomenon, sphere: security }
pitch: Древние бронзовые ворота города, которые никто не закрывал сто лет, однажды утром оказались затворены и не поддаются ни людям, ни волам; возы с полей стоят под стеной.

objects:
  - id: gates
    type: structure
    name: Бронзовые ворота основателей
    description: Две створки в три роста, ушедшие в стену так давно, что о них забыли. Теперь стоят сомкнутые, тёплые на ощупь, и за ними что-то глухо постукивает.
    weight: MINOR
    statProfile: { security: 1 }
  - id: engine
    type: site
    name: Воздушная камера в толще стены
    description: В стене над воротами основатели устроили запаянную медную камеру с тонкой перепонкой. Когда воздух снаружи тяжелеет перед великой бурей, перепонка прогибается и отпускает противовесы, и ворота смыкаются; откроются они сами, когда буря пройдёт. Такой бури не было сто лет.
    refs: [gates]
    hidden: true

fronts:
  - id: why-shut
    title: Почему закрылись ворота
    description: Узнать, что затворило ворота и как их открыть.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [gates]
    alignment: |
      Двигает дело осмотр стены и надвратной башни, поиск в хрониках, когда ворота закрывались прежде, осторожная разборка кладки над створками.
    stake:
      uncover: { target: engine }
    clues:
      - id: chronicle
        fact: Хроника упоминает «день сомкнутых ворот» за три дня до бури, снёсшей старый рынок.
        alignment: Поиск в хрониках прежних закрытий ворот.
      - id: knock
        fact: Стук за створками учащается, когда небо на востоке темнеет.
        alignment: Наблюдение за воротами день и ночь.
  - id: carts-outside
    title: Город отрезан от полей
    description: Через калитки не пройти возу. Урожай лежит под стеной, а рынок пустеет.
    impact: MINOR
    drift: FAST
    refs: [gates]
    alignment: |
      Отводят беду пролом в малой стене, подъёмные вороты и носильщики, торг под стеной снаружи.
    stake:
      stats: { prosperity: -3, influence: -1 }
