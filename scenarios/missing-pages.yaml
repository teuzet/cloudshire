id: missing-pages
title: Вырванные страницы
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: matter, sphere: knowledge }
pitch: Из городского архива пропадают листы из межевых и родословных книг; вырезаны аккуратно, острым ножом.

objects:
  - id: archive
    type: building
    name: Городской архив
    description: Палата со сводами, где лежат межевые, податные и родословные книги города за многие поколения.
    weight: MINOR
    statProfile: { knowledge: 1, influence: 1 }
  - id: cutter
    type: person
    name: Младший архивариус
    description: Младший архивариус вырезает листы по заказу разбогатевшего скотопромышленника, которому нужно стереть записи о том, что его луга были общинными, а дед пришлым батраком. Вырезанное он не жжёт, а прячет в полом корешке старого требника, чтобы держать заказчика в руках.
    refs: [archive]
    hidden: true

fronts:
  - id: who-cuts
    title: Кто режет книги
    description: Узнать, кто и зачем вырезает листы из архива.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [archive]
    alignment: |
      Двигает дело опись пропавшего, поиск общего в вырезанных записях, проверка тех, кто входит в архив.
    stake:
      uncover: { target: cutter }
    clues:
      - id: common
        fact: Все пропавшие листы касаются одних и тех же лугов и одного рода.
        alignment: Сличение пропавших листов по описям.
      - id: knife
        fact: Листы вырезаны переплётным ножом, какие есть только у служителей архива.
        alignment: Осмотр книг и срезов.
  - id: records-doubt
    title: Записям больше нет веры
    form: tension
    description: Если книги можно резать, любой межевой спор теперь решает тот, кто громче кричит. Старые тяжбы оживают одна за другой.
    impact: MINOR
    drift: SLOW
    refs: [archive]
    alignment: |
      Возвращают веру опись и замки, вторые списки важных книг, свидетели старых межей.
    stake:
      stats: { knowledge: -2, influence: -2 }
