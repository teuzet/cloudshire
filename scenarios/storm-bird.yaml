id: storm-bird
title: Гнездо грозовой птицы
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: security }
pitch: На шпиле самой высокой башни города свила гнездо огромная небесная птица с пером цвета тучи; с тех пор как она здесь, кромочные хищники обходят город стороной.

objects:
  - id: bird
    type: landmark
    name: Грозовая птица
    description: Птица с размахом крыльев в ширину улицы. Сидит на шпиле неподвижно, как флюгер, и кричит перед грозой так, что звенят стёкла. В гнезде одно яйцо.
    weight: MINOR
    statProfile: { security: 1, influence: 1 }

fronts:
  - id: keep-bird
    title: Прижить грозовую птицу
    form: deed
    description: Если птица выведет птенца и вернётся на шпиль, город получит сторожа, какого не купить. Нужно понять, чем она кормится, и сделать так, чтобы город ей не мешал.
    impact: SIGNIFICANT
    refs: [bird]
    alignment: |
      Двигают дело наблюдение за повадками птицы, тишина и запрет лазать на башню, подкормка на дальнем уступе, почёт птице как гостье покровителя.
    stake:
      create:
        type: practice
        name: Грозовые стражи на шпилях
        description: Грозовые птицы гнездятся на башнях города, отгоняют небесных хищников и криком предупреждают о грозе.
        weight: SIGNIFICANT
        statProfile: { security: 2, influence: 1 }
        refs: [bird]
  - id: egg-thieves
    title: На яйцо есть охотники
    description: За яйцо грозовой птицы знатные дома сулят состояние. Кто-нибудь полезет на шпиль, и тогда птица бросит гнездо или убьёт вора вместе с половиной кровли.
    impact: MINOR
    drift: FAST
    refs: [bird]
    alignment: |
      Берегут гнездо стража у башни, запрет на торг яйцом под страхом изгнания, слово храма о птице.
    stake:
      delete: { target: bird }
