id: edge-burial
title: Могильщики против кромки
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: custom, sphere: influence }
pitch: Кладбище переполнено, совет велел провожать умерших в бездну с кромки, а могильщики отказываются и хоронят тайком в лесу.

objects:
  - id: diggers
    type: community
    name: Могильщики
    description: Замкнутый цех, который поколениями хоронит горожан в земле. Верят, что отданный бездне теряет дорогу к покровителю.
  - id: graveyard
    type: site
    name: Старое кладбище
    description: Тесное кладбище за храмом. Свободной земли на нём почти не осталось.
    refs: [diggers]

fronts:
  - id: burial-row
    title: Умерших негде хоронить
    form: tension
    description: Тела ждут погребения по нескольку дней, семьи ропщут. Могильщики стоят на своём, совет на своём.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [diggers, graveyard]
    alignment: |
      Развязывают узел новое место под кладбище, обряд, который примут и храм и могильщики, слово верховного жреца о бездне.
      Силой могильщиков к кромке не привести.
    stake:
      stats: { influence: -4, security: -2 }
    events:
      - id: forest
        description: В лесу за городом нашли свежие могилы без знаков; семьи умерших молчат.
