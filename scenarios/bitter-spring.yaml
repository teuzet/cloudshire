id: bitter-spring
title: Горький ключ
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: matter, sphere: prosperity }
pitch: "После осыпи в овраге пробился горький ключ; вода из него, выпаренная в котле, оставляет белую соль чище той, что город выменивает в сопряжение."

objects:
  - id: thing
    type: site
    name: "Горький ключ"
    description: "Тонкая струя горькой воды в глинистом овраге. Камни вокруг неё покрыты белой коркой."

fronts:
  - id: main
    title: "Поставить солеварню у ключа"
    form: deed
    description: "Ключ слаб и может уйти в осыпь так же, как пришёл. Если обложить его камнем и поставить варницу, у города будет своя соль."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело каменная обкладка ключа, широкие котлы, дрова и умение солеваров, которые помнят ремесло по рассказам стариков."
    stake:
      create:
        type: building
        name: "Солеварня у горького ключа"
        description: "У ключа стоит варница, и город солит мясо и рыбу своей солью."
        weight: MINOR
        statProfile: { prosperity: 3, security: 1 }
        refs: [thing]
