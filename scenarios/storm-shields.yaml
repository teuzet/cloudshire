id: storm-shields
title: Порча перед бурей
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: sky, sphere: security }
pitch: Перед каждой сильной бурей кто-то снимает клинья со штормовых ставен на складах у кромки; ветер срывает кровли, а из развалин пропадает товар.

objects:
  - id: shields
    type: structure
    name: Штормовые ставни кромочных складов
    description: Тяжёлые щиты и ставни, которыми закрывают склады у кромки перед бурей. Держатся на дубовых клиньях.
    weight: MINOR
    statProfile: { security: 1 }
  - id: wreckers
    type: organization
    name: Артель «починщиков»
    description: Артель кровельщиков сама выбивает клинья перед бурей, чтобы после получить подряд на починку, а её люди под шумок выносят товар из вскрытых складов. Клинья они складывают в своём сарае как дрова.
    refs: [shields]
    hidden: true

fronts:
  - id: who-pulls
    title: Кто выбивает клинья
    description: Узнать, почему ставни перед бурей оказываются незапертыми.
    impact: MINOR
    beatCount: 2
    refs: [shields]
    closes:
      - { target: next-storm, share: 0.7 }
    alignment: |
      Двигает дело метка клиньев, дозор у складов перед бурей, расспросы о том, кто чинил кровли после прошлых бурь.
    stake:
      uncover: { target: wreckers }
    clues:
      - id: same
        fact: Все склады после бурь чинила одна и та же артель, и всегда оказывалась рядом первой.
        alignment: Расспросы хозяев складов о починке.
  - id: next-storm
    title: Следующая буря вскроет склады
    description: Небо хмурится, а половина ставен держится на честном слове. Сильная буря разнесёт склады и всё, что в них.
    impact: MINOR
    drift: FAST
    refs: [shields]
    alignment: |
      Отводят беду проверка и новые клинья на всех ставнях, стража у складов, перенос ценного вглубь города.
    stake:
      stats: { security: -2, prosperity: -3 }
