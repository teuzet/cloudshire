id: walking-grove
title: Кочующая роща
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: phenomenon, sphere: prosperity }
pitch: Ореховая роща, что испокон стояла на земле одной деревни, за год переползла через межу на землю другой; деревья и правда сдвигаются на шаг каждую ночь, и орех теперь собирают чужие.

objects:
  - id: grove
    type: resource
    name: Кочующая роща
    description: Сотня старых ореховых деревьев. Наутро каждое стоит на шаг дальше, чем вечером, а позади остаётся рыхлая борозда. Роща идёт ровно на восток.
    weight: MINOR
    statProfile: { prosperity: 1, knowledge: 1 }
  - id: west
    type: settlement
    name: Закатная деревня
    description: Сажала и холила рощу десять поколений. Считает, что роща её, куда бы та ни ушла.
  - id: east
    type: settlement
    name: Восходная деревня
    description: Роща стоит на её земле и сосёт её воду. Считает, что орех теперь её.

fronts:
  - id: nut-feud
    title: Чей орех
    form: tension
    description: Сбор близко. Закатные придут с мешками, восходные встретят их у межи с дрекольем.
    impact: MINOR
    drift: FAST
    refs: [grove, west, east]
    alignment: |
      Мирят деревни делёж сбора на этот год, уговор о том, чья роща, пока она идёт, общий сторож.
    stake:
      stats: { security: -2, prosperity: -2 }
  - id: where-grove-goes
    title: Куда идёт роща
    description: Узнать, что гонит деревья на восток и где они остановятся.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [grove]
    alignment: |
      Двигает дело вешки и замеры каждое утро, раскопки борозд, чтение деревенских преданий о роще.
    stake:
      reveal:
        text: Роща идёт за подземной жилой тёплой воды, которая смещается к восточной кромке; через три года деревья выйдут к обрыву и встанут там, где жила выходит наружу тёплым ключом.
    clues:
      - id: roots
        fact: Корни в свежих бороздах тёплые на ощупь и все вытянуты в одну сторону.
        alignment: Раскопки борозд за рощей.
      - id: tale
        fact: В предании закатной деревни роща «пришла с заката при прадедах прадедов».
        alignment: Чтение и расспросы о деревенских преданиях.
