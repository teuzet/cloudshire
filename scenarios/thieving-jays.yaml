id: thieving-jays
title: Учёные сойки
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: creature, sphere: prosperity }
pitch: С прилавков ювелиров и из открытых окон пропадают мелкие ценные вещи; люди видели, как их уносят птицы.

objects:
  - id: jays
    type: threat
    name: Вороватые сойки
    description: Стайка пёстрых соек хватает блестящее с прилавков и подоконников и уносит всегда в одну сторону.
  - id: trainer
    type: person
    name: Птичник из слободы
    description: Разорившийся птицелов выучил соек носить блестящее в голубятню на своём чердаке за горсть орехов. Добычу он переплавляет и сбывает ювелиру на другом конце города.
    refs: [jays]
    hidden: true

fronts:
  - id: whose-jays
    title: Чьи это птицы
    description: Узнать, кто научил соек воровать и куда они носят добычу.
    impact: MINOR
    beatCount: 2
    refs: [jays]
    alignment: |
      Двигает дело слежка за полётом птиц, приманка с меченой вещью, расспросы птицеловов и скупщиков.
    stake:
      uncover: { target: trainer }
    clues:
      - id: nuts
        fact: Пойманная сойка ручная и ищет орехи в ладони.
        alignment: Поимка и осмотр одной из птиц.
      - id: melt
        fact: У одного ювелира появилось много лома без клейм.
        alignment: Расспросы ювелиров и скупщиков.
  - id: jewellers-shut
    title: Ювелиры закрывают лавки
    form: tension
    description: Мастера тонкой работы прячут товар и торгуют из-под полы. Соседи косятся друг на друга и бьют всех птиц подряд.
    impact: MINOR
    drift: STEADY
    refs: [jays]
    alignment: |
      Успокаивают улицу сетки и ставни, поимка птиц, поиск хозяина вместо избиения всех пернатых.
    stake:
      stats: { prosperity: -2, influence: -1 }
