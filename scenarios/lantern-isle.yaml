id: lantern-isle
title: Островок с горящими фонарями
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: knowledge }
pitch: К краю острова прибивает малое тело с башней, на котором по ночам сами зажигаются фонари.

objects:
  - id: island
    type: site
    name: Островок с горящими фонарями
    description: Малое тело, прибившееся к краю острова. Ночью вдоль его кромки сами зажигаются фонари.
    weight: MINOR
    statProfile: { knowledge: 1, influence: 1 }
  - id: tower
    type: structure
    name: Башня на островке
    description: Закрытая башня. Дверь держит старый засов, окна темны.
    refs: [island]

fronts:
  - id: obtain-recipe
    title: Тайна башни на островке
    description: Добраться до рецепта, который спрятан в башне.
    impact: SIGNIFICANT
    drift: NONE
    beatCount: 2
    refs: [tower, island]
    alignment: |
      Фронт двигают действия, которые реально исследуют устройство башни,
      преодолевают её защиту и приближают экспедицию к лаборатории.
      Подготовка, не связанная с проникновением, сама по себе прогресс не даёт.
    stake:
      reveal:
        text: Рецепт был способом удерживать островок на месте.
    clues:
      - id: inscriptions
        fact: Надписи описывают изменение направления движения острова.
        alignment: Расшифровка надписей, языков и символов.
      - id: machinery
        fact: Центральный механизм башни связан с подъёмной силой островка.
        alignment: Исследование механизмов, устройств и инженерных узлов.
