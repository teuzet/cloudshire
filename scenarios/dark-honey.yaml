id: dark-honey
title: Тёмный мёд
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: ecology, sphere: knowledge }
pitch: "Дикие пчёлы заселили расщелину у самой кромки; их мёд почти чёрный и горчит, а раны под повязкой с ним затягиваются чисто и быстро."

objects:
  - id: thing
    type: resource
    name: "Пчёлы в расщелине"
    description: "Большой рой диких пчёл в узкой расщелине над обрывом. Соты уходят глубоко в камень."

fronts:
  - id: main
    title: "Добыть и испытать тёмный мёд"
    form: deed
    description: "До сот можно добраться только на верёвках над бездной, и взять много значит погубить рой. Лекари хотят понять, чем этот мёд лечит."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело верёвочные лазы, дымари бортников, осторожные пробы лекарей на ранах и попытка переселить часть роя в колоды."
    stake:
      create:
        type: resource
        name: "Запас тёмного мёда"
        description: "У лекарей есть тёмный мёд для ран и рой в колодах, который его даёт."
        weight: MINOR
        statProfile: { knowledge: 2, security: 1 }
        refs: [thing]
