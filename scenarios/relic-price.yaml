id: relic-price
title: Цена реликвии
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: custom, sphere: prosperity }
pitch: Идёт сопряжение, и храм соседей предлагает за городскую реликвию столько зерна и железа, что хватит на годы; казна пуста, а народ реликвию чтит.

objects:
  - id: relic
    type: object
    name: Чаша основателей
    description: Простая каменная чаша, из которой, по преданию, пили первые жители города. Раз в год её выносят к народу.
    weight: MINOR
    statProfile: { influence: 2 }
  - id: buyers
    type: organization
    name: Посланцы соседского храма
    description: Жрецы с соседнего острова. Считают чашу и своей святыней и готовы платить щедро, пока острова рядом.

fronts:
  - id: sell-or-keep
    title: Соседи ждут ответа о чаше
    form: tension
    description: Сопряжение кончится, и предложение уйдёт вместе с ним. Казначей считает зерно, храм готовит проклятия, площадь гудит.
    impact: SIGNIFICANT
    drift: FAST
    refs: [relic, buyers]
    alignment: |
      Развязывают узел решение, объявленное народу с причинами, иной товар или услуга соседям взамен чаши, общий обряд двух храмов.
    stake:
      stats: { influence: -3, prosperity: -2 }
