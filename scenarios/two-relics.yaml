id: two-relics
title: Две святыни
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: matter, sphere: influence }
pitch: В деревенской часовне нашли посох основателя города, точь-в-точь такой, как тот, что хранится в городском храме; оба храма называют чужой подделкой.

objects:
  - id: city-staff
    type: object
    name: Посох в городском храме
    description: Тёмный посох с костяным навершием, главная святыня города. Перед ним приносят клятвы.
    weight: MINOR
    statProfile: { influence: 2 }
  - id: village-staff
    type: object
    name: Посох из деревенской часовни
    description: Такой же посох, найденный под алтарём старой часовни. Деревня уже водит к нему паломников.

fronts:
  - id: which-true
    title: Какой посох настоящий
    description: Узнать правду о двух посохах.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [city-staff, village-staff]
    closes:
      - { target: temple-split, share: 0.7 }
    alignment: |
      Двигает дело сличение дерева и резьбы, чтение храмовых описей, расспросы о том, как часовня получила свой посох.
    stake:
      reveal:
        text: Настоящие оба; основатель ходил с двумя посохами, дорожным и обрядовым, и завещал один городу, другой деревне, где родился. Опись об этом лежит в храме под чужим переплётом.
    clues:
      - id: wood
        fact: Оба посоха вырезаны из одного ствола, годовые кольца сходятся.
        alignment: Сличение дерева и резьбы обоих посохов.
  - id: temple-split
    title: Клятвы теряют силу
    form: tension
    description: Если святыня поддельна, чего стоят клятвы, данные перед ней? Купцы и старосты уже требуют переприсяги, деревни идут к своей часовне.
    impact: MINOR
    drift: STEADY
    refs: [city-staff, village-staff]
    alignment: |
      Удерживают веру общая служба двух храмов, слово верховного жреца, почёт обеим святыням до конца разбирательства.
    stake:
      stats: { influence: -4 }
