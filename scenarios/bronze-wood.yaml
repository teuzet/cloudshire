id: bronze-wood
title: Бронзовое дерево
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: ecology, sphere: security }
pitch: "В сердце старой рощи лесорубы нашли дерево, чья древесина тонет в воде, звенит под топором и не гниёт; вокруг него растёт молодая поросль той же породы."

objects:
