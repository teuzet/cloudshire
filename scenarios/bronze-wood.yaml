    title: "Вырастить бронзовую рощу"
    form: deed
    description: "Старое дерево одно, а поросль тонка и растёт медленно. Срубить ствол сейчас значит получить немного доброго леса и потерять породу."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело ограда от скота, пересадка поросли, пробы плотников на сухостое и запрет рубить старый ствол."
    stake:
      create:
        type: resource
        name: "Бронзовая роща"
        description: "В огороженной роще растёт порода, древесина которой идёт на сваи, ворота и засовы."
        weight: SIGNIFICANT
        statProfile: { security: 3, prosperity: 2 }
        refs: [thing]
