id: rock-library
title: Кельи в скале
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: knowledge }
pitch: "Обвал открыл в скале ряд вырубленных келий; стены их от пола до свода покрыты резными строками, и это письмо основателей."

objects:
  - id: thing
    type: site
    name: "Кельи в скале"
    description: "Десяток келий, вырубленных в отвесной скале. Резные строки на стенах забиты пылью и мхом."

fronts:
  - id: main
    title: "Прочесть кельи"
    form: find
    description: "Строк тысячи, а читать старое письмо умеют трое стариков. Скала после обвала ещё дышит, и часть келий может уйти вниз."
    impact: SIGNIFICANT
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело леса и крепь у скалы, оттиски строк на ткани, ученики при знатоках старого письма."
    stake:
      create:
        type: building
        name: "Скальная библиотека"
        description: "Кельи укреплены, строки сняты на оттиски и прочитаны; город знает ремёсла и законы основателей из первых рук."
        weight: SIGNIFICANT
        statProfile: { knowledge: 5, influence: 1 }
        refs: [thing]
    clues:
      - id: craft-books
        fact: "Каждая келья отведена одному ремеслу: в первой прочитанной записано, как основатели лили бронзу."
        alignment: "Оттиски и знатоки старого письма."
