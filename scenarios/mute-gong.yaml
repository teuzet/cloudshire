id: mute-gong
title: Умолкший гонг
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: phenomenon, sphere: knowledge }
pitch: Каменный гонг в святилище на скале, который сам гудел перед каждой бурей, замолчал; бури теперь приходят без предупреждения.

objects:
  - id: gong
    type: landmark
    name: Буревой гонг
    description: Плоская каменная плита в святилище на скале. Поколениями она сама начинала гудеть за день до бури. Теперь молчит.
    weight: MINOR
    statProfile: { security: 1, knowledge: 1 }
  - id: nest
    type: site
    name: Забитая расщелина под гонгом
    description: Под плитой идёт узкая расщелина, через которую тянуло воздух перед бурей; от этой тяги плита и гудела. Расщелину завалило при недавней добыче камня по соседству.
    refs: [gong]
    hidden: true

fronts:
  - id: why-mute
    title: Почему молчит гонг
    description: Узнать, отчего гонг гудел раньше и что заставило его умолкнуть.
    impact: MINOR
    beatCount: 2
    refs: [gong]
    alignment: |
      Двигает дело осмотр скалы вокруг святилища, записи хранителей о прежних бурях, расспросы каменотёсов.
    stake:
      uncover: { target: nest }
    clues:
      - id: draft
        fact: Старые служители помнят, что перед бурей из-под плиты всегда тянуло холодом.
        alignment: Расспросы служителей святилища.
  - id: blind-storm
    title: Буря придёт без знака
    description: Без гонга город узнаёт о буре, когда она уже над крышами. Первая же сильная застанет людей в полях и на лесах.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [gong]
    alignment: |
      Отводят беду дозорные на высоких точках, приметы пастухов и птичников, укрытия вдоль дорог.
    stake:
      stats: { security: -4, prosperity: -2 }
