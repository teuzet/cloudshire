id: empty-remedy
title: Пустое снадобье
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: people, sphere: knowledge }
pitch: Заезжий из дальней деревни знахарь продаёт «небесную соль» от всех болезней; больные бросают лекарей, а трое уже умерли.

objects:
  - id: quack
    type: person
    name: Продавец небесной соли
    description: Ласковый человек с ларцом серых крупинок. Говорит, что собрал их с камня, упавшего с неба. Крупинки эти толчёный мел с золой, и он это знает.
  - id: buyers
    type: community
    name: Поверившие в соль
    description: Сотни горожан, которые носят соль в ладанках и дают её больным детям вместо лекарств.
    refs: [quack]

fronts:
  - id: salt-kills
    title: Больные бросают лечение
    description: Люди с горячкой и ранами лечатся солью и приходят к лекарям слишком поздно. Смертей будет больше.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [quack, buyers]
    alignment: |
      Останавливают беду проверка соли при народе, слово лекарей и храма, помощь больным, которые поверили.
      Изгнание без объяснений сделает из продавца мученика.
    stake:
      stats: { knowledge: -3, security: -3 }
    events:
      - id: child
        description: В ткацкой слободе умер ребёнок, которого неделю лечили одной солью; отец винит лекарей.
