id: sky-wreck
title: Осколок с изгнанниками
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: sky, sphere: security }
pitch: В кромку острова врезается малый осколок скалы; на нём живут изгнанники с чужого острова и хранят непонятный груз.

objects:
  - id: wreck
    type: site
    name: Осколок у кромки
    description: Малый осколок скалы с разбитой хижиной врезался в кромку острова и застрял, половина висит над пустотой. Камень скрипит на каждом порыве ветра.
    weight: MINOR
    statProfile: { security: -1 }
  - id: survivors
    type: community
    name: Изгнанники с осколка
    description: Горстка измученных людей с чужого острова, годами живших на осколке. Говорят с акцентом, держатся вместе и не отходят от хижины.
    refs: [wreck]
  - id: cargo
    type: object
    name: Ящики в хижине
    description: Ящики торгового дома с чужого острова. Внутри семена ветроцвета, растения, чьи коробочки собирают влагу из облаков, и земля под ним не сохнет; дом держал его в тайне. Старший изгнанник украл семена, за кражу его семью высадили на осколок, и семена ушли с ними.
    refs: [wreck]
    hidden: true

fronts:
  - id: shelter-survivors
    title: Приютить изгнанников
    form: deed
    description: Изгнанникам нужны кров, еда и место в городе. Если их примут, они станут частью города со своими умениями.
    impact: MINOR
    refs: [survivors, wreck]
    alignment: |
      Двигают дело кров, еда и лечение для изгнанников.
      Помогает тот, кто говорит с ними на равных и находит им работу по умению.
    stake:
      stats: { prosperity: 2, influence: 2 }
  - id: open-cargo
    title: Что в ящиках изгнанников
    description: Изгнанники уклончиво говорят о ящиках. Узнать, что в них и за что этих людей изгнали.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [wreck, survivors]
    alignment: |
      Двигает дело осторожный осмотр хижины и разговоры с изгнанниками.
      Помогает знание чужих клейм, языков и обычаев соседних островов.
    stake:
      uncover: { target: cargo }
    clues:
      - id: brand
        fact: Клеймо на ящиках принадлежит торговому дому, которого боятся на соседних островах.
        alignment: Изучение клейм, печатей и торговых записей.
      - id: captain
        fact: Изгнанников высадили на осколок в наказание за кражу у торгового дома.
        alignment: Расспросы изгнанников, поиск их записей и писем.
  - id: wreck-falls
    title: Осколок сорвётся с кромки
    description: Осколок понемногу сползает. Когда он сорвётся, то обрушит за собой край острова.
    impact: MINOR
    drift: STEADY
    refs: [wreck]
    alignment: |
      Удерживают осколок цепи, распорки и разбор его по частям.
      Помогают мастера, привычные к работе над пустотой.
    stake:
      stats: { security: -3, prosperity: -2 }
    events:
      - id: creak
        description: Ночью осколок просел на локоть, с кромки сорвались камни.
