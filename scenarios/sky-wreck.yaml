id: sky-wreck
title: Обломки чужого корабля
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: sky, sphere: security }
pitch: В кромку острова врезается разбитый небесный корабль с чужого острова; на борту выжившие и непонятный груз.

objects:
  - id: wreck
    type: site
    name: Обломки чужого корабля
    description: Разбитый корпус застрял в кромке острова, нос висит над пустотой. Обшивка скрипит на каждом порыве ветра.
    weight: MINOR
    statProfile: { security: -1 }
  - id: survivors
    type: community
    name: Выжившие с корабля
    description: Горстка измученных людей с чужого острова. Говорят с акцентом, держатся вместе и не отходят от обломков.
    refs: [wreck]
  - id: cargo
    type: object
    name: Груз в трюме
    description: Ящики торгового дома с соседнего острова. Внутри семена ветроцвета, растения, чьи коробочки дают подъёмную силу; дом держал его в тайне. Капитан украл семена, чтобы продать их сопернику дома.
    refs: [wreck]
    hidden: true

fronts:
  - id: shelter-survivors
    title: Приютить выживших
    form: deed
    description: Выжившим нужны кров, еда и место в городе. Если их примут, они станут частью города со своими умениями.
    impact: MINOR
    refs: [survivors, wreck]
    alignment: |
      Двигают дело кров, еда и лечение для выживших.
      Помогает тот, кто говорит с ними на равных и находит им работу по умению.
    stake:
      stats: { prosperity: 2, influence: 2 }
  - id: open-cargo
    title: Что вёз корабль
    description: Выжившие уклончиво говорят о грузе. Узнать, что в трюме и кому это везли.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [wreck, survivors]
    alignment: |
      Двигает дело осторожный осмотр трюма и разговоры с выжившими.
      Помогает знание чужих клейм, языков и торговых путей.
    stake:
      uncover: { target: cargo }
    clues:
      - id: brand
        fact: Клеймо на ящиках принадлежит торговому дому, которого боятся на соседних островах.
        alignment: Изучение клейм, печатей и торговых записей.
      - id: captain
        fact: Капитан корабля сбежал от своих хозяев вместе с грузом.
        alignment: Расспросы выживших, поиск судового журнала.
  - id: wreck-falls
    title: Обломки сорвутся с кромки
    description: Корпус понемногу сползает. Когда он сорвётся, то обрушит за собой край острова.
    impact: MINOR
    drift: STEADY
    refs: [wreck]
    alignment: |
      Удерживают обломки цепи, распорки и разбор корпуса по частям.
      Помогают мастера, привычные к работе над пустотой.
    stake:
      stats: { security: -3, prosperity: -2 }
    events:
      - id: creak
        description: Ночью корпус просел на локоть, с кромки сорвались камни.
