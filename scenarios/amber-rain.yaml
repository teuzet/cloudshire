id: amber-rain
title: Янтарный дождь
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: prosperity }
pitch: "После ночной грозы на крыши и выгоны выпали капли застывшей небесной смолы; они горят ровно, долго и без копоти, а дождь и роса понемногу их размывают."

objects:
  - id: thing
    type: resource
    name: "Небесный янтарь"
    description: "Жёлтые застывшие капли величиной с орех, рассыпанные по крышам, дворам и выгонам. Горят чистым ровным пламенем."

fronts:
  - id: main
    title: "Собрать небесный янтарь"
    form: deed
    description: "Янтарь лежит под открытым небом и тает от сырости. Если собрать его и понять, как лить из него свечи, городу хватит света на годы."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело сборщики по дворам и выгонам, сухие погреба, опыты свечников с фитилём и формой."
    stake:
      create:
        type: resource
        name: "Запас небесного янтаря"
        description: "В сухих погребах города лежит запас небесной смолы, и свечники льют из неё свечи без копоти."
        weight: MINOR
        statProfile: { prosperity: 2, knowledge: 1 }
        refs: [thing]
