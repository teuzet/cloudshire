id: watch-balks
title: Стража обходит квартал
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: people, sphere: security }
pitch: Ночная стража отказывается ходить в старый квартал у кромки; стражники говорят о бледных огнях и голосах в пустых домах.

objects:
  - id: quarter
    type: district
    name: Старый квартал у кромки
    description: Полупустые каменные дома над самым краем. Здесь живут те, кому больше негде, и ночью улицы тёмные.
  - id: gang
    type: organization
    name: Шайка с бледными фонарями
    description: Шайка воров устроила склад в пустых домах квартала. Они пугают стражу и жильцов фонарями со светящейся гнилушкой и криками через печные трубы.
    refs: [quarter]
    hidden: true

fronts:
  - id: who-haunts
    title: Что пугает стражу
    description: Узнать, что за огни и голоса гонят стражников из квартала.
    impact: MINOR
    beatCount: 2
    refs: [quarter]
    closes:
      - { target: quarter-lost, share: 0.6 }
    alignment: |
      Двигает дело ночная засада, расспросы жильцов, осмотр пустых домов при свете дня.
    stake:
      uncover: { target: gang }
    clues:
      - id: rot
        fact: В подвале пустого дома нашли горшок со светящейся гнилушкой и свежие следы.
        alignment: Осмотр пустых домов днём.
      - id: goods
        fact: Вещи, украденные на рынке, всплывают у перекупщиков возле старого квартала.
        alignment: Расспросы торговцев и перекупщиков.
  - id: quarter-lost
    title: Квартал остаётся без закона
    form: tension
    description: Без обходов в квартале хозяйничают те, кто посмелее. Жильцы запираются с закатом и перестают верить страже.
    impact: MINOR
    drift: STEADY
    refs: [quarter]
    alignment: |
      Возвращают порядок обходы с факелами и в большем числе, свет на улицах, доверие жильцов к стражникам.
    stake:
      stats: { security: -3, influence: -1 }
