id: hermit-cure
title: Отшельница с дальнего края
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: people, sphere: knowledge }
pitch: Охотники рассказывают о старухе, что живёт одна у дальней кромки и подняла на ноги парня, которого городские лекари сочли мёртвым.

objects:
  - id: hermit
    type: person
    name: Отшельница
    description: Сухая неразговорчивая старуха в хижине у дальней кромки. Лечит охотников и пастухов отварами, о которых в городе не слышали. Гостей не любит и в город не ходит.

fronts:
  - id: learn-cure
    title: Перенять её умение
    form: deed
    description: Отшельница стара, и её знание уйдёт вместе с ней. Если найти к ней подход, она может взять учеников или надиктовать то, что знает.
    impact: SIGNIFICANT
    refs: [hermit]
    alignment: |
      Двигают дело терпение и уважение, помощь по хозяйству, ученик, который придётся ей по нраву.
      Приказ и посулы она слушать не станет.
    stake:
      create:
        type: practice
        name: Лечебник отшельницы
        description: Лекари города знают и применяют отвары отшельницы с дальнего края.
        weight: SIGNIFICANT
        statProfile: { knowledge: 2, security: 1 }
  - id: healers-envy
    title: Лекари зовут её ведьмой
    form: tension
    description: Городские лекари теряют больных, которые идут к отшельнице. Они требуют запретить её снадобья и подбивают храм объявить её знание нечистым.
    impact: MINOR
    drift: SLOW
    refs: [hermit]
    alignment: |
      Унимают лекарей проверка её отваров при них самих, общая работа над больными, слово хранителя.
    stake:
      stats: { knowledge: -2, influence: -2 }
