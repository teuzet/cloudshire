id: crumbling-rim
title: Деревня над осыпью
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: matter, sphere: security }
pitch: Кромка острова под старой деревней рыбаков облачной сети пошла трещинами; жители отказываются уходить с земли предков.

objects:
  - id: village
    type: settlement
    name: Деревня на кромке
    description: Старая деревня на самом краю. Её люди ловят сетями на шестах то, что несёт ветер из облаков; птицу, пух и летучее семя.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: cracks
    type: threat
    name: Трещины в кромке
    description: Длинные трещины идут через огороды и под крайние дома. После каждого дождя они шире на палец.
    refs: [village]

fronts:
  - id: rim-falls
    title: Край уйдёт вместе с домами
    description: Крайний ряд домов стоит над пустотой. Если людей не увести или кромку не скрепить, осыпь заберёт их ночью.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [village, cracks]
    alignment: |
      Спасают людей новое место для деревни поблизости от их промысла, крепь и отвод воды, слово стариков, которым деревня верит.
    stake:
      stats: { security: -4, influence: -2 }
    events:
      - id: shed
        description: Ночью в бездну ушёл сарай с сетями; хозяин успел выскочить.
