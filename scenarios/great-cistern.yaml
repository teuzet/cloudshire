id: great-cistern
title: Цистерна основателей
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: security }
pitch: "Под рыночной площадью провалилась плита, и открылся сухой каменный зал на сотню шагов с целыми сводами и желобами; основатели держали в нём воду."

objects:
  - id: thing
    type: structure
    name: "Сухая цистерна под площадью"
    description: "Огромный зал со сводами на каменных столбах. Пол сух, желоба забиты землёй."

fronts:
  - id: main
    title: "Вернуть воду в цистерну"
    form: deed
    description: "Своды целы, но желоба, по которым сюда шла вода, давно потеряны под улицами. Найти их и расчистить значит дать городу запас воды на сухой год."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело расчистка желобов, поиск старых водосборов по уклону улиц, глина для швов и стража у провала."
    stake:
      create:
        type: structure
        name: "Большая цистерна"
        description: "Под площадью стоит полная цистерна, и город переживает сухой год и большой пожар."
        weight: SIGNIFICANT
        statProfile: { security: 3, prosperity: 2 }
        refs: [thing]
