id: silent-watchtower
title: Молчание небесной вышки
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: sky, sphere: knowledge }
pitch: Пастухи у дальней кромки видят в небе тёмное пятно, которое растёт, а небесная вышка города докладывает, что небо чисто; тем временем кто-то скупает дома подальше от того края.

objects:
  - id: tower
    type: building
    name: Небесная вышка
    description: Башня с трубами и угломерами, откуда хранители следят за небом. По её слову город готовится к бурям и сопряжениям.
    weight: MINOR
    statProfile: { knowledge: 1, security: 1 }
  - id: rock
    type: threat
    name: Глыба на пути острова
    description: К дальней кромке идёт необитаемая каменная глыба с городской квартал величиной; через несколько месяцев она ударит в край у рыбачьих деревень и снесёт часть берега. Старший смотритель вышки знает это с прошлого года и молчит; он тайно продал свой дом у того края и скупает землю в середине острова через подставного племянника.
    refs: [tower]
    hidden: true

fronts:
  - id: what-comes
    title: Что видят пастухи в небе
    description: Узнать, что за пятно растёт у дальней кромки и почему вышка о нём молчит.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [tower]
    alignment: |
      Двигает дело своё наблюдение с дальней кромки, проверка журналов вышки, расспросы о недавних сделках с землёй.
    stake:
      uncover: { target: rock }
    clues:
      - id: journal
        fact: В журнале вышки страницы о дальнем крае неба за последний год переписаны одной рукой и одними чернилами.
        alignment: Проверка журналов небесной вышки.
      - id: deeds
        fact: Племянник старшего смотрителя, бедный писарь, за год купил четыре участка в середине острова.
        alignment: Расспросы о сделках с землёй и домами.
  - id: rim-unwarned
    title: Дальний край ничего не ждёт
    description: Что бы ни шло с той стороны, деревни у дальней кромки живут как жили. Если беда придёт, их некому будет предупредить.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [tower]
    alignment: |
      Берегут людей дозор на дальней кромке, запасное место для деревень, честные вести о небе.
    stake:
      stats: { security: -5, influence: -2 }
