id: whisper-mirror
title: Зеркало, которое слушает
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: phenomenon, sphere: influence }
pitch: Знатные люди города один за другим получают письма с требованием платы за молчание; в письмах есть то, что говорилось только в запертых комнатах.

objects:
  - id: letters
    type: threat
    name: Письма шантажиста
    description: Короткие письма без подписи. В каждом пересказан разговор, который вёлся с глазу на глаз, и названа цена молчания.
    weight: MINOR
    statProfile: { influence: -1 }
  - id: mirror
    type: object
    name: Парные зеркала
    description: Старинные парные зеркала из тёмного металла; сказанное перед одним слышно у другого. Одно висит в приёмной модного портного, куда знать ходит на примерки и где ждёт часами, второе стоит у портного в задней комнате.
    hidden: true

fronts:
  - id: how-knows
    title: Откуда шантажист знает
    description: Узнать, как чужие разговоры попадают в письма.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [letters]
    closes:
      - { target: nobles-pay, share: 0.8 }
    alignment: |
      Двигает дело расспросы получивших письма о том, где велись разговоры, ложный разговор как приманка, поиск общего места.
    stake:
      uncover: { target: mirror }
    clues:
      - id: place
        fact: Все пересказанные разговоры велись в одной и той же приёмной.
        alignment: Сличение того, где бывали получившие письма.
      - id: echo
        fact: Служанка слышала в задней комнате портного голоса, хотя там никого не было.
        alignment: Расспросы слуг и подмастерьев.
  - id: nobles-pay
    title: Знать платит и молчит
    form: tension
    description: Те, кому есть что скрывать, платят и боятся друг друга. Совет города не может решить ни одного дела, потому что никто не говорит прямо.
    impact: MINOR
    drift: STEADY
    refs: [letters]
    alignment: |
      Развязывают языки защита тем, кто признается, огласка писем, общий отказ платить.
    stake:
      stats: { influence: -4 }
