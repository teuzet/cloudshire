id: dry-fleece
title: Немокнущая шерсть
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: prosperity }
pitch: "К стаду горных коз прибился чужой баран с густой сизой шерстью, с которой вода скатывается, как с листа; пастухи не знают, откуда он взялся."

objects:
  - id: thing
    type: resource
    name: "Сизый баран"
    description: "Крупный баран с сизой шерстью. Держится со стадом, а в руки не даётся."

fronts:
  - id: main
    title: "Вывести сизую породу"
    form: deed
    description: "Баран один, стар и дик. Если его не поймать и не дать ему потомства за этот сезон, шерсть уйдёт вместе с ним."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело загон в горах, терпение пастухов, отбор лучших коз и овец под нового производителя."
    stake:
      create:
        type: resource
        name: "Сизая порода"
        description: "В стадах города ходят овцы с шерстью, которая не мокнет; из неё валяют плащи для дозорных и пастухов."
        weight: MINOR
        statProfile: { prosperity: 2, security: 1 }
        refs: [thing]
