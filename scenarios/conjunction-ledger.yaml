id: conjunction-ledger
title: Книга встреч
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: custom, sphere: knowledge }
pitch: В сундуке умершего старика нашли тетради, где его род триста лет записывал каждое сопряжение и приметы перед ним.

objects:
  - id: ledger
    type: object
    name: Тетради считавших встречи
    description: Связка ветхих тетрадей, исписанных разными руками. В них даты сопряжений, имена островов и то, что видели в небе за месяцы до каждой встречи. Записи идут особым семейным письмом.
    weight: MINOR
    statProfile: { knowledge: 1 }

fronts:
  - id: read-ledger
    title: Прочесть тетради
    description: Разобрать семейное письмо и понять, можно ли по этим приметам заранее узнавать о сопряжении.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [ledger]
    alignment: |
      Двигают дело разбор письма, сличение записей с городскими хрониками, наблюдение за небом по указанным приметам.
    stake:
      reveal:
        text: За полгода до каждого сопряжения над краем острова по ночам видели бледное зарево, а птицы меняли места гнездовий; род считавших встречи ни разу не ошибся.
    clues:
      - id: script
        fact: Письмо тетрадей складывается из знаков, какими мечут скот и межевые камни.
        alignment: Сличение знаков с метками на старых камнях и клеймами.
      - id: match
        fact: Три последние записи день в день совпадают с городской хроникой.
        alignment: Сверка тетрадей с хрониками города.
