id: long-fog
title: Долгий туман
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: crisis, source: sky, sphere: security }
pitch: Остров вошёл в облако и не выходит из него третью неделю; в тумане не видно вытянутой руки, люди срываются с кромки, поля гниют.

objects:
  - id: fog
    type: threat
    name: Долгий туман
    description: Плотный белый туман лежит на всём острове. Звуки глохнут, огни видны за десять шагов.
    weight: MINOR
    statProfile: { security: -1 }

fronts:
  - id: fog-takes
    title: Туман забирает людей
    description: Путники сбиваются с дорог, пастухи выходят на кромку. Каждую неделю кого-то недосчитываются.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [fog]
    alignment: |
      Берегут людей канаты вдоль дорог и кромки, колокола и рожки на перекрёстках, запрет ходить в одиночку.
    stake:
      stats: { security: -4, influence: -1 }
  - id: fog-rot
    title: Хлеб преет на корню
    description: Без солнца колос чернеет. Если не спасти хоть часть урожая, туман отзовётся голодом.
    impact: MINOR
    drift: STEADY
    refs: [fog]
    alignment: |
      Спасают урожай ранняя жатва и сушка под крышей у огня, сбор того, что туман любит, грибов и мха.
    stake:
      stats: { prosperity: -3 }
