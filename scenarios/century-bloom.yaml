id: century-bloom
title: Вековой цвет
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: ecology, sphere: knowledge }
pitch: На горных лугах зацвела трава, которая цветёт раз в поколение; по записям лекарей, её цвет снимает боль лучше всего, что знает город.

objects:
  - id: bloom
    type: resource
    name: Вековой цвет
    description: Невзрачная серая трава, вдруг покрывшая луга синими кистями. Цвести будет недолго.

fronts:
  - id: gather-bloom
    title: Собрать и изучить вековой цвет
    form: deed
    description: Старые лечебники расходятся в том, как сушить цвет и сколько давать. Если собрать его с умом и проверить на деле, лекари получат средство на десятилетия.
    impact: SIGNIFICANT
    refs: [bloom]
    alignment: |
      Двигают дело сборщики под началом травников, сушка в тени, осторожные пробы на больных, запись каждого опыта.
      Помогает семя, оставленное на лугах, и попытка вырастить цвет в саду.
    stake:
      create:
        type: resource
        name: Запас векового цвета
        description: У лекарей города есть запас сильного обезболивающего и записи о том, как его давать.
        weight: SIGNIFICANT
        statProfile: { knowledge: 2, security: 1 }
