id: sky-rays
title: Стая небесных скатов
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: creature, sphere: knowledge }
pitch: Под островом проходит стая огромных летающих скатов, часть из них остаётся вить гнёзда в его днище.

objects:
  - id: rays
    type: community
    name: Небесные скаты
    description: Огромные плоские существа, которые парят в восходящих потоках. Стая кружит под островом и садится на его днище.
  - id: nests
    type: site
    name: Гнёзда скатов под днищем
    description: Скаты лепят гнёзда к камню под островом. Камень вокруг гнёзд крошится.
    refs: [rays]

fronts:
  - id: tame-rays
    title: Приручить скатов
    form: deed
    description: Скаты не злые и подпускают людей, если подходить без страха. Приручённые скаты могли бы носить людей вдоль кромки и под днище острова.
    impact: SIGNIFICANT
    refs: [rays, nests]
    alignment: |
      Двигают дело терпеливое наблюдение за скатами, подкормка, люди, которые не боятся высоты.
    stake:
      create:
        type: capability
        name: Наездники на скатах
        description: Люди города умеют подзывать скатов и кружить на них вдоль кромки острова.
        weight: SIGNIFICANT
        statProfile: { security: 1, prosperity: 1, knowledge: 1 }
        refs: [rays]
  - id: nests-crumble
    title: Гнёзда крошат днище
    description: Скаты вьют гнёзда в камне под островом. Если их не отвадить или не переселить, днище начнёт осыпаться.
    impact: MINOR
    drift: SLOW
    refs: [nests]
    alignment: |
      Снимают угрозу укрепление камня, перенос гнёзд в безопасное место, договор со скатами через тех, кто их понимает.
    stake:
      stats: { security: -3 }
    events:
      - id: rocks
        description: С днища сорвался большой камень, едва не задев подвесные мостки у кромки.
