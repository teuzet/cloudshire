id: seed-cellar
title: Семенной погреб основателей
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: knowledge }
pitch: "Под храмовым садом нашли погреб с сотнями запечатанных кувшинов; в каждом семена, и на каждом знак растения, которого на острове давно нет."

objects:
  - id: thing
    type: object
    name: "Кувшины с семенами"
    description: "Ряды глиняных кувшинов под восковыми печатями. На боках выдавлены знаки растений."

fronts:
  - id: main
    title: "Вернуть забытые растения"
    form: deed
    description: "Семенам сотни лет, и взойдёт ли хоть одно, неизвестно. Каждый вскрытый кувшин это одна попытка."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело разбор знаков по старым травникам, пробные посевы малой долей, тёплые гряды и запись каждого всхода."
    stake:
      create:
        type: resource
        name: "Сад забытых семян"
        description: "В храмовом саду растут хлеб, плоды и травы основателей, и садовники раздают их семена по деревням."
        weight: SIGNIFICANT
        statProfile: { knowledge: 3, prosperity: 3 }
        refs: [thing]
