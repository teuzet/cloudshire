id: sleepless-city
title: Город без сна
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: crisis, source: phenomenon, sphere: knowledge }
pitch: Целая улица, а потом и квартал перестали спать; люди лежат с открытыми глазами ночь за ночью и слабеют.

objects:
  - id: wake
    type: threat
    name: Бессонница
    description: Люди в верхнем квартале не могут уснуть по пять, по десять ночей. Сначала злятся, потом путают слова, потом падают на ходу.
    weight: MINOR
    statProfile: { security: -1 }
  - id: hum
    type: object
    name: Треснувший колокол на старой звоннице
    description: Большой колокол заброшенной звонницы треснул и на ветру тянет низкий, едва слышный гул. Ухо его не ловит, но тело от него не отдыхает; гул накрывает ровно те улицы, что лежат под звонницей.
    refs: [wake]
    hidden: true

fronts:
  - id: why-sleepless
    title: Что отняло у людей сон
    description: Найти причину бессонницы.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [wake]
    closes:
      - { target: sleepless-fall, share: 0.8 }
    alignment: |
      Двигает дело отметка на плане, кто не спит и где, расспросы о том, когда началось, ночёвки наблюдателей в квартале.
    stake:
      uncover: { target: hum }
    clues:
      - id: map
        fact: Бессонные дома лежат клином, который сходится к старой звоннице.
        alignment: Отметка бессонных домов на плане города.
      - id: wind
        fact: В безветренные ночи люди в квартале спят.
        alignment: Сличение бессонных ночей с погодой.
  - id: sleepless-fall
    title: Бессонные падают с ног
    description: Мастера калечатся у станков, стражники засыпают стоя и срываются со стен. Дальше будет хуже.
    impact: MINOR
    drift: STEADY
    refs: [wake]
    alignment: |
      Берегут людей ночлег в других кварталах, смены покороче, сонные отвары.
    stake:
      stats: { security: -2, prosperity: -2 }
