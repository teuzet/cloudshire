id: sky-reef
title: Небесный риф
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: ecology, sphere: security }
pitch: "К кромке прибило серое пористое тело, и оно приросло к скале; оно живое, растёт, как коралл, и за месяц нарастило кромку на десять шагов."

objects:
  - id: thing
    type: site
    name: "Небесный риф"
    description: "Серая пористая масса, приросшая к кромке. Твёрдая, как известняк, и тёплая в глубине."

fronts:
  - id: main
    title: "Вырастить новую кромку"
    form: deed
    description: "Риф растёт туда, где ему есть за что держаться. Если направить его и укрепить, у острова прибавится земли; если бросить, он обломится под своим весом."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело каменные упоры и плетни, по которым идёт рост, подкормка золой, запрет ломать риф на известь и первые посадки на новой земле."
    stake:
      create:
        type: site
        name: "Новая кромка"
        description: "Риф, выращенный по упорам, стал прочным уступом, и на нём уже стоят сушильни и огороды."
        weight: SIGNIFICANT
        statProfile: { security: 3, prosperity: 3 }
        refs: [thing]
