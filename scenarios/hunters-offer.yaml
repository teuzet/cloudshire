id: hunters-offer
title: Вольные следопыты
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: people, sphere: security }
pitch: Ватага бывалых следопытов с дальних урочищ пришла в город и предлагает службу; они знают каждую тропу острова, но не знают городского порядка.

objects:
  - id: trackers
    type: community
    name: Ватага следопытов
    description: Три десятка обветренных людей с длинными луками и собаками. Привыкли жить своим умом и слушать только своего старшого.

fronts:
  - id: hire-trackers
    title: Взять следопытов на службу
    form: deed
    description: С такими людьми город знал бы, что делается на любом конце острова, и находил бы пропавших и беглых за день. Нужно договориться о том, кому они подчиняются.
    impact: SIGNIFICANT
    refs: [trackers]
    alignment: |
      Двигают дело уговор со старшим ватаги, свой устав и своё место в стороне от казарм, первое общее дело со стражей.
    stake:
      create:
        type: organization
        name: Следопыты острова
        description: Ватага следопытов несёт дальний дозор и поиск для города.
        weight: SIGNIFICANT
        statProfile: { security: 2, knowledge: 1 }
        refs: [trackers]
  - id: trackers-brawl
    title: Следопыты не ладят с городом
    form: tension
    description: Ватага стоит табором у ворот, пьёт, дерётся со стражей и стреляет чужих гусей. Ещё пара недель, и её попросят уйти или она уйдёт сама.
    impact: MINOR
    drift: FAST
    refs: [trackers]
    alignment: |
      Удерживают ватагу дело и плата без проволочек, место для табора, уважение к их старшому.
    stake:
      delete: { target: trackers }
