id: meadow-border
title: Спор о межевом луге
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: people, sphere: security }
pitch: Две деревни острова косят один и тот же луг и уже дошли до кольев; каждая зовёт город в свидетели своей правды.

objects:
  - id: upper
    type: settlement
    name: Верхняя деревня
    description: Деревня на склоне над лугом. Говорит, что луг испокон её, и показывает дедовские межевые камни.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: lower
    type: settlement
    name: Нижняя деревня
    description: Деревня у ручья под лугом. Говорит, что камни передвинули ночью, и косит луг назло соседям.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: meadow
    type: resource
    name: Межевой луг
    description: Широкий сочный луг между двумя деревнями. Сена с него хватает на оба стада, если делить.
    refs: [upper, lower]

fronts:
  - id: villages-clash
    title: Деревни идут стенка на стенку
    form: tension
    description: Парни обеих деревень ходят на луг с кольями. Первая кровь уже была, следующая сходка кончится хуже.
    impact: SIGNIFICANT
    drift: FAST
    refs: [upper, lower, meadow]
    alignment: |
      Разводят деревни межа, проведённая при свидетелях, очередь покоса, общая работа под присмотром стражи.
      Помощь одной деревне без другой раздувает вражду.
    stake:
      stats: { security: -4, prosperity: -2 }
    events:
      - id: fire
        description: Ночью на лугу сгорели стога нижней деревни; виновных никто не видел.
