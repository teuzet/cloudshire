id: dead-city-shard
title: Мёртвый город на осколке
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: knowledge }
pitch: К кромке прибило осколок чужого острова с целой улицей покинутого города; дома полны утвари, книг и странных снастей, а осколок простоит у кромки считаные месяцы.

objects:
  - id: shard
    type: site
    name: Осколок с мёртвой улицей
    description: Кусок земли в триста шагов, на нём каменная улица в дюжину домов и башня с медным куполом. Людей нет, пыль лежит ровно.
  - id: rot
    type: threat
    name: Белая точильная пыль
    description: Улицу погубила белая плесень, которая за месяцы обращает в труху любое сухое дерево, от стропил до книжных досок; жители ушли, когда рухнули крыши. Её споры лежат в пыли на всём, что есть в домах, и оживают в тепле и сухости.
    refs: [shard]
    hidden: true

fronts:
  - id: take-knowledge
    title: Вынести книги и снасти
    form: deed
    description: В башне под куполом стоят трубы и круги, каких не знают городские звездочёты, а в домах лежат книги на понятном языке. Всё это можно перенести в город, пока осколок рядом.
    impact: SIGNIFICANT
    refs: [shard]
    alignment: |
      Двигают дело мостки на осколок, опись находок на месте, переписчики и мастера, которые разберут снасти, отдельный сарай для принесённого.
    stake:
      create:
        type: object
        name: Собрание с мёртвой улицы
        description: Книги и небесные снасти покинутого города хранятся и изучаются в городе.
        weight: SIGNIFICANT
        statProfile: { knowledge: 3 }
  - id: why-dead
    title: Отчего опустела улица
    description: Узнать, что случилось с жителями, прежде чем нести их добро в свои дома.
    impact: MINOR
    beatCount: 2
    refs: [shard]
    alignment: |
      Двигает дело чтение последних записей в домах, осмотр рухнувших крыш, пробы с вещами в закрытом сарае.
    stake:
      uncover: { target: rot }
    clues:
      - id: beams
        fact: Все стропила на улице превратились в белую труху, а камень и медь целы.
        alignment: Осмотр домов и рухнувших крыш.
      - id: diary
        fact: Последняя запись в домовой книге гласит «сожгли мебель, не помогло, уходим».
        alignment: Чтение записей, оставленных в домах.
