id: answering-stone
title: Камень-ответчик
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: phenomenon, sphere: influence }
pitch: В старой каменоломне нашли гладкий валун, который теплеет в руке, когда рядом говорят правду; город стал решать им все споры, судьи сидят без дела, а недавно камень оправдал явного вора.

objects:
  - id: stone
    type: object
    name: Камень-ответчик
    description: Серый валун с голову величиной на площади под навесом. К нему ведут спорщиков, женихов и должников, и как он скажет, так и будет.
    weight: SIGNIFICANT
    statProfile: { influence: 2 }
  - id: truth
    type: mystery
    name: Правило камня
    description: Камень теплеет от покоя того, кто его держит, а не от правды; спокойный лжец греет его лучше, чем напуганный честный человек. Первые месяцы его давали только простым людям, которые краснели от собственной лжи, потому он и не ошибался.
    refs: [stone]
    hidden: true

fronts:
  - id: stone-rules
    title: Город судится у камня
    form: tension
    description: Судей не слушают, клятвам без камня не верят. После оправдания вора одни требуют разбить камень, другие готовы убить за него.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [stone]
    alignment: |
      Удерживают мир суд, который пользуется камнем как одним из свидетелей, проверка камня при народе, слово верховного жреца.
    stake:
      stats: { influence: -4, security: -2 }
  - id: test-stone
    title: Отчего теплеет камень
    description: Узнать, на что на самом деле отзывается камень.
    impact: MINOR
    beatCount: 2
    refs: [stone]
    closes:
      - { target: stone-rules, share: 0.7 }
    alignment: |
      Двигает дело испытание камня заведомой правдой и заведомой ложью, разные люди с камнем в руках, записи всех случаев.
    stake:
      uncover: { target: truth }
    clues:
      - id: actor
        fact: В руках площадного лицедея камень теплеет на любые слова.
        alignment: Испытание камня с разными людьми.
      - id: child
        fact: Испуганный ребёнок сказал правду, а камень остался холодным.
        alignment: Запись и разбор случаев, когда камень удивил.
