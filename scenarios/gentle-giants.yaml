id: gentle-giants
title: Смирные исполины
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: prosperity }
pitch: "На дальний выгон опустились трое огромных небесных зверей, травоядных и смирных; они не уходят, земля от их навоза жирнеет, а один из них дал запрячь себя в волокушу с камнем."

objects:
  - id: thing
    type: community
    name: "Трое исполинов на выгоне"
    description: "Серые звери высотой с дом, с широкими плавниками и медленным нравом. Щиплют траву и кусты, людей не боятся."

fronts:
  - id: main
    title: "Ужиться с исполинами"
    form: deed
    description: "Звери съедают выгон за неделю и могут уйти так же, как пришли. Пастухи хотят понять, чем их удержать и на что их хватит."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело кормовые посадки, водопой, упряжь по мерке и люди, которые не боятся ходить у них под брюхом."
    stake:
      create:
        type: resource
        name: "Упряжные исполины"
        description: "Исполины живут на своём выгоне, возят камень и лес, а поля вокруг дают двойной урожай."
        weight: SIGNIFICANT
        statProfile: { prosperity: 4, security: 1 }
        refs: [thing]
