id: square-prophet
title: Пророк с площади
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: people, sphere: influence }
pitch: На площади появляется проповедник, который говорит от имени покровителя города, и у него всё больше слушателей.

objects:
  - id: prophet
    type: person
    name: Пророк с площади
    description: Худой человек в выцветшем плаще. Каждый вечер говорит на площади, что слышит голос покровителя города.
  - id: followers
    type: community
    name: Слушатели пророка
    description: Те, кто каждый вечер приходит слушать пророка. Их становится больше с каждой неделей.
    weight: MINOR
    statProfile: { influence: 1 }
    refs: [prophet]

fronts:
  - id: prophet-rises
    title: Пророк собирает толпу
    form: tension
    description: Пророк требует, чтобы город жил по его откровениям. Слушатели готовы идти за ним, и скоро толпа выйдет на улицы.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [prophet, followers]
    alignment: |
      Унимают толпу разговор с пророком при свидетелях, слово верховного жреца, дела, которые отвечают на страхи слушателей.
      Сила без объяснений только множит слушателей.
    stake:
      stats: { security: -4, influence: -3 }
    events:
      - id: sermon
        description: Пророк при всех назвал канцлера города неугодным покровителю и потребовал его ухода.
  - id: test-prophet
    title: Правду ли говорит пророк
    description: Узнать, кто этот человек и откуда его откровения.
    impact: MINOR
    beatCount: 2
    refs: [prophet]
    closes:
      - { target: prophet-rises, share: 0.4 }
    alignment: |
      Двигает дело расспрос тех, кто знал пророка раньше, и наблюдение за ним.
    stake:
      reveal:
        text: Пророк искренне верит в то, что говорит; его видения начались после того, как он едва не упал с края острова.
    clues:
      - id: past
        fact: До проповедей пророк был простым канатчиком и никогда не ходил в храм.
        alignment: Расспросы соседей и бывших товарищей пророка.
      - id: fall
        fact: Полгода назад пророк сорвался с кромки и чудом зацепился за канат.
        alignment: Поиск свидетелей его прошлого.
