id: sky-fair
title: Ярмарка сопряжения
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: people, sphere: prosperity }
pitch: Началось сопряжение с соседним островом; его купцы решают, ставить ли большую ярмарку в городе, пока острова не разошлись.

objects:
  - id: fair-envoys
    type: organization
    name: Совет ярмарки
    description: Старшины купцов соседнего острова, перешедшие по сопряжению. Решают, где и как торговать, пока острова рядом.

fronts:
  - id: host-fair
    title: Принять ярмарку
    form: deed
    description: Чтобы ярмарка пришла, городу нужны дорога к месту стыка, торговые ряды и угощение для гостей. Совет ярмарки ждёт ответа, пока сопряжение в силе.
    impact: SIGNIFICANT
    refs: [fair-envoys]
    alignment: |
      Двигают дело подготовка дороги к стыку и торговых рядов, щедрый приём старшин, обещания торговых льгот.
    stake:
      create:
        type: practice
        name: Ярмарка сопряжения
        description: Когда соседний остров сходится с городским, его купцы ставят ярмарку в городе.
        weight: SIGNIFICANT
        statProfile: { prosperity: 2, influence: 1 }
        refs: [fair-envoys]
