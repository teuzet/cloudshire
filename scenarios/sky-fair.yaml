    impact: SIGNIFICANT
    refs: [fair-envoys]
    alignment: |
      Двигают дело подготовка причалов и торговых рядов, щедрый приём старшин, обещания торговых льгот.
    stake:
      create:
        type: practice
        name: Ярмарка островов
        description: Каждое лето в город съезжаются торговцы с соседних островов.
