id: revered-beast
title: Седой вепрь
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: creature, sphere: security }
pitch: Огромный седой вепрь, которого лесные деревни чтят как хозяина леса, начал рвать пахарей на опушке; деревни запрещают его трогать.

objects:
  - id: boar
    type: threat
    name: Седой вепрь
    description: Старый вепрь ростом с телёнка, с обломанным клыком. Раньше не выходил из чащи, теперь бросается на людей у опушки.
    weight: MINOR
    statProfile: { security: -1 }
  - id: villagers
    type: community
    name: Лесные деревни
    description: Деревни под лесом. Верят, что пока жив седой вепрь, лес кормит людей, и носят ему первые жёлуди.
    refs: [boar]
  - id: wound
    type: object
    name: Обломок рогатины в боку вепря
    description: В боку вепря сидит обломок рогатины; его ранил заезжий охотник из города, тайком ходивший за клыками. Рана гноится, и зверь бросается на всякого, кто пахнет железом.
    refs: [boar]
    hidden: true

fronts:
  - id: boar-kills
    title: Вепрь выходит к людям
    description: Двое пахарей убиты, поля у леса стоят непахаными. Вепрь подходит всё ближе к домам.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [boar, villagers]
    alignment: |
      Отводят беду изгороди и дозоры на опушке, способ унять зверя, который примут деревни, либо охота с их согласия.
      Убийство вепря против воли деревень поднимет их на город.
    stake:
      stats: { security: -4, prosperity: -2 }
  - id: why-boar
    title: Что взбесило вепря
    description: Узнать, отчего старый зверь стал бросаться на людей.
    impact: MINOR
    beatCount: 1
    refs: [boar]
    closes:
      - { target: boar-kills, share: 0.5 }
    alignment: |
      Двигает дело слежка за зверем издали, расспросы лесных людей, поиск следов чужой охоты.
    stake:
      uncover: { target: wound }
    clues:
      - id: limp
        fact: Вепрь бережёт левый бок и оставляет на кустах гной.
        alignment: Слежка за зверем и осмотр его лёжек.
