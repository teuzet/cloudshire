id: white-sand
title: Пласт белого песка
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: prosperity }
pitch: "Осыпь у старой дороги открыла пласт белого песка; стекло из него выходит чистым, без пузыря и зелени, какого стеклодувы города ещё не варили."

objects:
  - id: thing
    type: resource
    name: "Пласт белого песка"
    description: "Слой мелкого белого песка в срезе осыпи. Над ним висит козырёк рыхлой земли."

fronts:
  - id: main
    title: "Взять белый песок"
    form: deed
    description: "Пласт лежит под нависшей осыпью, и первый же ливень может его похоронить. Нужны крепь, ход к пласту и печь под новое стекло."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело крепь из брёвен, отвод воды от осыпи, пробные варки стеклодувов."
    stake:
      create:
        type: resource
        name: "Копь белого песка"
        description: "Город берёт из укреплённой копи белый песок и варит из него чистое стекло."
        weight: MINOR
        statProfile: { prosperity: 2, knowledge: 1 }
        refs: [thing]
