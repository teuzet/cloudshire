id: founders-kiln
title: Печь основателей
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: knowledge }
pitch: "В заросшем овраге расчистили печь основателей, сложенную без раствора; она держит жар вдвое дольше любой городской, и никто не понимает почему."

objects:
  - id: thing
    type: structure
    name: "Печь основателей"
    description: "Приземистая печь из тёсаного камня, подогнанного без раствора. Свод цел, хотя ей не одна сотня лет."

fronts:
  - id: main
    title: "Разгадать кладку печи"
    form: find
    description: "Печники спорят, в камне дело или в том, как он уложен. Разобрать печь значит погубить её, а повторить её вслепую пока никому не удалось."
    impact: MINOR
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело обмеры и рисунки каждого ряда, пробные топки с записью жара, малые копии из того же камня."
    stake:
      create:
        type: capability
        name: "Кладка без раствора"
        description: "Печники города кладут горны и печи по способу основателей, и угля на них уходит вдвое меньше."
        weight: MINOR
        statProfile: { knowledge: 2, prosperity: 2 }
        refs: [thing]
    clues:
      - id: double-wall
        fact: "В стенах печи два ряда камня, и между ними оставлена пустота шириной в ладонь."
        alignment: "Обмеры и рисунки кладки."
