id: night-singers
title: Ночные певцы
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: influence }
pitch: "Стая небесных птиц встала на долгую ночёвку в скалах у кромки; по ночам они поют так, что люди из дальних деревень идут слушать их пешком."

objects:
  - id: thing
    type: community
    name: "Стая ночных певцов"
    description: "Сотня крупных серых птиц в скалах у кромки. Днём они молчат, а с темнотой заводят долгую стройную песню."

fronts:
  - id: main
    title: "Ночи певцов"
    form: deed
    description: "Птицы пробудут здесь до перемены ветра. Пока они поют, у кромки каждую ночь собирается полгорода и половина деревень, и это можно обратить в общий праздник."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело огни и настилы у кромки, угощение для пришедших из деревень, уговор не тревожить птиц и певцы города, которые перенимают напев."
    stake:
      create:
        type: practice
        name: "Ночи певцов"
        description: "Раз в год город и деревни сходятся у кромки на ночи песен, и напев небесных птиц знает каждый ребёнок."
        weight: MINOR
        statProfile: { influence: 3, knowledge: 1 }
        refs: [thing]
