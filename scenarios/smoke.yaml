id: smoke
cityName: Туманск
playerBrief:
  city: Туманный торговый город у края обрыва; цистерны, канатные мостки, влажный климат.
  ruler: Сдержанная правительница, внимательная к знамениям покровителя.
  freeform: Культ покровителя ещё неглубок; народ осторожен с чудесами и приказами с неба.

ambition: |
  Возьми одну линию — вода или торговля — и веди её заметными поручениями на месяцы.
  Город может сам обрастать проблемами: это ок, не туши всё подряд.

goals:
  - "Каждый ход говорить с правителем (сухо): статус, приказ или реакция на новости."
  - "Выбрать одну линию и двигать её приказами и уточнениями."
  - "После поручения — force_tick и смотреть новости месяца, потом корректировать курс."
  - "Не хвататься за всё сразу за пять месяцев."

scriptedActions:
  - talk: "Что в городе не так с водой и торговлей. Коротко."
  - talk: "Берись за то, что хуже. Запусти работу на месяцы."
  - tick: true
  - talk: "Что сдвинулось. Хватает ли людей."
  - tick: true
  - talk: "Держи курс. Если стопор — скажи в чём."
  - tick: true
  - talk: "Ещё месяц. Короткий доклад по делу."
  - tick: true
  - talk: "Итог: чем кончилось дело."
  - tick: true
