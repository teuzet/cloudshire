id: smoke
cityName: Туманск
playerBrief:
  city: Туманный торговый город у края обрыва; цистерны, канатные мостки, влажный климат.
  ruler: Сдержанная правительница, внимательная к знамениям покровителя.
  freeform: Культ покровителя ещё неглубок; народ осторожен с чудесами и приказами с неба.

ambition: |
  Смотри майлстоуны домена и толкай хотя бы один заметными поручениями на месяцы.
  Город может сам обрастать проблемами — это ок; не туши всё подряд, целишься в майлстоун.

goals:
  - "Каждый ход говорить с правителем (сухо): статус, приказ или реакция на новости."
  - "Выбрать 1–2 открытых майлстоуна и двигать их приказами / уточнениями."
  - "После поручения — force_tick и смотреть новости месяца, потом корректировать курс."
  - "Не пытаться закрыть все майлстоуны за пять месяцев."

scriptedActions:
  - talk: "Майлстоуны какие открыты. Что реально мешает первому."
  - talk: "Бери тот, что про воду или торговлю. Запусти работу на месяцы."
  - tick: true
  - talk: "Что сдвинулось. Хватает ли людей."
  - tick: true
  - talk: "Держи курс. Если стопор — скажи в чём."
  - tick: true
  - talk: "Ещё месяц. Короткий доклад по делу."
  - tick: true
  - talk: "Итог: ближе ли к майлстоуну."
  - tick: true
