id: storm-glass
title: Громовое стекло
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: sky, sphere: security }
pitch: "После грозы в песке у кромки находят стеклянные трубки, спёкшиеся от молнии; за полдня до бури они начинают тихо гудеть."

objects:
  - id: thing
    type: resource
    name: "Громовые трубки"
    description: "Шершавые стеклянные трубки длиной в руку, спёкшиеся из песка. Хрупкие, с ровным каналом внутри."

fronts:
  - id: main
    title: "Поставить громовые трубки на вышки"
    form: deed
    description: "Трубки ломаются от одного неловкого шага, и гудят они не все. Нужно найти годные и понять, как их слушать."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело бережный сбор после каждой грозы, отбор по звуку, гнёзда из войлока на вышках и дозорные с хорошим слухом."
    stake:
      create:
        type: practice
        name: "Громовые трубки на вышках"
        description: "На вышках стоят громовые трубки, и город знает о буре за полдня."
        weight: SIGNIFICANT
        statProfile: { security: 3, knowledge: 2 }
        refs: [thing]
