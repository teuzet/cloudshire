id: old-debt
title: Старый долг
pitch: С соседнего острова прибывает посланник с долговой грамотой, которую город подписал много поколений назад.

objects:
  - id: envoy
    type: person
    name: Посланник с долговой грамотой
    description: Вежливый, хорошо одетый посланник с соседнего острова. Привёз грамоту с древней печатью города.
  - id: deed
    type: object
    name: Долговая грамота
    description: Пожелтевший лист с печатью, похожей на древнюю печать города. По грамоте город должен соседям большую плату.

fronts:
  - id: pay-or-refuse
    title: Соседи требуют долг
    description: Посланник ждёт ответа. Если город не заплатит и не договорится, соседи объявят его должником и закроют для него свои причалы.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [envoy, deed]
    alignment: |
      Снимают угрозу переговоры, рассрочка, ответный подарок или доказательство, что грамота ложна.
      Помогает знание старых договоров и обычаев соседей.
    stake:
      stats: { prosperity: -5, influence: -4 }
    events:
      - id: rumor
        description: По городу пошёл слух, что сановники тайно согласились платить.
  - id: check-deed
    title: Настоящая ли грамота
    description: Проверить, подлинна ли грамота и что на самом деле обещали предки.
    impact: MINOR
    beatCount: 1
    refs: [deed]
    alignment: |
      Двигает дело сличение печатей, поиск в старых записях города, расспросы стариков.
    stake:
      reveal:
        text: Грамота подлинная, но долг давно погашен; запись о выплате хранится в старом архиве города.
    clues:
      - id: seal
        fact: Печать на грамоте настоящая, но такой печатью город перестал пользоваться давно.
        alignment: Сличение печатей и знаков.
