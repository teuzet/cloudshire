id: old-debt
title: Старый долг
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: custom, sphere: influence }
pitch: В пору сопряжения с соседнего острова приходит посланник с долговой грамотой, которую город подписал много поколений назад.

objects:
  - id: envoy
    type: person
    name: Посланник с долговой грамотой
    description: Вежливый, хорошо одетый посланник с соседнего острова, перешедший по сопряжению. Принёс грамоту с древней печатью города.
  - id: deed
    type: object
    name: Долговая грамота
    description: Пожелтевший лист с печатью, похожей на древнюю печать города. По грамоте город должен соседям большую плату.

fronts:
  - id: pay-or-refuse
    title: Соседи требуют долг
    description: Посланник ждёт ответа, пока острова сопряжены. Если город не заплатит и не договорится, соседи объявят его должником и в следующие сопряжения откажут ему в торговле.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [envoy, deed]
    alignment: |
      Снимают угрозу переговоры, рассрочка, ответный подарок или доказательство, что грамота ложна.
      Помогает знание старых договоров и обычаев соседей.
    stake:
      stats: { prosperity: -5, influence: -4 }
    events:
      - id: rumor
        description: По городу пошёл слух, что сановники тайно согласились платить.
  - id: check-deed
    title: Настоящая ли грамота
    description: Проверить, подлинна ли грамота и что на самом деле обещали предки.
    impact: MINOR
    beatCount: 1
    refs: [deed]
    closes:
      - { target: pay-or-refuse, share: 0.7 }
    alignment: |
      Двигает дело сличение печатей, поиск в старых записях города, расспросы стариков.
    stake:
      reveal:
        text: Грамота подлинная, но долг давно погашен; запись о выплате хранится в старом архиве города.
    clues:
      - id: seal
        fact: Печать на грамоте настоящая, но такой печатью город перестал пользоваться давно.
        alignment: Сличение печатей и знаков.
