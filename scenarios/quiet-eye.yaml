id: quiet-eye
title: Тихое око
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: knowledge }
pitch: "Над островом встало кольцо облаков с чистым небом внутри; хранители неба говорят, что в такое окно видно дальние острова, которых не видел никто из живущих."

objects:
  - id: thing
    type: landmark
    name: "Тихое око"
    description: "Круглое окно чистого неба в кольце высоких облаков. По ночам в нём видны огни, которых нет ни на одной небесной карте."

fronts:
  - id: main
    title: "Составить небесный атлас"
    form: find
    description: "Око простоит недолго. Всё, что хранители успеют увидеть и записать, останется городу навсегда."
    impact: SIGNIFICANT
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело ночные наблюдения с вышки, зрительные трубы, рисовальщики и сверка с книгами прежних хранителей."
    stake:
      create:
        type: object
        name: "Небесный атлас"
        description: "В книгохранилище лежит атлас дальнего неба с островами, которых город прежде не знал."
        weight: SIGNIFICANT
        statProfile: { knowledge: 4, influence: 1 }
        refs: [thing]
    clues:
      - id: far-lights
        fact: "Огни в оке стоят на месте из ночи в ночь: это острова, а не звёзды."
        alignment: "Ночные наблюдения и рисунки."
