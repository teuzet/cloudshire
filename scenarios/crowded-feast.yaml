id: crowded-feast
title: Праздник, который перерос город
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: custom, sphere: security }
pitch: Праздник огней с каждым годом собирает всё больше народу со всего острова; в прошлый раз в давке на мосту погибли люди, а в этот ждут вдвое больше.

objects:
  - id: feast
    type: practice
    name: Праздник огней
    description: Ночь, когда весь остров сходится в город с фонарями и идёт от ворот к храму. Гордость города и лучший торговый день.
    weight: SIGNIFICANT
    statProfile: { influence: 2, prosperity: 1 }

fronts:
  - id: crush
    title: Праздник кончится давкой
    description: Улицы узки, мосты стары, а людей придёт больше, чем когда-либо. Если ничего не изменить, праздник обернётся бедой.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [feast]
    alignment: |
      Отводят беду второй путь шествия, распорядители на мостах и перекрёстках, огни и угощение за стенами для тех, кто не поместится.
      Запрет праздника город не простит.
    stake:
      stats: { security: -4, influence: -2 }
