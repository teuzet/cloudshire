id: silent-bells
title: Молчащие колокола
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: custom, sphere: influence }
pitch: Звонари города перестали звонить, пока их умершего старшину не проводят по старому обряду, который совет давно отменил.

objects:
  - id: ringers
    type: community
    name: Братство звонарей
    description: Потомственные звонари городских башен. Отбивают часы, зовут на сход и провожают умерших.
    weight: MINOR
    statProfile: { influence: 1 }
  - id: rite
    type: practice
    name: Проводы под большой звон
    description: Старый обряд, когда умершего старшину звонарей провожают звоном всех башен от заката до рассвета. Совет отменил его поколение назад.
    refs: [ringers]

fronts:
  - id: bells-silent
    title: Город живёт без звона
    form: tension
    description: Без колоколов сбиваются смены, сходы и службы. Звонари ждут слова о проводах своего старшины, и молчание злит горожан всё сильнее.
    impact: MINOR
    drift: STEADY
    refs: [ringers, rite]
    alignment: |
      Возвращают звон проводы старшины с почётом, разговор со звонарями на равных, место обряду в жизни города.
      Принуждение и чужие руки на колокольнях ожесточают братство.
    stake:
      stats: { influence: -3, security: -1 }
    events:
      - id: missed
        description: Ночная смена стражи разошлась раньше срока, потому что никто не отбил час.
