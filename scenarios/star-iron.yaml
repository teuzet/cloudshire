id: star-iron
title: Железный дождь
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: sky, sphere: security }
pitch: Ночью на поля у города выпал дождь оплавленных железных слитков; металл из них не тупится и не ржавеет, и за слитки спорят хозяева полей, кузнецы и стража.

objects:
  - id: ingots
    type: resource
    name: Небесное железо
    description: Чёрные слитки от ореха до каравая, тысячи их лежат в бороздах на трёх полях. Клинок из такого железа рубит обычный гвоздь.
    weight: MINOR
    statProfile: { security: 1, prosperity: 1 }
  - id: owners
    type: community
    name: Хозяева железных полей
    description: Три семьи пахарей. Потеряли посев под слитками и считают, что небо заплатило им за убыток.
    refs: [ingots]

fronts:
  - id: iron-scramble
    title: Небесное железо растаскивают
    form: tension
    description: Ночью поля обирают чужие, хозяева стреляют из луков, кузнецы платят за слиток серебром и не спрашивают, чей он. Скоро у каждой шайки будет клинок, который рубит стражнический.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [ingots, owners]
    alignment: |
      Останавливают растаскивание сбор железа под счёт с долей хозяевам полей, запрет на тайную скупку, стража на полях.
    stake:
      stats: { security: -4, influence: -2 }
  - id: sky-blades
    title: Оружейная небесного железа
    form: deed
    description: Собранного железа хватит, чтобы вооружить стражу тем, чего нет ни у одного острова, или отлить из него колокол и плуги. Кузнецам ещё предстоит понять, как его греть.
    impact: SIGNIFICANT
    refs: [ingots]
    alignment: |
      Двигают дело опыты кузнецов с жаром и закалкой, общая кузня под присмотром, решение, на что пустить железо.
    stake:
      create:
        type: resource
        name: Запас небесного железа
        description: У города есть запас небесного железа и мастера, умеющие его ковать.
        weight: SIGNIFICANT
        statProfile: { security: 2, knowledge: 1 }
