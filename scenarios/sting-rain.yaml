id: sting-rain
title: Стрекучие нити
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: crisis, source: creature, sphere: security }
pitch: Над островом идёт стая небесных медуз, прозрачных куполов с дом величиной; их жгучие нити в сотню саженей волочатся по крышам и улицам, и кого коснутся, тот падает без чувств.

objects:
  - id: jellies
    type: threat
    name: Небесные медузы
    description: Сотни прозрачных куполов плывут над городом третий день и не кончаются. Нити с них висят до земли, почти невидимые, липнут к стенам и бельевым верёвкам.
    weight: MINOR
    statProfile: { security: -1 }

fronts:
  - id: threads-in-streets
    title: Нити на улицах
    description: Обожжённых уже десятки, двое не очнулись. Стая идёт медленно, и неизвестно, сколько ещё куполов за горизонтом.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [jellies]
    alignment: |
      Берегут людей шесты с крюками и мокрой рогожей для съёма нитей, крытые переходы, дым на крышах, уксус и зола на ожоги.
    stake:
      stats: { security: -4, prosperity: -2 }
    events:
      - id: market
        description: Нить легла поперёк рыночной площади; в давке обожгло два десятка человек.
  - id: thread-craft
    title: Что можно взять с нитей
    form: deed
    description: Высохшая нить крепче шёлка и больше не жжётся, а яд из свежей, говорят лекари, в малой доле усыпляет боль. Пока стая над городом, можно набрать и того и другого.
    impact: MINOR
    refs: [jellies]
    alignment: |
      Двигают дело сборщики в коже и рукавицах, сушка нитей на рамах, осторожные пробы лекарей.
    stake:
      create:
        type: resource
        name: Запас небесной нити
        description: У города есть запас прочной небесной нити и усыпляющего боль снадобья из неё.
        weight: MINOR
        statProfile: { prosperity: 1, knowledge: 1 }
