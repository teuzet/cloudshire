id: echo-well
title: Колодец с эхом
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: knowledge }
pitch: "Старый сухой колодец на окраине отвечает на удар камня долгим эхом; колодезники говорят, что по этому эху слышно, где под городом пустоты и где стоит вода."

objects:
  - id: thing
    type: landmark
    name: "Колодец с эхом"
    description: "Сухой колодец старой кладки. Удар о его стенку возвращается снизу долгим гулом, и гул этот всякий раз другой."

fronts:
  - id: main
    title: "Прослушать землю под городом"
    form: find
    description: "Эхо в колодце меняется от того, где ударить и в какой час. Тот, кто научится его читать, узнает, что лежит под улицами."
    impact: MINOR
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело терпеливые удары в разных местах и запись каждого отзвука, сверка с подвалами и старыми колодцами, слух музыкантов и колодезников."
    stake:
      create:
        type: object
        name: "Карта пустот под городом"
        description: "На карте отмечены пустоты, водяные жилы и слабые своды под улицами; по ней роют колодцы и ставят тяжёлые дома."
        weight: MINOR
        statProfile: { knowledge: 2, security: 1 }
        refs: [thing]
    clues:
      - id: first-notes
        fact: "Гул колодца ниже там, где под землёй стоит вода, и выше над сухими пустотами."
        alignment: "Запись отзвуков и сверка с известными колодцами."
