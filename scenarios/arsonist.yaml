id: arsonist
title: Поджигатель
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: people, sphere: security }
pitch: В городе один за другим горят склады и мастерские; на пепелищах находят одинаковые просмолённые жгуты.

objects:
  - id: fires
    type: threat
    name: Ночные пожары
    description: Три пожара за месяц, все в глухой час и все с подветренной стороны. Каждый раз огонь начинался с просмолённого жгута.
    weight: MINOR
    statProfile: { security: -1 }
  - id: culprit
    type: person
    name: Поджигатель
    description: Бывший смотритель пожарной вышки, которого прогнали со службы за пьянство. Он поджигает сам, чтобы первым поднять тревогу и вернуть себе место и почёт. Живёт в каморке у вышки, смолу берёт у канатчиков.
    hidden: true

fronts:
  - id: find-arsonist
    title: Кто поджигает город
    description: Найти того, кто стоит за пожарами.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [fires]
    closes:
      - { target: big-fire, share: 0.8 }
    alignment: |
      Двигает дело осмотр пепелищ, ночные засады, расспросы тех, кто первым оказывался у огня, поиск того, кто покупал смолу.
    stake:
      uncover: { target: culprit }
    clues:
      - id: first
        fact: На всех трёх пожарах тревогу первым поднимал один и тот же человек.
        alignment: Расспросы свидетелей о том, кто первым заметил огонь.
      - id: tar
        fact: Жгуты пропитаны канатной смолой, какую варят только в одном дворе.
        alignment: Изучение жгутов и поиск источника смолы.
  - id: big-fire
    title: Следующим загорится большое
    description: Пожары всё ближе к центру. Следующий жгут ляжет под городской амбар или под храм, и тогда выгорит полгорода.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [fires]
    alignment: |
      Отводят беду ночные дозоры, бочки и багры в каждом квартале, охрана амбаров и складов.
    stake:
      stats: { security: -4, prosperity: -3 }
    events:
      - id: fourth
        description: Ночью занялась кровля красильни у самого рынка; огонь едва удержали.
