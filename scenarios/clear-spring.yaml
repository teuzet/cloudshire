id: clear-spring
title: Чистый ключ
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: knowledge }
pitch: "Под храмовым холмом пробился ключ, вода которого не портится в бочке годами; у тех, кто пьёт её месяц, уходят застарелые хвори, и слух об этом идёт по всему острову."

objects:
  - id: thing
    type: landmark
    name: "Чистый ключ"
    description: "Холодный ключ в каменной чаше под холмом. Вода в нём чуть голубая и не цветёт даже в жару."

fronts:
  - id: main
    title: "Устроить жизнь вокруг ключа"
    form: deed
    description: "Воды в ключе немного, а нужна она всем. От того, как город её поделит, зависит, станет ли ключ общим благом или причиной вражды."
    impact: MAJOR
    refs: [thing]
    alignment: "Двигают дело каменная чаша и отвод, черёд для больных, лекари, которые записывают каждый случай, и закон о воде, принятый до первой драки."
    stake:
      create:
        type: landmark
        name: "Лечебница у чистого ключа"
        description: "У ключа стоит лечебница с твёрдым порядком; город забыл повальные хвори, и на него смотрит весь остров."
        weight: MAJOR
        statProfile: { knowledge: 4, influence: 3, security: 1 }
        refs: [thing]
