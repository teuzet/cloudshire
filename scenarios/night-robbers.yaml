id: night-robbers
title: Ночи грабежей
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: crisis, source: people, sphere: security }
pitch: После неурожая в деревнях в город хлынули голодные и отчаянные; что ни ночь, то вскрытая лавка или раздетый прохожий.

objects:
  - id: desperate
    type: community
    name: Пришлые из голодных деревень
    description: Сотни людей без работы и крова, ночуют под мостами и в пустых сараях. Большинство ищет подёнщину, некоторые ищут нож.
  - id: robberies
    type: threat
    name: Ночные грабежи
    description: Вскрытые лавки, срезанные кошели, избитые прохожие. Стража не успевает.
    weight: MINOR
    statProfile: { security: -1 }
    refs: [desperate]

fronts:
  - id: streets-unsafe
    title: Ночные улицы без защиты
    description: Лавочники нанимают своих громил, горожане запираются с закатом. Скоро начнут бить любого пришлого без разбора.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [robberies, desperate]
    alignment: |
      Возвращают порядок ночные обходы по кварталам, работа и ночлег для пришлых, фонари на улицах, суд над пойманными.
    stake:
      stats: { security: -4, influence: -2 }
