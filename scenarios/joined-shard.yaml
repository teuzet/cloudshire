id: joined-shard
title: Приросший осколок
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: prosperity }
pitch: "К наветренной кромке прибило необитаемый осколок с лесом, лугами и ручьём, величиной в четверть острова; он сел плотно, и каменотёсы говорят, что его можно удержать навсегда."

objects:
  - id: thing
    type: site
    name: "Большой осколок у кромки"
    description: "Лесистая земля с лугами и ручьём, притёртая к кромке. Между ней и островом щель в несколько шагов, и она то шире, то уже."

fronts:
  - id: main
    title: "Удержать новую землю"
    form: deed
    description: "Пока осколок держит только трение. Если связать его с островом камнем и корнями, у города станет на четверть больше земли, и её придётся делить."
    impact: MAJOR
    refs: [thing]
    alignment: "Двигают дело каменные замки и засыпка щели, посадка деревьев с цепкими корнями по шву, межевание новой земли до первого спора."
    stake:
      create:
        type: district
        name: "Новая земля"
        description: "Осколок сросся с островом. На новой земле стоят выселки, пасутся стада и растёт строевой лес."
        weight: MAJOR
        statProfile: { prosperity: 4, security: 1, influence: 2 }
        refs: [thing]
