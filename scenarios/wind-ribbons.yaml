id: wind-ribbons
title: Ветровые ленты
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: knowledge }
pitch: "К мельничному холму прибилась стайка небесных зверьков, похожих на длинные серые ленты; они вьются у ветряков и за час до перемены ветра сбиваются в клубок."

objects:
  - id: thing
    type: resource
    name: "Стайка ветровых лент"
    description: "Десяток небесных зверьков длиной в человеческий рост. Они кормятся мошкарой над холмом и чуют ветер раньше всех примет."

fronts:
  - id: main
    title: "Приручить ветровые ленты"
    form: deed
    description: "Ленты пугливы и уйдут с первым сильным ветром, если их не прикормить. Приручённые, они станут живой приметой для мельников и дозорных."
    impact: MINOR
    refs: [thing]
    alignment: "Двигают дело прикорм мошкарой и мёдом, шесты для ночёвки у вышки, терпение птичников и запрет гонять их камнями."
    stake:
      create:
        type: practice
        name: "Ветровые ленты при дозорной вышке"
        description: "У вышки живёт приручённая стайка, и дозорные по ней за час знают о перемене ветра."
        weight: MINOR
        statProfile: { knowledge: 2, security: 1 }
        refs: [thing]
