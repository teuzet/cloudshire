id: returned-heir
title: Двое вернувшихся
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: phenomenon, sphere: influence }
pitch: В город почти разом приходят двое, и каждый называет себя сыном старого рода, пропавшим в тумане у кромки двадцать лет назад.

objects:
  - id: first
    type: person
    name: Первый вернувшийся
    description: Обветренный человек с тихим голосом. Помнит дом, имена слуг и детские прозвища, но путается в том, где был все эти годы.
  - id: second
    type: person
    name: Второй вернувшийся
    description: Весёлый и речистый человек с родовым перстнем на пальце. О доме знает меньше, зато складно рассказывает о своих скитаниях.
  - id: house
    type: organization
    name: Осиротевший род
    description: Старый род без прямого наследника. Его земли и место в совете ждут хозяина.
    weight: MINOR
    statProfile: { influence: 1 }

fronts:
  - id: who-is-heir
    title: Кто из двоих настоящий
    description: Узнать, кто из пришедших говорит правду.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [first, second, house]
    closes:
      - { target: house-splits, share: 0.8 }
    alignment: |
      Двигает дело расспрос старых слуг и кормилицы, проверка рассказов обоих, поиск тех, кто видел их до прихода в город.
    stake:
      reveal:
        text: Настоящий наследник первый; второй был его спутником в скитаниях по дальнему краю острова и снял перстень с его руки, пока тот лежал в горячке.
    clues:
      - id: scar
        fact: Кормилица помнит ожог на плече мальчика; такой ожог есть только у первого.
        alignment: Расспросы кормилицы и старых слуг.
      - id: ring
        fact: Перстень второму велик и недавно подмотан ниткой.
        alignment: Осмотр вещей обоих пришедших.
  - id: house-splits
    title: Род и город делятся надвое
    form: tension
    description: У каждого вернувшегося уже есть сторонники в роду и на улицах. Чем дольше тянется спор, тем ближе драка за дом.
    impact: MINOR
    drift: STEADY
    refs: [first, second, house]
    alignment: |
      Удерживают мир опека над домом до решения, оба пришедших под присмотром, открытое разбирательство.
    stake:
      stats: { influence: -3, security: -1 }
