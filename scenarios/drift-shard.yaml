id: drift-shard
title: Осколок с кедрами
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: prosperity }
pitch: К кромке прибило необитаемый осколок, заросший вековыми кедрами; такого леса на острове нет, а осколок через несколько месяцев оторвёт и унесёт.

objects:
  - id: shard
    type: site
    name: Кедровый осколок
    description: Малое тело в полверсты длиной, прижатое ветром к кромке. На нём стоит нетронутый кедровый лес и бьёт ключ.

fronts:
  - id: take-cedar
    title: Взять кедр, пока осколок рядом
    form: deed
    description: Кедровый брус не гниёт и не боится жучка. Чтобы взять его, нужен надёжный переход на осколок и много рук.
    impact: SIGNIFICANT
    refs: [shard]
    alignment: |
      Двигают дело мостки и канаты на осколок, лесорубы и волоки, выбор лучших стволов, семена и саженцы кедра для своего острова.
    stake:
      create:
        type: resource
        name: Кедровый запас
        description: Склады кедрового бруса и молодая кедровая роща на острове.
        weight: SIGNIFICANT
        statProfile: { prosperity: 2, security: 1 }
  - id: shard-leaves
    title: Осколок оторвёт от кромки
    description: Ветер меняется, осколок скрипит и понемногу отходит. Кто окажется на нём в этот час, тот уйдёт в небо вместе с ним.
    impact: MINOR
    drift: STEADY
    refs: [shard]
    alignment: |
      Берегут людей дозорный у перехода, цепи и якоря, которые держат осколок дольше, порядок быстрого ухода с него.
    stake:
      delete: { target: shard }
    events:
      - id: gap
        description: За ночь щель между кромкой и осколком стала шире на шаг; мостки пришлось наращивать.
