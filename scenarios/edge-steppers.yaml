id: edge-steppers
title: Шагнувшие
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: custom, sphere: security }
pitch: В городе расходится учение, что шаг с кромки это прямая дорога к покровителю; за месяц с края шагнули семеро, все после ночных сходок.

objects:
  - id: sect
    type: community
    name: Братство последнего шага
    description: Тихие люди в серых повязках. Собираются по ночам у кромки, поют и говорят о лёгкости.
  - id: guide
    type: person
    name: Проводник братства
    description: Братство ведёт бывший храмовый певчий, которого выгнали за кражу подношений. Сам он шагать не собирается; уходящие отписывают имущество «на общее дело», и он держит его в сундуке у своей сестры в гончарной слободе.
    refs: [sect]
    hidden: true

fronts:
  - id: more-step
    title: С кромки уходят люди
    description: Братство растёт, и на каждой сходке кто-то решается. Следующими шагнут целые семьи.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [sect]
    alignment: |
      Удерживают людей разговор с ними без насмешки, слово верховного жреца о воле покровителя, помощь отчаявшимся, дозор у кромки.
      Разгон сходок силой загоняет братство в подвалы.
    stake:
      stats: { security: -4, influence: -3 }
  - id: who-leads
    title: Кто ведёт братство
    description: Узнать, кто учит людей шагать и что ему с того.
    impact: MINOR
    beatCount: 2
    refs: [sect]
    closes:
      - { target: more-step, share: 0.6 }
    alignment: |
      Двигает дело свой человек на сходках, расспросы родни ушедших, поиск того, куда делось их добро.
    stake:
      uncover: { target: guide }
    clues:
      - id: wills
        fact: Все семеро перед уходом отписали дома и лавки одному и тому же поверенному.
        alignment: Проверка того, что стало с имуществом ушедших.
      - id: voice
        fact: Родные слышали на сходках поставленный храмовый голос.
        alignment: Расспросы родни и соседей ушедших.
