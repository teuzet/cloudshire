id: two-markets
title: Два рынка
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: custom, sphere: prosperity }
pitch: У ворот стихийно вырос новый рынок, где не платят рыночного сбора; старый рынок пустеет, и его торговцы идут громить новый.

objects:
  - id: old
    type: organization
    name: Старый рынок
    description: Рыночная площадь со своими старшинами, весами и сбором. Торговцы здесь платят за место и за порядок.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: new
    type: community
    name: Торг у ворот
    description: Возы и лотки прямо у городских ворот. Здесь дешевле, потому что никто ни за что не платит.

fronts:
  - id: market-war
    title: Торговцы идут на торг у ворот
    form: tension
    description: Старшины старого рынка собирают людей, чтобы разогнать торг у ворот. Деревенские возчики обещают встретить их оглоблями.
    impact: MINOR
    drift: FAST
    refs: [old, new]
    alignment: |
      Развязывают узел общая мера и весы на обоих торгах, малый сбор у ворот, раздел товаров между площадью и воротами.
    stake:
      stats: { prosperity: -3, security: -2 }
