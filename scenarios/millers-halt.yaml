id: millers-halt
title: Мельницы встали
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: people, sphere: prosperity }
pitch: Мельники ветряного холма остановили жернова и требуют большей доли с помола; мука в городе кончается.

objects:
  - id: millers
    type: community
    name: Мельники ветряного холма
    description: Несколько семей, которые поколениями держат ветряки на холме за городом и мелют зерно всей округи.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: head
    type: person
    name: Старшина мельников
    description: Упрямый седой мельник, которому верят все семьи холма. Считает, что город платит за помол как при дедах, а жернова дорожают.
    refs: [millers]

fronts:
  - id: no-flour
    title: Мука на исходе
    description: Жернова стоят, пекарни доедают запас. Если мельники не вернутся к работе, город останется без хлеба.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [millers, head]
    alignment: |
      Возвращают мельников к жерновам честный торг о доле, помощь с новыми камнями, уважение к старшине.
      Помогают ручные мельницы и запасы, которые дают городу время на разговор.
    stake:
      stats: { prosperity: -4, influence: -2 }
    events:
      - id: queue
        description: У пекарен с ночи стоят очереди, хлеб продают по полкаравая в руки.
