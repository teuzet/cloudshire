id: fallen-leviathan
title: Упавший исполин
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: creature, sphere: prosperity }
pitch: Ночью на выгон между двумя деревнями рухнула с неба туша небесного исполина длиной в сотню шагов; в ней жир, ус, кость и что-то светится в брюхе, а туша уже начинает портиться.

objects:
  - id: carcass
    type: site
    name: Туша небесного исполина
    description: Серая гора плоти на общем выгоне. Шкура толщиной в ладонь, рёбра как стропила, из пасти тянет морозом. Через месяц от неё останется смрад.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: hill-village
    type: settlement
    name: Деревня на холме
    description: Туша упала ближе к их домам и задавила их стадо. Считают её своей по праву убытка.
  - id: brook-village
    type: settlement
    name: Деревня у ручья
    description: Выгон записан за ними, и они первыми вышли к туше с ножами.
  - id: glow
    type: object
    name: Светящийся зоб
    description: В зобу исполина лежит ком плотного светящегося вещества с бочку величиной, которым он переваривал облачный лёд; ком тёплый, горит ровным белым светом без дыма и тлеет годами.
    refs: [carcass]
    hidden: true

fronts:
  - id: carcass-war
    title: Деревни режутся за тушу
    form: tension
    description: Каждая деревня выставила у туши своих с топорами, из города едут скупщики. Пока делят, добро гниёт, а до первой крови остался один удар.
    impact: SIGNIFICANT
    drift: FAST
    refs: [carcass, hill-village, brook-village]
    alignment: |
      Мирят деревни делёж по счёту при городских свидетелях, общая разделка с долей каждому, плата хозяевам задавленного стада.
    stake:
      stats: { security: -3, prosperity: -3 }
  - id: render-carcass
    title: Разделать исполина, пока не сгнил
    form: deed
    description: Жира в туше хватит на светильники всему острову, ус и кость пойдут на луки и стропила. Нужны сотни рук, котлы и соль, и нужны сейчас.
    impact: SIGNIFICANT
    refs: [carcass]
    alignment: |
      Двигают дело котлы и соль, мясники и кожевники со всего острова, порядок разделки от брюха к хребту.
    stake:
      uncover: { target: glow }
