id: sealed-door
title: Запечатанная дверь под храмом
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: knowledge }
pitch: При починке храмового подвала рабочие нашли замурованную дверь с печатями, которых никто из жрецов не знает.

objects:
  - id: door
    type: mystery
    name: Запечатанная дверь
    description: Низкая дверь из тёмной бронзы в стене храмового подвала. На ней семь восковых печатей с незнакомым знаком.
  - id: vault
    type: site
    name: Хранилище первых жрецов
    description: За дверью лежат таблички первых жрецов города с записью всех сопряжений за триста лет и с приметами, по которым их ждали. Среди табличек стоит запаянный сосуд с прахом основателя храма.
    refs: [door]
    hidden: true

fronts:
  - id: open-door
    title: Что за дверью
    description: Понять, кто и зачем запечатал дверь, и решить, как её открыть.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [door]
    alignment: |
      Двигает дело чтение старых храмовых записей, изучение печатей, осторожное вскрытие при свидетелях.
    stake:
      uncover: { target: vault }
    clues:
      - id: seal
        fact: Знак на печатях встречается на самых старых камнях в основании храма.
        alignment: Сличение печатей с резьбой и записями храма.
      - id: rite
        fact: В старом служебнике есть молитва «о тех, кто считает встречи островов».
        alignment: Чтение старых служебников и хроник.
  - id: door-fear
    title: Город шепчется о двери
    form: tension
    description: Одни ждут за дверью сокровищ, другие проклятия. У храма собираются толпы, кто-то уже пробовал пролезть в подвал ночью.
    impact: MINOR
    drift: STEADY
    refs: [door]
    alignment: |
      Успокаивают город стража у подвала, слово жрецов, открытость в том, что делают с дверью.
    stake:
      stats: { influence: -2, security: -1 }
