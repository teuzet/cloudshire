id: founders-wheel
title: Колесо основателей
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: matter, sphere: prosperity }
pitch: В подземелье под старым кварталом расчистили огромное каменное колесо, которое вращается само; мастера цепляют к нему жернова, меха и станки, и город уже не помнит, как жил без него.

objects:
  - id: wheel
    type: structure
    name: Колесо основателей
    description: Каменное колесо в три человеческих роста в подземной палате. Вращается ровно и без остановки, от чего, никто не знает. От него наверх уже идут валы и ремни к мастерским.
    weight: SIGNIFICANT
    statProfile: { prosperity: 2, knowledge: 1 }
  - id: heart
    type: site
    name: Ветровая шахта под колесом
    description: Колесо крутит сквозной колодец, который основатели пробили через весь остров; ветер из-под днища идёт по нему вверх и давит на лопасти в нижней палате. Каждый новый вал, прицепленный к колесу, расшатывает древние каменные подшипники, и ось уже ходит на два пальца.
    refs: [wheel]
    hidden: true

fronts:
  - id: wheel-strains
    title: Колесо гудит всё громче
    description: Чем больше станков вешают на колесо, тем сильнее дрожит пол в старом квартале. Если оно сорвётся с оси, встанет всё, что на него надеется, а с ним ляжет полквартала.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [wheel]
    alignment: |
      Берегут колесо мера на число валов, осмотры оси, запасной привод от ветра и тягла для самых нужных мастерских.
    stake:
      stats: { prosperity: -4, security: -2 }
    events:
      - id: crack
        description: Ночью в старом квартале лопнула стена над подземной палатой; гул колеса слышно на улице.
  - id: wheel-secret
    title: Что крутит колесо
    description: Спуститься ниже палаты и понять, откуда колесо берёт силу и сколько оно выдержит.
    impact: MINOR
    beatCount: 2
    refs: [wheel]
    closes:
      - { target: wheel-strains, share: 0.6 }
    alignment: |
      Двигает дело спуск в нижние ходы, осмотр оси и подшипников, чтение знаков основателей на стенах палаты.
    stake:
      uncover: { target: heart }
    clues:
      - id: draft
        fact: Из-под палаты всегда тянет сильным ровным ветром, и свеча там гаснет.
        alignment: Спуск в нижние ходы под палатой.
      - id: marks
        fact: На стене палаты выбиты семь валов и надпись, которую хранители читают как «больше нельзя».
        alignment: Чтение знаков основателей.
