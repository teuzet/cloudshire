id: forgotten-hamlet
title: Деревня, которой нет в записях
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: people, sphere: security }
pitch: Лесорубы наткнулись в глухом лесу на брошенную деревню; дома целы, посуда на столах, а в городских книгах о ней ни слова.

objects:
  - id: hamlet
    type: site
    name: Брошенная деревня в лесу
    description: Два десятка добротных домов под мхом. Двери не заперты, в печах зола, на столах миски. Людей и костей нет.
  - id: reason
    type: site
    name: Заваленный колодец с грамотой
    description: Жители ушли в город сто лет назад, когда из лесного оврага пошёл тяжёлый дурной воздух, от которого люди засыпали и не просыпались. Старейшина записал это на бересте и опустил в сухой колодец, а город, принявший беглецов, вымарал деревню из книг, чтобы никто туда не возвращался.
    refs: [hamlet]
    hidden: true

fronts:
  - id: hamlet-truth
    title: Куда ушли жители
    description: Узнать, кто здесь жил, почему ушёл и почему город об этом молчит.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [hamlet]
    alignment: |
      Двигает дело осмотр домов и колодцев, поиск в городских книгах пропусков и вымаранных мест, расспросы старейших семей.
    stake:
      uncover: { target: reason }
    clues:
      - id: gap
        fact: В податной книге столетней давности вырезаны четыре листа подряд.
        alignment: Поиск пропусков в городских книгах.
      - id: names
        fact: Родовые знаки на притолоках деревни совпадают со знаками трёх городских семей.
        alignment: Сличение знаков на домах с городскими родами.
  - id: settlers-rush
    title: В деревню тянутся поселенцы
    description: Безземельные семьи уже занимают готовые дома. Никто не знает, отчего ушли прежние жители и не случится ли то же с новыми.
    impact: MINOR
    drift: SLOW
    refs: [hamlet]
    alignment: |
      Отводят беду запрет селиться до выяснения, дозор у деревни, проверка оврагов и низин вокруг.
    stake:
      stats: { security: -3, influence: -1 }
