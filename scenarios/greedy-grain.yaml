id: greedy-grain
title: Чужое зерно
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: ecology, sphere: prosperity }
pitch: Зерно, купленное в прошлое сопряжение, даёт колос вдвое тяжелее своего; его сеют все, но на третий год оказалось, что оно не всходит из своих семян и глушит старые сорта.

objects:
  - id: grain
    type: resource
    name: Тяжёлый колос
    description: Привозной злак с толстым колосом. Занял уже половину полей острова и расползается по межам сам.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: old-seed
    type: resource
    name: Дедовское зерно
    description: Старый местный злак, мелкий и надёжный. Его почти перестали сеять, и чистых семян мало.
  - id: secret
    type: person
    name: Перекупщик, который знал
    description: Зерно в сопряжение брал и развозил по деревням один перекупщик. Соседи честно сказали ему, что тяжёлый колос родит лишь два года и семена надо покупать у них заново; он это скрыл и сам придержал три амбара последнего всхожего семени, чтобы продать его городу втридорога, когда поля не взойдут.
    refs: [grain]
    hidden: true

fronts:
  - id: empty-sowing
    title: Поля не взойдут
    description: Семена третьего урожая мертвы, а дедовского зерна осталось на десятую часть полей. Если не найти, чем сеять, будет голод.
    impact: MAJOR
    drift: STEADY
    refs: [grain, old-seed]
    alignment: |
      Отводят беду сбор дедовского зерна по всем закромам и размножение его на лучших полях, выполка чужого злака с меж, поиск всхожего семени.
    stake:
      stats: { prosperity: -7, security: -2 }
  - id: seed-truth
    title: Кто знал про зерно
    description: Узнать, откуда пошло тяжёлое зерно и было ли известно, что оно не возобновляется.
    impact: MINOR
    beatCount: 2
    refs: [grain]
    closes:
      - { target: empty-sowing, share: 0.4 }
    alignment: |
      Двигает дело расспросы деревень о том, у кого брали семена, проверка амбаров и записей о торге в сопряжение.
    stake:
      uncover: { target: secret }
    clues:
      - id: one-hand
        fact: Все деревни получили тяжёлое зерно через одни руки.
        alignment: Расспросы деревень о том, у кого брали семена.
      - id: barns
        fact: У перекупщика три амбара под замком, и он нанял к ним сторожей ещё в прошлом году.
        alignment: Проверка амбаров и запасов на острове.
