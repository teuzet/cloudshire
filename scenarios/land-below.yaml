id: land-below
title: Земля под облаками
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: sky, sphere: knowledge }
pitch: Учёный хранитель неба объявил, что под облаками лежит твёрдая земля, и собирает людей спустить в бездну человека на канате; храм называет это кощунством.

objects:
  - id: scholar
    type: person
    name: Учёный о нижней земле
    description: Упрямый и желчный наблюдатель неба. Двадцать лет бросал с кромки меченые камни и слушал, и уверен, что слышал удар.
    weight: MINOR
    statProfile: { knowledge: 1 }
  - id: followers
    type: community
    name: Канатное общество
    description: Молодые мастера, канатчики и школяры. Плетут канат небывалой длины и спорят, кто пойдёт первым.
    refs: [scholar]

fronts:
  - id: descent-row
    title: Спуск или кощунство
    form: tension
    description: Канатное общество готовит спуск, храмовые ревнители обещают перерезать канат. Город делится на тех, кто хочет знать, и тех, кто боится спрашивать.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [scholar, followers]
    alignment: |
      Разводят стороны спор учёных и жрецов при народе, слово верховного жреца о том, чего хочет покровитель, опыт без человека на канате.
    stake:
      stats: { influence: -3, knowledge: -2, security: -1 }
    events:
      - id: rope
        description: Ночью кто-то изрезал половину готового каната; школяры поймали и избили храмового служку.
