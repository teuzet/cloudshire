id: shed-skin
title: Сброшенная шкура
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: security }
pitch: "На скалы у кромки легла сброшенная шкура небесного змея длиной в целую улицу; она легче кожи и прочнее её, а ветер уже треплет её край."

objects:
  - id: thing
    type: resource
    name: "Шкура небесного змея"
    description: "Сизое полотнище в мелкой чешуе, зацепившееся за скалы. Нож берёт его с трудом."

fronts:
  - id: main
    title: "Снять и выделать змеиную шкуру"
    form: deed
    description: "Шкура висит над бездной, и первая буря унесёт её. Кожевники не знают, чем её резать и как дубить."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело верёвки и крючья, чтобы стянуть шкуру на твёрдую землю, пробы кожевников, новый нож и новый дубильный отвар."
    stake:
      create:
        type: resource
        name: "Запас змеиной шкуры"
        description: "У города есть запас лёгкой и прочной шкуры небесного змея на щиты, ремни и штормовые пологи."
        weight: SIGNIFICANT
        statProfile: { security: 3, prosperity: 2 }
        refs: [thing]
