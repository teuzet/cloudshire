id: edge-feeder
title: Тот, кто кормит небо
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: creature, sphere: security }
pitch: Небесные хищники, которые раньше лишь пролетали мимо, стали гнездиться в скалах кромки и таскать ягнят и собак; кто-то их нарочно прикармливает.

objects:
  - id: raptors
    type: threat
    name: Кромочные рвачи
    description: Узкокрылые небесные твари с размахом в две сажени. Сидят на уступах под кромкой и бьют сверху всё, что меньше телёнка.
    weight: MINOR
    statProfile: { security: -1 }
  - id: feeder
    type: person
    name: Скорняк с крайней улицы
    description: Скорняк с крайней улицы каждую ночь сбрасывает с обрыва потроха и обрезки, чтобы рвачи гнездились поближе; он лазает к гнёздам за яйцами и пухом птенцов и сбывает их знатным домам как диковину. Верёвочная лестница спрятана у него в сарае под шкурами.
    refs: [raptors]
    hidden: true

fronts:
  - id: raptors-settle
    title: Рвачи обживают кромку
    description: Гнёзд всё больше, твари смелеют. Недавно один унёс собаку со двора, следующим будет ребёнок.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [raptors]
    alignment: |
      Отводят беду сети и трещотки над дворами, разорение гнёзд, запрет бросать отбросы с кромки, стрелки на вышках.
    stake:
      stats: { security: -4, prosperity: -2 }
  - id: who-feeds
    title: Почему рвачи остались
    description: Узнать, что держит пролётных тварей у города.
    impact: MINOR
    beatCount: 2
    refs: [raptors]
    closes:
      - { target: raptors-settle, share: 0.6 }
    alignment: |
      Двигает дело ночной дозор у обрыва, осмотр уступов под гнёздами, расспросы о том, откуда в богатых домах птенцовый пух.
    stake:
      uncover: { target: feeder }
    clues:
      - id: offal
        fact: Под гнёздами лежат свежие скотские потроха, ровно обрезанные ножом.
        alignment: Осмотр уступов под гнёздами.
      - id: eggs
        fact: В двух знатных домах появились пятнистые яйца величиной с кулак.
        alignment: Расспросы о диковинах в богатых домах.
