id: goat-plenty
title: Козье изобилие
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: creature, sphere: prosperity }
pitch: Горные козы, которых город приручил поколение назад, расплодились без меры; молока и шерсти вдоволь, но склоны объедены до камня, и начались осыпи.

objects:
  - id: goats
    type: resource
    name: Городские козы
    description: Тысячи длинношёрстных коз на всех склонах вокруг города. Кормят и одевают бедные кварталы.
    weight: SIGNIFICANT
    statProfile: { prosperity: 2 }
  - id: slopes
    type: site
    name: Объеденные склоны
    description: Склоны без кустов и травы. После дождей с них идёт грязь и камни.
    refs: [goats]

fronts:
  - id: slopes-slide
    title: Голые склоны ползут на огороды
    description: Каждый дождь смывает землю со склонов на нижние сады и дворы. Дальше пойдут большие осыпи.
    impact: MINOR
    drift: STEADY
    refs: [slopes, goats]
    alignment: |
      Отводят беду мера на стадо для каждого двора, огороженные склоны под отдых, террасы и плетни, выпас по очереди.
      Помогает уважение к тому, что козы кормят бедных.
    stake:
      stats: { prosperity: -3, security: -2 }
