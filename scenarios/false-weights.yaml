id: false-weights
title: Лёгкие гири
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: people, sphere: prosperity }
pitch: На рынке у многих торговцев оказались гири легче положенного, хотя все они клеймены городской печатью.

objects:
  - id: scales
    type: practice
    name: Городская мера
    description: Гири и меры на рынке клеймит городская весовая палата. Клейму верят и свои и деревенские.
    weight: MINOR
    statProfile: { prosperity: 1, influence: 1 }
  - id: stamper
    type: person
    name: Клеймовщик весовой палаты
    description: Младший клеймовщик за плату ставит городское клеймо на облегчённые гири, которые льёт его шурин-литейщик. Запасные клейма он держит дома под половицей.
    refs: [scales]
    hidden: true

fronts:
  - id: who-stamps
    title: Кто клеймит лёгкие гири
    description: Узнать, откуда на рынке гири с настоящим клеймом и неверным весом.
    impact: MINOR
    beatCount: 2
    refs: [scales]
    closes:
      - { target: trust-falls, share: 0.6 }
    alignment: |
      Двигает дело сверка гирь с палатным образцом, расспросы торговцев о том, где брали гири, проверка самой палаты.
    stake:
      uncover: { target: stamper }
    clues:
      - id: cast
        fact: Все лёгкие гири отлиты в одной форме, с одной и той же раковиной на донце.
        alignment: Осмотр и сличение изъятых гирь.
      - id: day
        fact: Лёгкие гири клеймены в те дни, когда старший клеймовщик был в отлучке.
        alignment: Проверка записей весовой палаты.
  - id: trust-falls
    title: Рынок перестаёт верить клейму
    form: tension
    description: Покупатели носят свои безмены и ругаются у каждого лотка. Деревенские возчики грозят больше не возить товар в город.
    impact: MINOR
    drift: STEADY
    refs: [scales]
    alignment: |
      Возвращают доверие открытая перевеска гирь на площади, новые клейма, наказание пойманных при народе.
    stake:
      stats: { prosperity: -3, influence: -2 }
