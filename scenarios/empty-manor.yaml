id: empty-manor
title: Выморочное поместье
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: custom, sphere: influence }
pitch: Умер последний из старого рода, и большой дом с садами и книгами отошёл городу; на него уже смотрят три знатных дома и храм.

objects:
  - id: manor
    type: building
    name: Поместье угасшего рода
    description: Просторный каменный дом с внутренним двором, садом и библиотекой в две сотни книг. Стоит запертый, слуги ждут решения.

fronts:
  - id: manor-use
    title: Дать поместью новую жизнь
    form: deed
    description: В таком доме поместятся лечебница, приют для сирот или дом для гостей города при сопряжении. Нужно выбрать и обустроить.
    impact: SIGNIFICANT
    refs: [manor]
    alignment: |
      Двигают дело ясное назначение дома, люди, которые будут его вести, починка и обстановка, слуги рода на новых местах.
    stake:
      modify: { target: manor, intent: Поместье служит всему городу и прибавляет ему доброй славы. }
  - id: manor-grab
    title: Знатные дома делят поместье
    form: tension
    description: Каждый из трёх домов нашёл дальнее родство с угасшим родом. Пока город тянет, они перевозят в поместье своих людей.
    impact: MINOR
    drift: FAST
    refs: [manor]
    alignment: |
      Останавливают делёж печати на дверях, опись имущества, решение, объявленное при совете.
    stake:
      stats: { influence: -3 }
