id: doom-readers
title: Звездочёты беды
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: sky, sphere: influence }
pitch: Кружок звездочётов высчитал, что остров уходит в пустое небо и сопряжений больше не будет; люди бросают ремёсла, что кормились торговлей, и скупают соль и железо.

objects:
  - id: readers
    type: organization
    name: Кружок звездочётов
    description: Полдюжины уважаемых наблюдателей с башни. Их расчёт никто в городе не может проверить, и сами они в нём уверены.
    weight: MINOR
    statProfile: { knowledge: 1 }
  - id: error
    type: object
    name: Сбитый угломер
    description: Расчёт звездочётов верен, но большой угломер на башне сел на полпальца после недавней грозы, и все замеры последнего года врут в одну сторону. По верным замерам остров идёт прежним путём.
    refs: [readers]
    hidden: true

fronts:
  - id: panic-buying
    title: Город готовится к вечному одиночеству
    form: tension
    description: Соль и железо скуплены, мастера торговых ремёсел закрывают лавки. Одни зовут каяться, другие требуют казнить звездочётов.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [readers]
    alignment: |
      Успокаивают город мера на соль и железо, слово жреца, открытая проверка расчёта.
    stake:
      stats: { influence: -3, prosperity: -3 }
  - id: check-count
    title: Проверить расчёт звездочётов
    description: Найти, верно ли то, что высчитали на башне.
    impact: MINOR
    beatCount: 2
    refs: [readers]
    closes:
      - { target: panic-buying, share: 0.7 }
    alignment: |
      Двигает дело повтор замеров другим прибором, сличение со старыми записями, осмотр башни и её снастей.
    stake:
      uncover: { target: error }
    clues:
      - id: old
        fact: Замеры до грозы сходятся со столетними записями, замеры после грозы все сдвинуты на одну и ту же малость.
        alignment: Сличение новых замеров со старыми записями.
