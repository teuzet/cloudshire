id: sacred-grove
title: Священная роща
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: custom, sphere: prosperity }
pitch: Строевой лес на острове почти кончился, и последние прямые стволы стоят в роще, где город поколениями хоронит пуповины новорождённых.

objects:
  - id: grove
    type: landmark
    name: Родильная роща
    description: Старая роща высоких прямых деревьев. Под каждым зарыта пуповина кого-то из горожан, и срубить дерево значит срубить чью-то судьбу.
    weight: MINOR
    statProfile: { influence: 2 }
  - id: builders
    type: organization
    name: Плотничий цех
    description: Плотники города. Им нечем чинить мосты, крыши и крепи, и они прямо говорят, где стоит нужный лес.
    refs: [grove]

fronts:
  - id: timber-famine
    title: Городу нечем строить
    description: Мосты и крепи ветшают, а строевого леса нет. Либо город найдёт дерево, либо плотники пойдут в рощу с топорами.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [grove, builders]
    alignment: |
      Отводят беду поиск леса в дальних урочищах, камень и плетень вместо бруса, посадки на смену, обряд, который позволит взять часть деревьев с согласия семей.
    stake:
      stats: { prosperity: -4, security: -2 }
    events:
      - id: stump
        description: На краю рощи нашли свежий пень; семья, чьё это было дерево, требует найти порубщика.
