id: bought-sergeant
title: Купленный десятник
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: people, sphere: security }
pitch: Разбойники на лесной дороге всякий раз уходят за час до облавы; кто-то в страже их предупреждает.

objects:
  - id: band
    type: threat
    name: Лесная шайка
    description: Десяток разбойников грабит возы на лесной дороге и уходит в чащу. Берут немного, зато всегда знают, какой воз без охраны.
    weight: MINOR
    statProfile: { security: -1, prosperity: -1 }
  - id: traitor
    type: person
    name: Десятник дорожной стражи
    description: Десятник задолжал ростовщику и расплачивается вестями; он вывешивает красную тряпку на заставе, когда готовится облава, и белую, когда воз идёт без охраны. Атаман шайки его двоюродный брат.
    refs: [band]
    hidden: true

fronts:
  - id: who-warns
    title: Кто предупреждает шайку
    description: Найти в страже того, кто сдаёт облавы разбойникам.
    impact: MINOR
    beatCount: 2
    refs: [band]
    closes:
      - { target: road-shut, share: 0.7 }
    alignment: |
      Двигает дело ложная облава для проверки, слежка за заставой, расспросы о долгах и родне стражников.
    stake:
      uncover: { target: traitor }
    clues:
      - id: rag
        fact: Перед каждой сорвавшейся облавой на заставе сушилась красная тряпка.
        alignment: Наблюдение за заставой и расспросы возчиков.
  - id: road-shut
    title: Лесная дорога закрывается
    description: Возчики отказываются ездить через лес. Если шайку не взять, деревни за лесом останутся отрезаны от рынка.
    impact: MINOR
    drift: STEADY
    refs: [band]
    alignment: |
      Отводят беду охрана обозов, облава без огласки, засады у разбойничьих троп.
    stake:
      stats: { security: -3, prosperity: -2 }
