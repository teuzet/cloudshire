id: star-floor
title: Пол со звёздами
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: knowledge }
pitch: "Под сбитой штукатуркой в старом зале совета открылась мозаика: небо с островами и ряды значков возле каждого из них."

objects:
  - id: thing
    type: landmark
    name: "Мозаика в старом зале"
    description: "Пол из мелкого цветного камня. На тёмном поле выложены острова и вокруг них ряды значков."

fronts:
  - id: main
    title: "Прочесть небесную мозаику"
    form: find
    description: "Значки возле островов похожи на счёт лет. Хранители думают, что основатели записали здесь, как ходят острова."
    impact: MINOR
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело расчистка всего пола, сверка значков со старыми летописями сопряжений, счёт лет."
    stake:
      create:
        type: object
        name: "Таблица хода островов"
        description: "По мозаике составлена таблица, и город за годы вперёд знает, когда ждать сопряжения."
        weight: MINOR
        statProfile: { knowledge: 3, prosperity: 1 }
        refs: [thing]
    clues:
      - id: year-marks
        fact: "Значки у островов это счёт лет между сопряжениями."
        alignment: "Сверка значков со старыми летописями."
