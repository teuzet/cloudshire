id: star-dew
title: Звёздная роса
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: sky, sphere: prosperity }
pitch: После прохода хвостатой звезды на кромке по утрам ложится светящаяся роса; из неё выходит краска и лак небывалой красоты, и полгорода бросило работу ради сбора.

objects:
  - id: dew
    type: resource
    name: Звёздная роса
    description: Густые голубые капли, которые до рассвета лежат на камнях кромки и светятся. Высыхая, дают стойкую сияющую краску.
    weight: MINOR
    statProfile: { prosperity: 2 }
  - id: gatherers
    type: community
    name: Сборщики росы
    description: Пахари, подмастерья, стражники, дети. Каждую ночь тысячи людей ползают по кромке со скребками и склянками.
    refs: [dew]

fronts:
  - id: fields-abandoned
    title: Город бросил всё ради росы
    form: tension
    description: Поля стоят несжатые, мастерские пустые, на кромке дерутся за места и срываются вниз. А росы с каждой неделей ложится меньше.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [dew, gatherers]
    alignment: |
      Возвращают город к делу очередь и участки на кромке, канаты и ограждения, скупка росы через казну по твёрдой цене, честное слово о том, что роса кончается.
    stake:
      stats: { prosperity: -4, security: -2 }
  - id: dew-craft
    title: Сберечь секрет сияющей краски
    form: deed
    description: Роса уйдёт вместе со следом хвостатой звезды. Если красильщики успеют понять, что в ней светится, и найти замену, ремесло останется с городом.
    impact: SIGNIFICANT
    refs: [dew]
    alignment: |
      Двигают дело запас росы для опытов, работа красильщиков и хранителей вместе, пробы с местными камнями и мхами.
    stake:
      create:
        type: practice
        name: Сияющая краска
        description: Красильщики города умеют делать светящуюся краску из того, что есть на острове.
        weight: SIGNIFICANT
        statProfile: { prosperity: 2, influence: 1 }
