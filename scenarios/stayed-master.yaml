id: stayed-master
title: Чужой мастер
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: people, sphere: knowledge }
pitch: После расхождения островов в городе по своей воле остался стекольных дел мастер соседей; он знает, как варить прозрачное стекло, и ищет, где осесть.

objects:
  - id: master
    type: person
    name: Стекольный мастер с соседнего острова
    description: Немногословный чужак с обожжёнными руками. Поссорился со своим цехом и не стал возвращаться. Городского говора почти не знает.

fronts:
  - id: clear-glass
    title: Завести прозрачное стекло
    form: deed
    description: Городские стеклодувы умеют только мутное зелёное стекло. Если дать чужаку печь и учеников, в городе появятся прозрачные окна, склянки и стёкла для глаз.
    impact: SIGNIFICANT
    refs: [master]
    alignment: |
      Двигают дело мастерская и подмастерья для чужака, толмач, поиск нужного песка и золы, защита от ревности цеха.
    stake:
      create:
        type: capability
        name: Прозрачное стекло
        description: Городские мастера варят прозрачное стекло.
        weight: SIGNIFICANT
        statProfile: { knowledge: 2, prosperity: 1 }
        refs: [master]
  - id: guild-shuts-out
    title: Цех гонит чужака
    form: tension
    description: Стеклодувы не дают чужаку ни песка, ни места и грозят побить его печь. Мастер говорит, что уйдёт жить в деревню и забудет ремесло.
    impact: MINOR
    drift: STEADY
    refs: [master]
    alignment: |
      Мирят цех с чужаком доля цеха в новом стекле, место мастеру среди старшин, работа бок о бок.
    stake:
      delete: { target: master }
