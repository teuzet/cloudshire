id: child-seer
title: Девочка, которая видит наперёд
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: dilemma, source: phenomenon, sphere: influence }
pitch: Дочь красильщика трижды назвала беду за день до того, как она случилась; храм хочет забрать ребёнка, семья прячет её, а у дома стоит толпа.

objects:
  - id: girl
    type: person
    name: Дочь красильщика
    description: Тихая девочка лет девяти. Иногда замирает и говорит, что видит, и до сих пор не ошиблась ни разу. После этого два дня лежит в жару.
  - id: family
    type: community
    name: Семья красильщика
    description: Небогатая семья с красильной улицы. Боится и толпы, и храма, и того, что видения сожгут ребёнка.
    refs: [girl]

fronts:
  - id: crowd-at-door
    title: Толпа у дома красильщика
    form: tension
    description: Люди сутками стоят под окнами и требуют, чтобы девочка сказала им про их судьбу. Одни несут дары, другие зовут её дурным глазом.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [girl, family]
    alignment: |
      Разводят толпу защита дома, решение о ребёнке, которое примет семья, слово верховного жреца о том, чей это дар.
      Силой отнятый ребёнок замолчит.
    stake:
      stats: { influence: -4, security: -2 }
    events:
      - id: stone
        description: В окно красильщика бросили камень с запиской; девочка неделю не выходит из дому.
