id: warm-belt
title: Тёплая полоса
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: prosperity }
pitch: "Остров вошёл в полосу тёплого воздуха, и старики говорят, что она продержится до конца года; если засеять поля второй раз, хлеб успеет вызреть."

objects:
  - id: thing
    type: resource
    name: "Тёплая полоса неба"
    description: "Ровное сухое тепло днём и ночью. Облака идут высоко, роса ложится густо."

fronts:
  - id: main
    title: "Второй посев"
    form: deed
    description: "Второго урожая на острове не помнит никто. Нужны семена, руки и вода, и всё это сейчас, пока земля тёплая."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело общий выход на поля, семена из запаса, отвод воды с ручьёв на пашню и скорая уборка первого хлеба."
    stake:
      stats: { prosperity: 4, security: 1, influence: 1 }
