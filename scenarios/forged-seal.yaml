id: forged-seal
title: Чужая рука на печати
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: custom, sphere: influence }
pitch: По городу ходят указы с печатью канцлера, которых канцлер не писал; по ним уже освободили двух узников и списали долг.

objects:
  - id: seal
    type: object
    name: Печать канцлера
    description: Большая печать, которой скрепляют указы города. Хранится в канцелярии под замком.
    weight: MINOR
    statProfile: { influence: 1 }
  - id: forger
    type: person
    name: Резчик печатей
    description: Старый резчик, который когда-то делал нынешнюю печать, сохранил пробный оттиск и вырезал по нему вторую. Он продаёт указы тем, кто платит, через трактирщика у южных ворот.
    hidden: true

fronts:
  - id: find-forger
    title: Кто ставит печать
    description: Узнать, откуда берутся подложные указы.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [seal]
    closes:
      - { target: law-melts, share: 0.7 }
    alignment: |
      Двигает дело сличение оттисков, поиск тех, кто получил выгоду от подложных указов, слежка за посредниками.
    stake:
      uncover: { target: forger }
    clues:
      - id: flaw
        fact: На подложных оттисках нет щербины, которая появилась на настоящей печати три года назад.
        alignment: Сличение оттисков настоящей и подложной печати.
      - id: tavern
        fact: Оба освобождённых узника перед тем посылали родню в трактир у южных ворот.
        alignment: Расспросы тех, кому помогли подложные указы.
  - id: law-melts
    title: Указам перестают верить
    form: tension
    description: Стража и старосты не знают, какой указ настоящий, и на всякий случай не исполняют никакой.
    impact: MINOR
    drift: STEADY
    refs: [seal]
    alignment: |
      Возвращают веру новая печать, оглашение указов голосом на площади, проверка каждого указа в канцелярии.
    stake:
      stats: { influence: -3, security: -1 }
