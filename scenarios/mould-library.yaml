id: mould-library
title: Плесень в книгохранилище
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: crisis, source: ecology, sphere: knowledge }
pitch: После сырых месяцев в городском книгохранилище пошла чёрная плесень; она ест пергамент и переходит с полки на полку.

objects:
  - id: library
    type: building
    name: Книгохранилище
    description: Сводчатые палаты с книгами и свитками города. По углам и на переплётах расползаются чёрные пятна.
    weight: MINOR
    statProfile: { knowledge: 2 }
  - id: mould
    type: threat
    name: Чёрная плесень
    description: Плесень, от которой пергамент слипается и крошится. Переходит с книги на книгу и с рук на руки.
    refs: [library]

fronts:
  - id: books-rot
    title: Книги гибнут полками
    description: Плесень съела уже целый ряд. Если её не остановить, город потеряет большую часть записанного знания.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [library, mould]
    alignment: |
      Спасают книги просушка и окуривание, вынос здоровых книг в сухое место, переписывание самого ценного, жаровни и продухи в палатах.
    stake:
      modify: { target: library, intent: Большая часть книг погибла от плесени, уцелевшее лежит в беспорядке. }
