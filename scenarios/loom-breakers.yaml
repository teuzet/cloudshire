id: loom-breakers
title: Ревнители ручной работы
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: custom, sphere: prosperity }
pitch: Мастера придумали станок, на котором один ткач делает работу четверых; оставшиеся без дела объявили станки грехом против предков и ломают их по ночам.

objects:
  - id: looms
    type: object
    name: Широкие станки
    description: Новые ткацкие станки с подножками. Стоят в трёх мастерских и дают сукна больше, чем весь остальной цех.
    weight: MINOR
    statProfile: { prosperity: 1, knowledge: 1 }
  - id: breakers
    type: community
    name: Ревнители ручной работы
    description: Ткачи и прядильщицы, оставшиеся без заказов, и старики, которые видят в станке порчу ремесла. Ходят с молотами и поют старые цеховые песни.

fronts:
  - id: looms-smashed
    title: Станки ломают по ночам
    description: Две мастерские уже разгромлены. Если ревнителей не унять и не дать им дела, станков в городе не останется, а мастера-придумщики уйдут в деревни.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [looms, breakers]
    alignment: |
      Унимают ревнителей работа у новых станков для тех, кто её потерял, доля цеха в прибыли, почёт ручной работе как особому товару.
    stake:
      delete: { target: looms }
