id: shared-dream
title: Общий сон
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: phenomenon, sphere: knowledge }
pitch: Сотни горожан в одну ночь увидели один и тот же сон о белой лестнице над городом; сновидцы собираются вместе и ждут второго сна, бросив работу.

objects:
  - id: dreamers
    type: community
    name: Видевшие лестницу
    description: Люди всех сословий, которым приснилась одна и та же белая лестница в небо. Узнают друг друга по описанию ступеней.
  - id: cause
    type: resource
    name: Сон-трава в общей пекарне
    description: В ту ночь большая пекарня нижнего города пустила в хлеб муку из мешка, куда попали семена сон-травы с дальнего поля. Всякий, кто ел тот хлеб, видел яркий сон, а разговоры наутро подогнали сны под один рассказ о лестнице.
    hidden: true

fronts:
  - id: dream-truth
    title: Откуда пришёл общий сон
    description: Узнать, почему столько людей видели одно и то же.
    impact: MINOR
    beatCount: 2
    refs: [dreamers]
    closes:
      - { target: waiting-crowd, share: 0.6 }
    alignment: |
      Двигает дело расспрос сновидцев порознь, поиск общего в том, что они ели, пили и где были накануне.
    stake:
      uncover: { target: cause }
    clues:
      - id: apart
        fact: Те, кого расспросили до общих сходок, описывают сны по-разному; лестница появилась в рассказах позже.
        alignment: Расспрос сновидцев порознь и сличение рассказов.
      - id: bread
        fact: Все сновидцы живут в нижнем городе и берут хлеб в одной пекарне.
        alignment: Поиск общего в жизни сновидцев.
  - id: waiting-crowd
    title: Сновидцы ждут второго сна
    form: tension
    description: Сотни людей бросили работу, спят на площади и толкуют сон. Самые горячие уже строят лестницу на храмовой крыше.
    impact: MINOR
    drift: STEADY
    refs: [dreamers]
    alignment: |
      Возвращают людей к жизни уважительный разговор, толкование сна храмом, дело, в котором сновидцы видят смысл.
    stake:
      stats: { influence: -2, prosperity: -2 }
