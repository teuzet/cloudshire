id: cold-forge
title: Руда, которая не куётся
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: refusal, source: matter, sphere: knowledge }
pitch: Новая жила в каменоломне даёт металл, который крошится под молотом; кузнецы отказываются с ним работать, а старая жила иссякает.

objects:
  - id: vein
    type: resource
    name: Сизая жила
    description: Новая рудная жила с сизым отливом. Металл из неё плавится как обычный, но под молотом идёт трещинами.
    weight: MINOR
    statProfile: { knowledge: 1 }
  - id: smiths
    type: organization
    name: Кузнечный ряд
    description: Кузнецы города. Привыкли к старой руде и не хотят тратить уголь на сизую.
    refs: [vein]

fronts:
  - id: learn-ore
    title: Найти подход к сизой руде
    description: Понять, как плавить и ковать сизый металл, чтобы он держал удар.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [vein, smiths]
    alignment: |
      Двигают дело опытные плавки с разным жаром и присадками, записи о каждой пробе, терпение старых мастеров.
    stake:
      reveal:
        text: Сизый металл надо остужать медленно, в горячей золе; тогда он выходит легче и твёрже прежнего.
    clues:
      - id: ash
        fact: Слиток, забытый на ночь в остывающем горне, оказался крепче остальных.
        alignment: Сравнение удачных и неудачных проб.
  - id: iron-short
    title: Железо кончается
    description: Старая жила почти выбрана. Если город не научится работать с новой рудой или не найдёт замену, встанут кузни и стройки.
    impact: MINOR
    drift: SLOW
    refs: [smiths]
    alignment: |
      Отводят беду сбор и перековка старого железа, бережный расход, поиск новых выходов привычной руды.
    stake:
      stats: { prosperity: -3 }
