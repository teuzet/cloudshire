id: island-in-sight
title: Остров на горизонте
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: sky, sphere: influence }
pitch: Дозорные увидели на краю неба чужой остров, и он растёт с каждым днём; идёт сопряжение, и у города есть время приготовиться к встрече.

objects:
  - id: stranger
    type: landmark
    name: Остров на горизонте
    description: Тёмная полоса в небе, уже видны леса и дымы. Какой это остров и кто на нём живёт, пока никто не знает.

fronts:
  - id: ready-to-meet
    title: Приготовиться к сопряжению
    form: deed
    description: Когда берега сойдутся, у города будет несколько месяцев на торг, союзы и вести. Кто встретит соседей готовым, возьмёт от встречи больше.
    impact: SIGNIFICANT
    refs: [stranger]
    alignment: |
      Двигают дело товар, собранный к месту стыка, толмачи и знатоки чужих обычаев, послы с дарами, порядок на будущем торге.
    stake:
      stats: { prosperity: 3, influence: 3 }
  - id: who-comes
    title: Кто живёт на том острове
    description: Узнать по хроникам и приметам, что это за остров и чего от него ждать.
    impact: MINOR
    beatCount: 1
    refs: [stranger]
    alignment: |
      Двигает дело чтение хроник прежних сопряжений, наблюдение за чужим берегом, расспросы стариков.
    stake:
      reveal:
        text: Это остров, с которым город встречался при прадедах; тогда расстались в ссоре из-за неоплаченного зерна, и соседи это помнят.
    clues:
      - id: towers
        fact: На чужом берегу видны три башни в ряд, как на рисунке в старой хронике.
        alignment: Сличение чужого берега со старыми хрониками.
