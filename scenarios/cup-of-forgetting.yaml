id: cup-of-forgetting
title: Чаша забвения
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: phenomenon, sphere: knowledge }
pitch: Утешитель с окраины поит горюющих из старой чаши, и горе уходит; только вместе с горем люди забывают своё ремесло, а их мастерские за бесценок достаются одному и тому же покупателю.

objects:
  - id: comforter
    type: person
    name: Утешитель
    description: Мягкий человек в чистом доме на окраине. К нему идут вдовы и осиротевшие отцы, и выходят от него с лёгким лицом.
  - id: cup
    type: object
    name: Чаша из чёрного стекла
    description: Древняя чаша; вода, простоявшая в ней ночь, стирает у выпившего самое привычное, то, что он делал каждый день. Утешитель это знает. Он выбирает одиноких мастеров, а его брат потом скупает их осиротевшие мастерские и инструмент.
    refs: [comforter]
    hidden: true

fronts:
  - id: masters-forget
    title: Мастера забывают ремесло
    description: Лучший бочар стоит перед клёпкой и не знает, что с ней делать. Таких уже дюжина, и к утешителю очередь.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [comforter]
    alignment: |
      Останавливают беду присмотр за домом утешителя, помощь горюющим от храма и соседей, ученики и товарищи, которые заново учат забывших.
    stake:
      stats: { knowledge: -4, prosperity: -2 }
  - id: what-they-drink
    title: Что пьют у утешителя
    description: Узнать, отчего забывают те, кто побывал в его доме.
    impact: MINOR
    beatCount: 2
    refs: [comforter]
    closes:
      - { target: masters-forget, share: 0.7 }
    alignment: |
      Двигает дело расспросы забывших и их родни, свой человек среди просителей, поиск того, кому достаются мастерские.
    stake:
      uncover: { target: cup }
    clues:
      - id: buyer
        fact: Семь из двенадцати мастерских купил один человек, и он брат утешителя.
        alignment: Поиск того, кому достались мастерские забывших.
      - id: water
        fact: Все забывшие помнят чёрную чашу и воду со вкусом железа.
        alignment: Расспросы забывших о том, что было в доме утешителя.
