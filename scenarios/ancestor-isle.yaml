id: ancestor-isle
title: Остров предков
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: sky, sphere: influence }
pitch: Мимо острова медленно идёт тёмное небесное тело с развалинами на вершине; проповедники говорят, что это дом предков и что надо перейти на него, когда он коснётся кромки.

objects:
  - id: dark-isle
    type: landmark
    name: Тёмный остров
    description: Голая скала с версту длиной, на вершине видны стены без крыш и одинокая арка. Идёт вдоль кромки всё ближе, через несколько месяцев коснётся её и уйдёт дальше.
  - id: callers
    type: community
    name: Ждущие перехода
    description: Сотни горожан, которые продают дома и шьют белые одежды. Верят, что на тёмном острове их ждут ушедшие родные и жизнь без нужды.
    refs: [dark-isle]

fronts:
  - id: exodus
    title: Город готовится уйти на тёмный остров
    form: tension
    description: Ждущие бросают ремёсла и раздают имущество. Когда скала коснётся кромки, они пойдут на неё с детьми, а скала уйдёт в небо, и на ней нет ни воды, ни земли.
    impact: MAJOR
    drift: SLOW
    refs: [dark-isle, callers]
    alignment: |
      Удерживают людей правда о том, что есть на скале, слово верховного жреца о воле покровителя, уважение к тоске по ушедшим, разведчики, которые вернутся и расскажут.
      Запрет и стража у кромки только утвердят ждущих в вере.
    stake:
      stats: { influence: -5, prosperity: -3, security: -2 }
    events:
      - id: arch
        description: На закате под аркой тёмного острова видели огонь; ждущие всю ночь пели на кромке.
  - id: scout-isle
    title: Узнать, что на тёмном острове
    description: Рассмотреть скалу в трубы и, когда она подойдёт, послать на неё людей на канатах.
    impact: MINOR
    beatCount: 2
    refs: [dark-isle]
    closes:
      - { target: exodus, share: 0.6 }
    alignment: |
      Двигают дело наблюдение с небесной вышки, поиск в хрониках, смельчаки на канатах в день касания.
    stake:
      reveal:
        text: На скале стоят развалины сторожевой заставы без колодца и без земли; последние её жители выбили на арке предупреждение не селиться здесь. Огонь под аркой давало закатное солнце в куске слюды.
    clues:
      - id: chronicle
        fact: В хронике трёхсотлетней давности описана такая же скала с аркой; тогда на неё ушли сорок семей, и больше их не видели.
        alignment: Поиск в хрониках города.
