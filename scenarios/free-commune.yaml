id: free-commune
title: Вольная община
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: ideology, source: people, sphere: influence }
pitch: Три дальние деревни объявили, что будут жить без города, без податей и без денег, всё общее; к ним уходят батраки и подмастерья.

objects:
  - id: commune
    type: settlement
    name: Вольная община
    description: Три деревни у дальней кромки, которые свели скот и поля в одно и выбрали совет равных. Двери там не запирают.
    weight: MINOR
    statProfile: { prosperity: 1 }
  - id: speaker
    type: person
    name: Голос общины
    description: Бывшая городская повитуха, которая умеет говорить так, что её слушают. Верит в то, что говорит.
    refs: [commune]

fronts:
  - id: hands-leave
    title: Работники уходят в общину
    form: tension
    description: Хозяева мастерских и полей остаются без рук и требуют вернуть беглых силой. Община обещает принять каждого.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [commune, speaker]
    alignment: |
      Держат остров вместе уговор с общиной о мене и защите, лучшая доля батракам и подмастерьям в городе, разговор с её голосом.
      Поход на общину сделает её знаменем для всех бедных.
    stake:
      stats: { influence: -4, prosperity: -3 }
