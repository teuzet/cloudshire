id: sky-pearls
title: Небесный жемчуг
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: opportunity, source: creature, sphere: prosperity }
pitch: "В гнёздах, которые небесные скаты бросили под кромкой, нашли твёрдые светлые шарики с тёплым блеском; ювелиры говорят, что в сопряжение за них дадут вдесятеро против серебра."

objects:
  - id: thing
    type: resource
    name: "Брошенные гнёзда скатов"
    description: "Гнёзда из слюны и пуха, прилепленные к скале под самой кромкой. В каждом по горсти светлых шариков."

fronts:
  - id: main
    title: "Собрать небесный жемчуг"
    form: deed
    description: "Гнёзда висят под кромкой над бездной и крошатся от сырости. Достать жемчуг могут только те, кто умеет ходить по отвесу."
    impact: SIGNIFICANT
    refs: [thing]
    alignment: "Двигают дело верёвочные люльки, сборщики птичьих яиц с дальних скал, сухие лари и счёт каждой жемчужине."
    stake:
      create:
        type: resource
        name: "Ларь небесного жемчуга"
        description: "В казне лежит небесный жемчуг, который город придержит до сопряжения."
        weight: SIGNIFICANT
        statProfile: { prosperity: 4, influence: 1 }
        refs: [thing]
