id: peoples-captain
title: Любимец народа
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: success, source: people, sphere: security }
pitch: Сотник стражи, отбивший разбойничий набег, стал героем улиц; толпа носит его на руках и кричит, что ему бы править городом.

objects:
  - id: captain
    type: person
    name: Прославленный сотник
    description: Храбрый и прямой воин, которого любит стража и простой люд. Сам власти не ищет, но слушает тех, кто ему льстит.
    weight: MINOR
    statProfile: { security: 1, influence: 1 }
  - id: flatterers
    type: community
    name: Друзья сотника
    description: Кучка обиженных на совет купцов и отставных десятников. Каждый вечер объясняют сотнику, что город заждался сильной руки.
    refs: [captain]

fronts:
  - id: second-power
    title: У города появляется второй хозяин
    form: tension
    description: Стража слушает сотника охотнее, чем маршала. Его друзья уже говорят от его имени и собирают деньги.
    impact: SIGNIFICANT
    drift: SLOW
    refs: [captain, flatterers]
    alignment: |
      Удерживают равновесие почёт и настоящее дело для сотника, его разговор с маршалом и жрецом без посредников, свет на тех, кто говорит от его имени.
      Опала сделает из героя знамя.
    stake:
      stats: { influence: -4, security: -2 }
