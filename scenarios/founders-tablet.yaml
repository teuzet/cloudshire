id: founders-tablet
title: Скрижаль о земле
scale: rupture
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: betrayal, source: matter, sphere: influence }
pitch: При починке храмовой стены нашли каменную скрижаль основателей, по которой вся пахотная земля острова отдана одному роду «до конца дней»; род требует своего, и полгорода ему верит.

objects:
  - id: tablet
    type: object
    name: Скрижаль о земле
    description: Плита с древним письмом и знаком основателей. По ней один из нынешних знатных родов владеет всей пашней острова, а остальные сидят на ней из милости.
    weight: MINOR
    statProfile: { influence: -1 }
  - id: forgery
    type: object
    name: Свежий резец под старой пылью
    description: Скрижаль вырезал два года назад храмовый камнерез по заказу главы рода, а строитель замуровал её в стену перед починкой. Камень взят из новой каменоломни, которой при основателях не было, а в мастерской камнереза лежит пробный обломок с теми же строками.
    refs: [tablet]
    hidden: true

fronts:
  - id: land-claim
    title: Род требует всю пашню
    form: tension
    description: Род шлёт приказчиков мерить чужие поля. Пахари точат косы, совет расколот, храм молчит.
    impact: MAJOR
    drift: STEADY
    refs: [tablet]
    alignment: |
      Удерживают остров от смуты отсрочка любых переделов до конца разбирательства, защита пахарей, открытое изучение скрижали.
    stake:
      stats: { influence: -5, prosperity: -3, security: -2 }
    events:
      - id: stakes
        description: Приказчики рода вбили межевые колья посреди общинного поля; к вечеру колья горели.
  - id: tablet-truth
    title: Подлинна ли скрижаль
    description: Узнать, когда и кем вырезана плита.
    impact: SIGNIFICANT
    beatCount: 2
    refs: [tablet]
    closes:
      - { target: land-claim, share: 0.8 }
    alignment: |
      Двигает дело сличение письма с подлинными плитами основателей, изучение камня, расспросы тех, кто чинил стену.
    stake:
      uncover: { target: forgery }
    clues:
      - id: stone
        fact: Камень скрижали с розовой жилкой, какая идёт только в каменоломне, открытой при дедах.
        alignment: Изучение камня и сравнение с каменоломнями острова.
      - id: letters
        fact: Две буквы на плите вырезаны так, как их стали писать лишь сто лет назад.
        alignment: Сличение письма со старыми плитами.
