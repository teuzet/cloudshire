id: marsh-lights
title: Огни над топью
scale: situation
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: phenomenon, sphere: security }
pitch: Над лесной топью по ночам ходят голубые огни; двое, кто пошёл за ними, не вернулись, третий вернулся с горстью старинных монет.

objects:
  - id: marsh
    type: site
    name: Лесная топь
    description: Зыбкая топь в низине леса. Ночью над ней плывут голубые огни, всегда одной и той же дорогой.
  - id: hoard
    type: site
    name: Затонувшая застава
    description: Огни рождает горючий воздух топи, который выходит вдоль старой гати. Гать ведёт к каменной заставе, ушедшей в топь по крышу; в её подвале лежит казна, забытая с давнего мятежа.
    refs: [marsh]
    hidden: true

fronts:
  - id: follow-lights
    title: Куда ведут огни
    description: Узнать, что это за огни и что лежит на их пути.
    impact: MINOR
    beatCount: 2
    refs: [marsh]
    alignment: |
      Двигает дело разведка топи днём с шестами и верёвками, наблюдение за огнями с берега, расспросы вернувшегося.
    stake:
      uncover: { target: hoard }
    clues:
      - id: path
        fact: Огни всегда идут одной прямой линией; под ней шест упирается в брёвна.
        alignment: Промер топи вдоль пути огней.
      - id: coins
        fact: На монетах вернувшегося чеканка времён давнего мятежа.
        alignment: Изучение принесённых монет.
  - id: marsh-takes
    title: Топь забирает искателей
    description: Слух о монетах гонит людей в топь по ночам. Каждую неделю кто-то не возвращается.
    impact: MINOR
    drift: STEADY
    refs: [marsh]
    alignment: |
      Отводят беду дозор у топи, вешки и настил по разведанному пути, правда о том, что такое огни.
    stake:
      stats: { security: -3 }
