id: sleeping-engine
title: Спящая машина
scale: crisis
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: matter, sphere: prosperity }
pitch: "Под мельничным холмом вскрыли замурованный зал; в нём стоит машина основателей из бронзы и камня высотой в три роста, с колёсами, которые ещё проворачиваются."

objects:
  - id: thing
    type: structure
    name: "Машина под холмом"
    description: "Бронзовые колёса, каменные противовесы и труба, уходящая в скалу. Всё смазано и накрыто истлевшими полотнами."

fronts:
  - id: main
    title: "Разбудить машину основателей"
    form: find
    description: "Никто не знает, для чего машина. Её берегли: зал сух, оси в масле, вход заложен аккуратно. Запустить её наугад страшно, а оставить стоять обидно."
    impact: SIGNIFICANT
    beatCount: 2
    refs: [thing]
    alignment: "Двигают дело чертежи каждого узла, пробный ход вручную, поиск того, куда ведёт труба, и записи основателей о холме."
    stake:
      create:
        type: structure
        name: "Водоподъёмная машина"
        description: "Машина под холмом поднимает воду из глубины скалы, и в городе есть вода в любую сушь."
        weight: SIGNIFICANT
        statProfile: { prosperity: 3, security: 2 }
        refs: [thing]
    clues:
      - id: pipe-down
        fact: "Труба от машины уходит отвесно вниз, в мокрый камень."
        alignment: "Поиск того, куда ведёт труба."
      - id: lifts-water
        fact: "Машина поднимает воду из глубины скалы: противовесы ходят от ветра с холма."
        alignment: "Чертежи узлов и пробный ход."
