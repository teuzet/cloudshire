id: quarry-blood
title: Кровь каменоломни
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: feud, source: people, sphere: security }
pitch: После обвала в каменоломне погиб сын одного рода каменотёсов; род винит соседей, которые крепили свод, и клянётся взять жизнь за жизнь.

objects:
  - id: clan-a
    type: community
    name: Род погибшего
    description: Большая семья каменотёсов. Потеряла старшего сына под обвалом и требует крови.
  - id: clan-b
    type: community
    name: Род крепильщиков
    description: Семья, которая ставила подпорки в том забое. Клянётся, что крепила на совесть.
  - id: truth
    type: object
    name: Подпиленная стойка
    description: Стойку в забое подпилил приказчик каменоломни, чтобы скрыть, что продал хороший лес на сторону и поставил гнилой. Обломок стойки со следами пилы лежит под завалом.
    hidden: true

fronts:
  - id: vendetta
    title: Род идёт за кровью
    form: tension
    description: Мужчины рода погибшего точат кайла. Если их не остановить, за одной смертью пойдут другие, и каменоломня встанет.
    impact: SIGNIFICANT
    drift: STEADY
    refs: [clan-a, clan-b]
    alignment: |
      Останавливают месть суд при всём народе, вира по старому обычаю, правда о том, отчего рухнул свод.
    stake:
      stats: { security: -4, prosperity: -2 }
  - id: why-collapse
    title: Отчего рухнул свод
    description: Разобрать завал и узнать, кто на самом деле виноват в обвале.
    impact: MINOR
    beatCount: 2
    refs: [clan-a, clan-b]
    closes:
      - { target: vendetta, share: 0.7 }
    alignment: |
      Двигает дело разбор завала, осмотр стоек, расспросы тех, кто привозил лес в каменоломню.
    stake:
      uncover: { target: truth }
    clues:
      - id: timber
        fact: Лес для крепей в тот месяц привезли сырой и с червоточиной.
        alignment: Расспросы возчиков и проверка счетов на лес.
