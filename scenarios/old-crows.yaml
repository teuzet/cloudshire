id: old-crows
title: Вороны старой башни
scale: episode
# Оси режиссёра: что движет историей, где причина, какой сфере достаётся.
axes: { engine: discovery, source: creature, sphere: influence }
pitch: "Вороны, что испокон живут на старой башне, заговорили человечьими словами; старики узнают в их выкриках обороты, которых в городе не слышали сто лет."

objects:
  - id: thing
    type: community
    name: "Вороны старой башни"
    description: "Большая старая стая на заброшенной башне. Птицы повторяют слова и целые фразы хриплыми голосами."

fronts:
  - id: main
    title: "Выслушать ворон"
    form: find
    description: "Вороны учат птенцов тому, что слышали сами. Если это правда, стая хранит речи людей, которые давно умерли."
    impact: SIGNIFICANT
    beatCount: 1
    refs: [thing]
    alignment: "Двигают дело терпеливые слушатели с записью, знатоки старого наречия, прикорм и запрет разорять гнёзда."
    stake:
      create:
        type: practice
        name: "Слушатели ворон"
        description: "При башне живут слушатели, которые записывают речи ворон; так город вернул себе слова и клятвы основателей."
        weight: SIGNIFICANT
        statProfile: { influence: 3, knowledge: 2 }
        refs: [thing]
    clues:
      - id: old-speech
        fact: "Вороны повторяют речи на наречии основателей, слово в слово, поколение за поколением."
        alignment: "Запись выкриков и знатоки старого наречия."
