<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloudshire — админка</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <div class="layout admin">
    <aside class="side">
      <h1>Cloudshire</h1>
      <p class="muted">Админка · игроки только в Telegram</p>

      <div id="status" class="status-card"></div>
      <div class="row">
        <button type="button" id="btnRefresh">Обновить</button>
      </div>

      <h2>Города</h2>
      <select id="domainSelect"></select>

      <h2>Conflux</h2>
      <label class="muted">Показать
        <select id="confluxFilter">
          <option value="active">активные</option>
          <option value="all">все</option>
        </select>
      </label>
      <div class="row">
        <button type="button" id="btnConfluxRefresh">Обновить conflux</button>
      </div>
      <div id="confluxPanel" class="conflux-list"></div>

      <h2>Force conflux</h2>
      <label class="muted">Город A
        <select id="confluxA"></select>
      </label>
      <label class="muted">Город B
        <select id="confluxB"></select>
      </label>
      <label class="muted">ETA (мес.)
        <input id="confluxEta" type="number" min="1" max="24" value="3" />
      </label>
      <label class="muted">Длительность (мес.)
        <input id="confluxDuration" type="number" min="1" max="12" value="8" />
      </label>
      <div class="row">
        <button type="button" id="btnConflux">Создать</button>
      </div>

      <div class="danger-zone">
        <h2>Опасно</h2>
        <p class="muted danger-hint">
          Тик крутит месяц сразу всем городам. Вайп стирает мир и домены (архив в Mongo/диске).
        </p>
        <div class="row danger-actions">
          <button type="button" id="btnTick" class="danger">Force tick…</button>
          <button type="button" id="btnWipe" class="danger">Wipe all…</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="city-head">
        <div id="cityImageWrap" class="city-image-wrap hidden">
          <img id="cityImage" class="city-image" alt="" />
          <div id="cityImageEmpty" class="city-image-empty hidden">нет вида острова</div>
        </div>
        <div class="city-head-bar">
          <div>
            <h2 id="cityTitle">выбери город</h2>
            <p id="citySub" class="muted"></p>
          </div>
          <div class="row chat-actions">
            <button type="button" id="btnRulerChat" disabled>Диалог правителя</button>
            <button type="button" id="btnOnboardChat" disabled>Онбординг</button>
          </div>
        </div>
        <div id="statsRow" class="stats"></div>
      </header>

      <div id="cityTabs" class="tabs">
        <button type="button" class="tab active" data-tab="overview">Обзор</button>
        <button type="button" class="tab" data-tab="genesis">Генезис</button>
        <button type="button" class="tab" data-tab="brief">Бриф</button>
        <button type="button" class="tab" data-tab="stories">Истории</button>
        <button type="button" class="tab" data-tab="orders">Указы</button>
        <button type="button" class="tab" data-tab="people">Люди</button>
        <button type="button" class="tab" data-tab="chronicle">Хроника</button>
        <button type="button" class="tab" data-tab="facts">Факты</button>
        <button type="button" class="tab" data-tab="processes">Дела</button>
        <button type="button" class="tab" data-tab="conflux">Сопряжение</button>
      </div>
      <div id="tabBody" class="tab-body">выбери город в списке слева</div>
    </main>
  </div>

  <div id="chatOverlay" class="chat-overlay hidden">
    <div class="chat-window" role="dialog" aria-modal="true">
      <header class="chat-top">
        <div>
          <strong id="chatTitle">Чат</strong>
          <span id="chatMeta" class="muted"></span>
        </div>
        <button type="button" id="btnChatClose" title="Закрыть">✕</button>
      </header>
      <div id="chatMessages" class="messages dialog"></div>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
