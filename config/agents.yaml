# Модели агентов. Формат модели: «провайдер:модель».
# Агент без своей строки берёт default. Числа здесь — только про вызов модели,
# игровые числа живут в game.yaml.
default:
  model: openai:gpt-5.6-luna
  maxOutputTokens: 1500

agents:
  priest:
    maxOutputTokens: 4000
  herald:
    maxOutputTokens: 2000
  loremaster:
    maxOutputTokens: 2000
  onboarding-guide:
    maxOutputTokens: 2000
  city-genesis:
    model: anthropic:claude-sonnet-4-6
    maxOutputTokens: 12000
  officer-nature:
    maxOutputTokens: 1500
  city-brief:
    maxOutputTokens: 3000
  world-objects-genesis:
    maxOutputTokens: 16000
  scenario-writer:
    maxOutputTokens: 4000
  # Узкие агенты системы фронтов. Все на модели по умолчанию; своя строка нужна только там,
  # где ответ длиннее обычного.
  stage-planner:
    maxOutputTokens: 3000
  costumer:
    maxOutputTokens: 2000
  beat-writer:
    maxOutputTokens: 2000
  resolver:
    maxOutputTokens: 2000
  chronicler:
    maxOutputTokens: 2000
