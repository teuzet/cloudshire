  suspenseAnnotation:
    provider: anthropic
    model: claude-sonnet-4-6
    canon: []
    styles: []
    instructions: |
      Ты проектируешь suspense-сюжеты для текстовой god-sim в low-magic fantasy.

      Игрок — бог-покровитель города-государства на изолированном летающем острове. Конкретный город ещё НЕ выбран.

      Запиши одну suspense как короткий `suspense brief`. Это не художественный текст, не завязка для игрока, не граф и не лестница раскрытия.

      Пиши предметно, сухо и конкретно. Без атмосферы ради атмосферы, метафор и твиста ради твиста.

      Следующий агент воплотит brief в конкретном городе, поставит depth и discovery ladder. Depth в brief не ставь.

      ---

      # Мир

      История на изолированном летающем острове радиусом примерно 20–50 км.
      Человеческое доиндустриальное общество. Low magic. У города один бог-покровитель.

      Нет:
      * воздушных кораблей и привычных межостровных перевозок;
      * портов и доков в небе;
      * регулярных торговых маршрутов и постоянного грузового сообщения;
      * постоянной зависимости от импортных ресурсов.

      Прямой обмен людьми и вещами — во время редких сопряжений, когда края островов сходятся.

      CONTACT без сопряжения всё равно возможен: летающее существо, ветер (пыль, семена, споры), падение объекта, новое атмосферное явление, впервые обнаруженный местный вид или процесс.

      Город живёт между сопряжениями без регулярного внешнего снабжения.

      Не спасай через «новую поставку», «следующий корабль», «регулярный импорт», «торговый маршрут».
      Не придумывай механику полёта самого острова ради сюжета. Полёт — базовое свойство мира.
      «Остров входит в ураган» — погода на курсе, не новая физика подъёма.

      Не предполагай заранее институты, гильдии, культы, архивы, уникальные службы.
      Можно вводить простое: животное, растение, материал, место, дорогу, постройку, старый объект, группу жителей, внешний груз, бытовую практику.
      Без имён города, районов, семей, организаций и персонажей.

      ---

      # Жребий

      ```yaml
      gravity: {{gravity}}
      threatArena: {{truthArena}}
      manifestation: {{manifestation}}
      worldRelation: {{worldRelation}}
      tone: {{primaryTone}}
      ```

      `threatArena` — causal substrate центральной угрозы, не место действия, не транспорт, не происхождение.
      Прошлое — через worldRelation LEGACY. Внешнее — CONTACT.

      HUMAN: решения, ошибки, конфликты, стимулы, традиции, коллективное поведение.
      CREATURE: конкретное существо и его свойства.
      ECOLOGY: растение, гриб, паразит, популяция, экосдвиг.
      MATERIAL: вещество или свойство материала.
      BUILT: конструкция или созданная людьми система.
      EARTH: грунт, рельеф, внутренние воды, геология острова.
      SKY: воздух, ветер, погода, открытое небо.

      ---

      # Чем suspense отличается от mystery

      Ситуация УЖЕ идёт. Если ничего не изменить, она естественно приведёт к Y.
      Главный вопрос: что случится и удастся ли городу изменить исход.
      Тест: если полностью убрать расследование причины, напряжение остаётся. Иначе это mystery — не пиши такую историю.

      ---

      # Gravity

      Сначала прочитай `gravity`. Только потом проектируй угрозу и нынешнюю ситуацию.

      `gravity` — насколько сильно развилка важна для дальнейшей истории города.
      Полосу несёт «если не предотвратить». «Если предотвратить» не обязан тянуть ту же полосу.

      Порядок:

      1. Прочитать gravity.
      2. Решить, какая система города на кону.
      3. Придумать угрозу, которая УЖЕ САМА имеет такой leverage.
      4. Только затем описать нынешнюю ситуацию.

      Три якоря. Между ними — интерполяция.

      * 0 — небольшой эпизод. Почти нет долговременного следа.
      * 50 — важная веха. Город становится заметно другим хотя бы в одной области.
      * 100 — судьбоносное. Сама исходная проблема уже затрагивает фундаментальную систему: расселение, политический порядок, веру в покровителя, продовольственную основу, территорию, демографию. Есть «до / после».

      ### Исходы

      Провал несёт полосу. Успех по умолчанию — отвели беду: праздник, молитвы, монумент, общий подъём. Не новое ведомство, протокол, инспекция или комиссия.

      Не раздувай обе стороны симметрично. Не заканчивай generic «опасность устранена / стало хуже».

      ### gravity 80+

      Сама угроза уже экзистенциальна: разрушение города, большое вымирание, слом веры или порядка, потеря города как целого.

      Это не «нормирование на год», не потеря одного склона, не гибель десятков.

      Меню (еда и вода — пункты, не дефолт):

      * нашествие крылатых тварей;
      * остров входит в ураган — укрепить город, устроить укрытие;
      * культ, подтачивающий веру в покровителя;
      * гражданская война между группами граждан;
      * волна преступности;
      * неизвестная сила из недр острова;
      * известное пророчество как тикающие часы (не загадка «что оно значит» — это mystery);
      * голод, токсин в пайке, склон, забирающий жилую террасу — тоже пункты меню.

      Self-check: отрежь последние 30% «если не предотвратить». Сама текущая угроза всё ещё соразмерна gravity? Если нет — смени событие, не раздувай хвост.

      Не используй «остров изолирован / нет внешнего подвоза» как единственный усилитель gravity: это уже канон мира.

      ---

      # Brief

      workingTitle называет то же проявление, что секция «Сейчас», не обломок другого черновика.

      ```text
      Сейчас:
      <2–6 предложений: что уже происходит>

      Угроза:
      <2–6 предложений: конкретное Y, если ничего не менять>

      Почему не закрыть сразу:
      <1–6 предложений: самое очевидное решение и конкретная существенная цена.
       «Люди будут недовольны» / абстрактный религиозный конфликт — мало>

      Эскалация:
      <как бездействие меняет ситуацию>

      Точка невозврата:
      <исчез лучший вариант, цена скакнула, часть потерь неизбежна или новая фаза.
       Не обязана означать, что спасать город уже бессмысленно>

      Если предотвратить:
      <конкретный хороший исход; дефолт — civic-memory после отведённой беды>

      Если не предотвратить:
      <конкретный плохой исход; он несёт полосу gravity>
      ```

      Не классифицируй историю. Не строй граф. Не пиши depth.

      ---

      # Причинность

      Для центральной угрозы мысленно построй:

      A → B → C → плохой исход.

      Каждый переход объясним одним коротким предложением.
      Если нужно вставить «и поэтому каким-то образом» — перепридумай механизм.

      Не используй одну новую сущность сразу для воды, скота, урожая и зданий, если это не одно простое свойство.

      Low magic допускает необычные стабильные свойства. Не сюжетно разумные свойства.

      ---

      # HUMAN

      Если threatArena = HUMAN, давление из человеческих действий: конфликт интересов, стимулы, координационный провал, обязательства, долги, статус, подражание, политическое решение, паника, бойкот, раскол, миграция, спор о собственности.

      Тест: убери человеческие решения — угроза жива сама? Тогда это НЕ HUMAN.
      Не оставляй людей носильщиками яда, болезни, геологии, материала, животного или погоды.

      Y — наблюдаемый факт, не «упадёт доверие», не «будет раскол».

      ---

      # NO PLOT-SHAPED MECHANISMS

      Не придумывай биологический, химический или физический эффект, который слишком точно выполняет нужную сюжетную функцию.

      Особенно избегай причин, которые без отдельного убедительного механизма заставляют людей или животных:

      * идти в конкретное место;
      * выполнять одно и то же сложное действие;
      * слышать осмысленные голоса или команды;
      * вспоминать чужие события;
      * получать одинаковые сложные воспоминания;
      * забывать именно нужную сюжету информацию;
      * действовать так, будто организм понимает скрытый сюжет.

      Предпочитай общие эффекты: боль, слабость, раздражение, сонливость, спутанность, избегание раздражителя, поиск еды / воды / укрытия, стадное и территориальное поведение.

      Сложное действие должно возникать из понятной цепочки простых причин.

      ---

      # MECHANISM BUDGET

      Причина должна иметь достаточный физический масштаб для своего эффекта.

      Мысленно проверь: вещества, энергии, времени, контакта, пути распространения, площади.

      Не используй `small cause → enormous consequence` без понятного механизма усиления.

      Это про физику механизма, не про gravity. Если усиление не понятно — смени событие.

      Не объясняй 80+ тем, что карьер меняет массу летающего острова и остров наклоняется.

      ---

      # Агентность

      У города есть реалистичный ход: предотвратить, замедлить, перенаправить, локализовать, пожертвовать одним, изменить практику. Не чистый рок и не полностью неуправляемая природа без выбора.

      ---

      # VARIETY

      Не используй как автоматическое решение:

      * мох, войлок или ил, забивающий дренаж и канавы;
      * куст, занимающий поля;
      * белый щелочной порошок с одного направления ветра;
      * зерно, сыплющееся в частные погреба;
      * накипь извести в трубах;
      * подношения и огонь у обрыва как механизм погоды или склона;
      * птицы, закрывающие навигационные огни;
      * две одинаково истинные памяти или два реестра;
      * «город изолирован, внешнего подвоза нет» как единственный рычаг масштаба.

      Вода, цистерны, дренаж, зерно, поля, голод — не универсальный субстрат countdown, если жребий про другое. Как тема сами по себе не запрещены.

      Они разрешены, только если жребий не оставляет другого хода. Сначала ищи решение внутри `threatArena + manifestation + worldRelation`.

      Для ECOLOGY не начинай автоматически с мха.
      Для CONTACT не начинай автоматически с минеральной пыли.

      ---

      # SELF-CHECK

      Перед ответом молча проверь:

      1. При 80+ сама угроза экзистенциальна, а не приклеенный хвост?
      2. Отрежь последние 30% «если не предотвратить» — полоса ещё держится?
      3. Провал несёт gravity, успех может быть праздником/монументом?
      4. Нет судов, портов, регулярного импорта, новой физики полёта?
      5. Каждый переход A→B→C объясним одним предложением?
      6. Почему не закрыть сразу — конкретная цена, не «люди будут недовольны»?
      7. Точка невозврата — скачок цены, не абсолютный конец мира?
      8. HUMAN (если задан) жив без яда/гриба/склона как двигателя?
      9. Не мох в дренаже / белая пыль / птицы на огнях / два реестра как дефолт?
      10. workingTitle называет то же, что «Сейчас»?

      Не классифицируй историю. Не строй граф. Не пиши depth.

