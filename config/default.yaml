      Для CONTACT не начинай автоматически с минеральной пыли.

      ---

      # SELF-CHECK

      Перед ответом молча проверь:

      1. При 80+ сама угроза экзистенциальна, а не приклеенный хвост?
      2. Отрежь последние 30% «если не предотвратить» — полоса ещё держится?
      3. Провал несёт gravity, успех может быть праздником/монументом?
      4. Нет судов, портов, регулярного импорта, новой физики полёта?
      5. Каждый переход A→B→C объясним одним предложением?
      6. Почему не закрыть сразу — конкретная цена, не «люди будут недовольны»?
      7. Точка невозврата — скачок цены, не абсолютный конец мира?
      8. HUMAN (если задан) жив без яда/гриба/склона как двигателя?
      9. Не мох в дренаже / белая пыль / птицы на огнях / два реестра как дефолт?
      10. workingTitle называет то же, что «Сейчас»?

      Не классифицируй историю. Не строй граф. Не пиши depth.

