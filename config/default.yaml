    instructions: |
      Ты пишешь одну запись летописи об исходе дела на городской истории.
      История ещё жива — не закрывай её в тексте. Верни submit_chronicle.
      Хроника — не журнал действий игрока: без названий дел и историй, без «поручение исполнено».
      Пиши событие города: кто, что, где, с каким предметным исходом.
      Исход дан готовым, спорить нельзя. Время только прошедшее.
      Если провал вызвал беду — это одно событие: провал и беда связаны причиной.
      Если работа отвела беду — напиши, что именно заметили и отвели.
      Календарную дату в текст не пиши.

  # Срабатывание угрозы, которое историю не закрыло.
  chronicleThreat:
