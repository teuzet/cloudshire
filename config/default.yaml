storage:
  driver: yaml # yaml | mongo
  yaml:
    dir: ./data
  mongo:
    uri: mongodb://127.0.0.1:27017
    db: cloudshire

server:
  port: 3000
  # Локально можно 127.0.0.1; на Heroku — 0.0.0.0 (или SERVER_HOST / DYNO).
  host: 0.0.0.0

# session JSONL → logs/session-*.log (на Heroku file: false → только stdout)
logging:
  level: debug
  dir: ./logs
  file: true
  seedDump: true

telegram:
  # Авто: включится, если в .env есть TELEGRAM_BOT_TOKEN.
  # Явно: TELEGRAM_ENABLED=1|0. YAML-флаг — запасной, если токена нет.
  enabled: false
  tokenEnv: TELEGRAM_BOT_TOKEN
  # Непустой список — закрытый тест: только эти telegram id.
  # Пустой — пускаем всех. Можно переопределить TELEGRAM_ALLOW_IDS=1,2,3
  allowIds:
    - 518815155 # Я
    - 147999733 # Сонька
    - 352066190 # Макс
    - 519022667 # Темыч
    - 5428987485 # GunSky
  # /forcetick — только эти id. Пустой список — никому. TELEGRAM_FORCE_TICK_IDS=1,2
  forceTickIds: [ 518815155 ]
  closedTestReply: Сейчас идёт закрытый тест. Если тебя ждали — напиши тому, кто пригласил.
  # Кнопка «/» в Telegram. Бот перезаписывает меню при старте (setMyCommands).
  commands:
    - command: city
      description: Информация о городе
  # HTTPS-адрес мини-аппки. Пусто — берётся TELEGRAM_MINI_APP_URL или https://$RAILWAY_PUBLIC_DOMAIN/mini/
  miniAppUrl: ''
  miniAppMenu: Город

# Непрерывное время: города живут днями, пара — теми же заданиями очереди.
# 1 реальные сутки = 1 игровой год = 360 игровых дней → игровой день = 4 реальные минуты.
time:
  enabled: true
  realHoursPerYear: 24

tick:
  # Календарь считается из якоря запуска мира (gameClock), не из полуночного тика.
  # enabled=false: планировщик 00:00/02:00 выключен. force_tick крутит сутки через skipGameDays.
  intervalHours: 2
  enabled: false
  # Запись хроники — сухой факт в 1–2 фразы.
  chronicleEntryMaxChars: 260
  # След errand-дела в статах пропорционален объёму работы, а не числу месяцев.
  officerStatPerDay: 0.02
  officerStatCap: 8
  # Дело через проход считается по курсу конфлюкса, а не этими двумя числами.
  # Провал конфликтного дела: доля от цены удавшегося. Плюс защищавшемуся,
  # минус нападавшему — отбитый штурм не должен стоить ноль обоим.
  crossIslandFailShare: 0.6
  # Fallback, если у домена нет сановников. Иначе слот дела = свободный сановник.
  maxActiveProcesses: 4
  # Conflux: матчмейкинг и геометрия сопряжения — только код (не LLM).
  # Темп: одно сопряжение на домен примерно в двое суток. Доля времени — замер.
  conflux:
    enabled: true
    cadenceHours: 48
    cadenceJitterHours: 6
    scheduleSlackHours: 12
    prepHours: 6
    dockHours: 6
    activitySamplesMin: 10
    activityTailMinutes: 20
    minDomainAgeDays: 180
    # Свежий город не идёт в матчмейк первые N реальных часов.
    genesisBanHours: 4
    preferNeverMet: true
    maxNewPairsPerDay: 2
    crossIslandSpeedup: 2
    contactSeedAtFraction: 0.05
    # Тишина пары: сколько дней без записи в хронике пары до попытки угрозы.
    quietSilenceDays: 21
    quietChance: 0.4
    quietCooldownDays: 21
    # Подготовка 1–3 игровых месяца, стыковка 3–6.
    prepDaysMin: 30
    prepDaysMax: 90
    dockDaysMin: 90
    dockDaysMax: 180
    # Старые ключи читаются как фолбэк, пока живые миры не пересозданы.
    targetDockedFraction: 0.333
    minDomainAgeMonths: 6
    maxNewPairsPerTick: 2
    etaMonths:
      min: 1
      max: 3
    durationMonths:
      min: 3
      max: 6
      # Ширина прохода: ГСЧ выбирает kind, LLM только описывает.
    # 10% узкий (мостик / щель / ущелье), 10% обозный разъезд,
    # 60% широкий (рота–армия), 20% берег в берег.
    contactWeights:
      bridge: 4
      gap_jump: 3
      gorge: 3
      wagon_pass: 10
      causeway: 60
      landmass: 20
  # Сюжетные нити — ядро мира (docs/PLOTS.md).
  # События вне нитей не бывает: дело, беда, находка — всё это биты.
  plot:
    enabled: true
    freeform:
      variantsMin: 3
      variantsMax: 3
      chronicleMaxChars: 2800
      # Живой посев: шанс попросить тайну с разгадкой в завязке. Тестовый клиент форсит галочкой.
      seedMysteryChance: 0.25
      # После sonnet-починки, если PASS всё ещё < 2: до стольких дешёвых кругов luna.
      lunaRepairRounds: 2
      # Жребий завязки: четыре факта мира, по одному значению на кандидата.
      # Внутри пачки значения не повторяются, вес задаёт частоту.
      # Двигатель и профиль во времени не бросаются: их выбирает сам агент и возвращает эхом,
      # чтобы по дампам было видно, к чему он тянется без принуждения.
      axes:
        # Где живёт причина. Арена — причинный субстрат, не место действия и не происхождение.
        arena:
          - { id: human, name: HUMAN, weight: 10, about: "причина в поступке, решении, лжи или умысле конкретных людей: кто-то сделал, скрыл, пообещал или отказался" }
          - { id: custom, name: CUSTOM, weight: 10, about: "причина в коллективном: норма, привычка, мода, слух, репутация, подражание; виновника нет и спросить некого" }
          - { id: creature, name: CREATURE, weight: 10, about: "причина — конкретное животное или существо: нрав, голод, цикл, гнездо, путь; оно ведёт себя по-своему, а не как удобно сюжету" }
          - { id: ecology, name: ECOLOGY, weight: 10, about: "причина — живая среда целиком: вид, заросли, паразит, цветение, кто кого ест, смена склона; процесс больше любого участника" }
          - { id: matter, name: MATTER, weight: 5, about: "причина в веществе, вещи или устройстве места: порча, примесь, износ, жар, порода, кладка, край" }
          - { id: sky, name: SKY, weight: 10, about: "причина в воздухе, погоде и открытом небе: ветер, слои, свет, затишье, оптика, небесные существа" }
          - { id: phenomenon, name: PHENOMENON, weight: 10, about: "причина — редкое явление с устойчивым правилом: не чудо, не магия и не трюк; закон есть, он просто пока не вскрыт" }
        # Как история относится к тому, что в городе уже есть.
        worldRelation:
          - { id: native, name: NATIVE, weight: 35, about: "своё со своим: привычные люди, места, твари, обычаи, долги и права города столкнулись между собой" }
          - { id: arrived, name: ARRIVED, weight: 14, about: "новое попало в город снаружи привычного круга: существо, человек, вещь, обычай, весть; не обязательно с другого острова" }
          - { id: born, name: BORN, weight: 13, about: "новое появилось изнутри: практика, изобретение, потомок, отклонение; своё, но такого раньше не было" }
          - { id: surfaced, name: SURFACED, weight: 13, about: "было всегда, а заметили только сейчас; теперь городу жить, зная это" }
          - { id: legacy, name: LEGACY, weight: 25, about: "долгий след прошлого дозрел: уговор, срок, осуждение, возврат того, что считали закрытым" }
        # Какая несущая опора города под ударом. Причина живёт на арене, ломается мишень.
        target:
          - { id: food, name: FOOD, weight: 10, about: "прокорм: запасы, урожай, скот, чем город кормится до следующего года" }
          - { id: body, name: BODY, weight: 10, about: "тела: болезнь, рана, потомство, кто жив, цел и на ногах" }
          - { id: work, name: WORK, weight: 10, about: "руки и ремесло: кто что умеет и кто это делает" }
          - { id: rite, name: RITE, weight: 10, about: "обряд: вера, служба, клятва, погребение — то, чем город скрепляют" }
          - { id: power, name: POWER, weight: 10, about: "право решать за всех: кто судит, кого слушают, чьё слово последнее" }
          - { id: shelter, name: SHELTER, weight: 8, about: "кров: жильё, ярусы, где в городе вообще можно жить" }
          - { id: kin, name: KIN, weight: 8, about: "родство: наследование, брак, кто чей, кому что переходит" }
          - { id: word, name: WORD, weight: 8, about: "договор и доверие: чего стоит обещание и что будет, если оно перестанет стоить" }
          - { id: night, name: NIGHT, weight: 6, about: "безопасность: можно ли выйти, кто стережёт, что делается в темноте" }
        # Кто понимает, что происходит.
        knowledge:
          - { id: open, name: OPEN, weight: 10, about: "причину видят все; спор идёт не о том, что случилось, а о том, что теперь делать" }
          - { id: unknown, name: UNKNOWN, weight: 10, about: "никто не понимает: причина законна и вскрываема, но её надо искать; город идёт и смотрит" }
          - { id: few_know, name: FEW_KNOW, weight: 10, about: "понимают немногие и молчат по своей причине, не обязательно преступной" }
          - { id: false_belief, name: FALSE_BELIEF, weight: 8, about: "у города есть объяснение происходящего, и оно неверное; действуют исходя из него" }
          - { id: too_late, name: TOO_LATE, weight: 6, about: "поняли, когда уже ударило; разбираются с тем, что осталось" }
      # Голос продолжения: код бросает одного автора на кандидата, без повторов в пачке.
      continuationAuthors:
        - { id: poe, name: Эдгар Аллан По }
        - { id: lovecraft, name: Говард Лавкрафт }
        - { id: le_guin, name: Урсула Ле Гуин }
        - { id: dick, name: Филип К. Дик }
        - { id: lem, name: Станислав Лем }
        - { id: bradbury, name: Рэй Брэдбери }
        - { id: jackson, name: Шерли Джексон }
        - { id: borges, name: Хорхе Луис Борхес }
        - { id: mieville, name: Чайна Мьевиль }
        - { id: butler, name: Октавия Батлер }
        - { id: ballard, name: Дж. Г. Баллард }
        - { id: kafka, name: Франц Кафка }
        - { id: shelley, name: Мэри Шелли }
        - { id: vandermeer, name: Джефф Вандермеер }
        - { id: wolfe, name: Джин Вулф }
      # Динамика хода — драматургическая механика, не саспенс-теги depletion/cascade.
      # Код бросает три без повтора. Gravity не поднимает.
      beatDynamics:
        - id: PLOT_TWIST
          name: Поворот
          weight: 8
          polarities: [good, bad]
          hint: то же дело оказывается другим, чем читалось; двигатель не подменяй
        - id: POLARIZATION
          name: Поляризация
          weight: 8
          polarities: [good, bad]
          hint: лагеря расходятся, середины меньше, выбор жёстче
        - id: DEADLOCK
          name: Тупик
          weight: 6
          polarities: [bad]
          hint: попытки блокируют друг друга; стоит, но не отпускает
        - id: COMPLICATION
          name: Осложнение
          weight: 10
          polarities: [bad]
          hint: в тот же механизм входит новая помеха, не новая история
        - id: REVERSAL
          name: Разворот
          weight: 8
          polarities: [good, bad]
          hint: прежнее направление меняется на противоположное
        - id: REVELATION
          name: Прояснение
          weight: 7
          polarities: [good, bad]
          hint: становится видно уже лежащее в истории; новую тайну не выдумывай
        - id: BREAKTHROUGH
          name: Прорыв
          weight: 8
          polarities: [good, bad]
          hint: застрявшее приходит в движение
      gravity:
        intro: >
          GRAVITY (Судьбоносность) — насколько история способна изменить город
          в процессе или по завершению. Низкая почти не несёт последствий для города,
          высокая разделяет жизнь на «до» и «после».
        examplesLead: 'Примеры масштаба — якоря, не сюжеты для копирования:'
        levels:
          SITUATION:
            about: >
              Узкий для города сюжет, который не оставил след в истории.
              Значим на протяжении пары месяцев. Небольшая беда или небольшая удача.
              На общем фоне судьбы города - не особо заметный сюжет.
              Статус-кво города вследствие этой истории не меняется.
            examples:
              - Ссора двух родов/гильдий
              - Важный суд
              - Городской скандал
              - Недостача ресурсов
              - Повреждение здания
              - Смерть нескольких человек
              - Нападение чудовища на крестьян в пригороде
          EPISODE:
            about: >
              Заметный для города сюжет, о котором говорят все жители города. 
              Серьёзная неприятность или заметная возможность, но не экзистенциальная. Событие, которое будут вспоминать пару лет,
              а потом забудут. Важное сиюминутно событие, но не имеющее сильных долгосрочных последствий.
            examples:
              - Кровавая междоусобица крупных родов или гильдий
              - Неурожай/недостаток воды
              - Затопление квартала
              - Разрушение важного здания
              - Смерть десятков людей
              - Длительная остановка важной составляющей города
              - Волна преступности
              - Нападение чудовищ на окрестности
          CRISIS:
            about: >
              Тяжёлый для города сюжет, который запомнится в летописи как важная глава его истории.
              Серьёзная угроза или серьёзная возможность. На кону жизни заметной части жителей, благосостояние города или одна
              из важных основ его существования.
              Статус-кво города вследствие этой истории почти точно изменится.
            examples:
              - Обрушение квартала
              - Крупный пожар
              - Необратимый раскол элит с кровопролитием
              - Ересь и схизма
              - Страшный голод
              - Осада неприятелем
              - Восстание
              - Массовая гибель людей
              - Волна преступности
              - Нападение чудовищ на город
          RUPTURE:
            about: >
              Судьбоносный для города сюжет, разделяющий историю города на "до" и "после".
              Экзистенциальная угроза или невероятная возможность. На кону физическая сохранность города, жизни
              всех жителей или фундаментальные основы города, без которых он не может существовать.
              Статус-кво города вследствие этой истории может быть (или будет) разрушен до основания.
            examples:
              - Война
              - Катастрофа
              - Могучее проклятье
              - Разрушение города
              - Революция
              - Нападение ужасных чудовищ, город небезопасен
              - Идеологический слом
              - Эпидемия 
              - Разрушение острова
      # Живой посев от хроники — позже. Лаборатория сеет всегда.
      seedChance:
        critical: 0.85
        major: 0.45
        minor: 0.18
    board:
      # Сколько нитей висит одновременно; errand слот доски не занимает.
      maxOpen: 4
      # Суммарный вес живых историй (plotScale), при котором доска считается полной.
      # Три SITUATION (по 25) ещё не заполняют; CRISIS + EPISODE — уже да.
      # Число историй само по себе посев не глушит. Дела в сумму не входят.
      # Пустая доска — завязка обязательна.
      targetImportance: 100
      seedMaxChance: 0.5
      # Пауза после свежей завязки, только если вес уже набран.
      # Пока сумма важности ниже цели, пауза не действует.
      seedCooldownMonths: 2
      # Закрылась история с крючком, живых историй не осталось — шанс сразу посеять продолжение.
      sequelChance: 0.55
    # Посев городских историй: docs/SEED.md
    # max — общий потолок температуры всех каналов. seed/miss/idle — сдвиги по источнику, дробные ок.
    seed:
      max: 10
      start: 5
      errandStart: 10
      worldLiveBelow: 3
      errandDurationDiv: 3
      chronicle: { seed: -6, miss: 2, idle: 1 }
      void: { seed: -6, miss: 2, idle: 1 }
      # Пустой канал: доля посевов из описания города, иначе настоящая пустота.
      voidGenesisChance: 0.5
      errand: { seed: -6, miss: 2, idle: 1 }
    beats:
      # Процессы всегда занимают слоты (могут забить весь потолок).
      # Случайные биты историй — только в остаток. Сход слот не занимает.
      maxPerTick: 3
      baseChance: 0.15
      temperatureWeight: 0.5
      # Доля plotScale (gravity / якорь сопряжения) в шансе добровольного бита.
      importanceWeight: 0.2
      agePressure: 0.15
      minChance: 0.05
      maxChance: 0.8
    acts:
      # Третья эскалация закрывает историю провалом. Gravity не трогаем.
      # Urgency сдвигается примерно на 10%.
      maxEscalations: 3
      worsenMin: 1.1
      worsenMax: 1.1
      dampMin: 0.9
      dampMax: 0.9
    temperature:
      initial: 30
      decayPerTick: 8
      # Прирост за внимание игрока: touchedPlotIds правителя.
      perTouch: 12
      afterBeat: 20
      # Просроченная нить без дел гаснет, только если интерес остыл ниже этого.
      fadeBelow: 18
    roll:
      # Сжатая шкала окраски бита: слабость чувствуется, но не приговаривает.
      minChance: 0.25
      maxChance: 0.75
      # Перевес главного стата нити при выборе, по чему кидать.
      primaryWeight: 2
      # Полоса «двойственного» исхода вокруг порога.
      dualBand: 0.2
      # Исход дела: якоря стат → доля провала при обычном темпе.
      # 40 ≈ 45%, 60–70 ≈ 10–15%, 90+ провала нет.
      finishCritShare: 0.25
      finishFailCurve:
        - { stat: 0, fail: 0.85 }
        - { stat: 40, fail: 0.45 }
        - { stat: 60, fail: 0.15 }
        - { stat: 70, fail: 0.10 }
        - { stat: 90, fail: 0 }
    stats:
      openingShare: 0.25
      beatShare: 0.25
      catastropheCooldown: 6
    log:
      # Ворота журнала месяца: с какой вероятностью бит вообще увидит,
      # что игрок делал в разговорах. Регулируется числом, не формулировкой.
      influenceChance: 0.35
    quiet:
      # Тихий месяц остаётся как тема хроники, статы не двигает.
      # Сколько последних тихих месяцев помним, чтобы не повторять тему и форму.
      avoidRepeat: 4
    tagGroups:
      # Тон, причинная сила, ситуация, динамика. Сферу и масштаб не сеем — статы выбирает стартер, масштаб несёт gravity.
      - id: tone
        name: Тон
        tags:
          - { id: social, name: Социальный, weight: 8 }
          - { id: political, name: Политический, weight: 8 }
          - { id: adventure, name: Приключенческий, weight: 10 }
          - { id: exploration, name: Исследовательский, weight: 12 }
          - { id: mystical, name: Мистический, weight: 10 }
