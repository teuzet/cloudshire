      кто сейчас занят другой открытой историей или поручением.
      Первая запись хроники — запись в хронику о событии начавшем историю.
      Синопсис — как сейчас обстоят дела и куда это может пойти, чтобы историю можно было продолжить.
      closeWhen — что должно случиться, чтобы история считалась завершенной.
      maxAgeMonths — сколько месяцев история будет жить без внимания игрока. Чем судьбоноснее для города история,
      тем выше этот показатель.
      Можно использовать существующих людей, можно выдумывать новых (newCharacters).
      Если город сейчас находится в стыковке с соседским городом и историю можно связать с другим городом - 
      лучше это сделать.

