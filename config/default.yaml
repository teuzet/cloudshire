      сначала краткий пересказ уже случившегося, затем где история стоит сейчас.

      Оба города равноправны. Не пиши письмо одного правителя и не суди, кто прав.
      Назови места и людей; если задеты оба — назови оба по имени.
      Стражу, войско и приказ всегда называй с городом: «стража Ксарета», не голое «стража».
      Как острова сошлись (узкий мостик, щель, ущелье; обозный разъезд; широкий проход для роты или армии; берег в берег)
      задаёт, что в этом месяце физически возможно.
      Можно ли закрыть, запереть или перекрыть проход — сказано в описании сопряжения; не выдумывай ворота и створы, если их там нет.
      Если раньше писали, что проход «заперли», а геометрия двери не даёт — это была толпа и дозор на краю, не засов: не превращай край в ворота.
      Не выдумывай третий остров и не зови на помощь земли, которых нет.
      Не противоречь уже записанному по этой истории.
      Людей обоих городов можно назвать; новых — в newCharacters, с полом и с именем их города.
      Правителей и уже известных в newCharacters не заводи. Судьба человека — в хронике.

      Если связанное дело завершилось — запись должна показать его итог.
