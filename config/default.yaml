storage:
  driver: yaml # yaml | mongo
  yaml:
    dir: ./data
  mongo:
    uri: mongodb://127.0.0.1:27017
    db: cloudshire

server:
  port: 3000
  # Локально можно 127.0.0.1; на Heroku — 0.0.0.0 (или SERVER_HOST / DYNO).
  host: 0.0.0.0

# session JSONL → logs/session-*.log (на Heroku file: false → только stdout)
logging:
  level: debug
  dir: ./logs
  file: true

telegram:
  # Авто: включится, если в .env есть TELEGRAM_BOT_TOKEN.
  # Явно: TELEGRAM_ENABLED=1|0. YAML-флаг — запасной, если токена нет.
  enabled: false
  tokenEnv: TELEGRAM_BOT_TOKEN
  # Непустой список — закрытый тест: только эти telegram id.
  # Пустой — пускаем всех. Можно переопределить TELEGRAM_ALLOW_IDS=1,2,3
  allowIds:
    - 518815155 # Я
    - 147999733 # Сонька
    - 352066190 # Макс
    - 519022667 # Темыч
    - 5428987485 # GunSky
  # /forcetick — только эти id. Пустой список — никому. TELEGRAM_FORCE_TICK_IDS=1,2
  forceTickIds: [ 518815155 ]
  closedTestReply: Сейчас идёт закрытый тест. Если тебя ждали — напиши тому, кто пригласил.
  # Кнопка «/» в Telegram. Бот перезаписывает меню при старте (setMyCommands).
  commands:
    - command: start
      description: Начать или создать остров
    - command: stats
      description: Состояние города
    - command: plotlines
      description: Открытые истории
    - command: delete
      description: Удалить свой остров

tick:
  # 1 реальные сутки = 1 игровой год → тик = 1 игровой месяц
  intervalHours: 2
  enabled: true
  chronicleEvents:
    min: 2
    max: 4
  # Запись хроники — сухой факт в 1–2 фразы. Ориентир для промпта резолверов.
  chronicleEntryMaxChars: 260
  # После процессов — ориентир побочных событий месяца (не раздувать хронику).
  sideEventsMax: 2
  # Ориентир для резолвера: обычные месячные сдвиги мелкие.
  # Жёсткого потолка нет — катастрофа может обвалить стат почти до нуля за одну запись.
  typicalStatDelta: 5
  # Сколько длительных дел может идти параллельно (5-е и далее declare_process отклоняет программно).
  maxActiveProcesses: 4
  # Conflux: матчмейкинг и геометрия сопряжения — только код (не LLM).
  # Approaching считается соло для доли времени; docked — конфлюкс.
  conflux:
    enabled: true
    targetDockedFraction: 0.5
    minDomainAgeMonths: 6
    preferNeverMet: true
    rematchChronicle: true
    maxNewPairsPerTick: 2
    etaMonths:
      min: 6
      max: 12
    # Фаза docked — отдельно, сверх сближения.
    durationMonths:
      min: 2
      max: 4
    # Ширина прохода: ГСЧ выбирает kind, LLM только описывает.
    # 10% узкий (мостик / щель / ущелье), 10% обозный разъезд,
    # 60% широкий (рота–армия), 20% берег в берег.
    contactWeights:
      bridge: 4
      gap_jump: 3
      gorge: 3
      wagon_pass: 10
      causeway: 60
      landmass: 20
  # Сюжетные нити — ядро мира (docs/PIVOT_PLOTLINES.md).
  # События вне нитей не бывает: дело, указ, находка — всё это биты.
  plot:
    enabled: true
    board:
      # Сколько нитей висит одновременно; errand — проходные нити дел.
      maxOpen: 5
      maxErrands: 2
      # Суммарная важность живых историй, при которой доска считается полной.
      # Три мелких (по 25) ещё не заполняют; одна громкая и одна средняя — уже да.
      # Число историй само по себе посев не глушит. Дела в сумму не входят.
      # Пустая доска — завязка обязательна.
      targetImportance: 100
      seedMaxChance: 0.5
      # Пауза после свежей завязки, только если вес уже набран.
      # Пока сумма важности ниже цели, пауза не действует.
      seedCooldownMonths: 2
      # Закрылась история с крючком, живых историй не осталось — шанс сразу посеять продолжение.
      sequelChance: 0.55
    beats:
      # Процессы всегда занимают слоты (могут забить весь потолок).
      # Случайные тики историй и указов — только в остаток. Сход слот не занимает.
      maxPerTick: 3
      baseChance: 0.15
      temperatureWeight: 0.5
      importanceWeight: 0.2
      agePressure: 0.15
      minChance: 0.05
      maxChance: 0.8
    orders:
      # Шанс тика указа, если агент порядка не задал свой.
      defaultChance: 0.2
    acts:
      # Порог провала: оба параметра выросли в X раз от старта.
      failMultiplier: 2
      worsenMin: 1
      worsenMax: 1.5
      dampMin: 0.8
      dampMax: 1
    temperature:
      initial: 30
      decayPerTick: 8
      # Прирост за внимание: touchedPlotIds правителя или сигнал хранителя «история всплыла».
      perTouch: 12
      afterBeat: 20
      # Просроченная нить без дел гаснет, только если интерес остыл ниже этого.
      fadeBelow: 18
    roll:
      # Сжатая шкала: слабость чувствуется, но не приговаривает.
      minChance: 0.25
      maxChance: 0.75
      # Перевес главного стата нити при выборе, по чему кидать.
      primaryWeight: 2
      # Полоса «двойственного» исхода вокруг порога.
      dualBand: 0.2
    stats:
      # Раздельные месячные бюджеты: решения игрока и события мира.
      playerBudget: 6
      worldBudget: 8
      importanceScale: 0.08
      finaleFactor: 2
      catastropheCooldown: 6
    log:
      # Ворота журнала месяца: с какой вероятностью бит вообще увидит,
      # что игрок делал в разговорах. Регулируется числом, не формулировкой.
      influenceChance: 0.35
    quiet:
      # Тихий месяц не пустой: у города своя погода даже без сюжета.
      # Как часто у тихого месяца есть след в статах.
      driftChance: 0.65
      # Доля дрифтов покрупнее (±2 вместо ±1).
      notableChance: 0.25
      # Тяга к середине: просевшее чаще выправляется, раздутое чаще садится.
      meanReversion: 0.7
      # Насколько охотнее месяц вспоминает про крайние статы.
      extremeBias: 1
      # Сколько последних тихих месяцев помним, чтобы не повторять тему и форму.
      avoidRepeat: 4
    tagGroups:
      # Характер, сфера (статы), источник, масштаб.
      # Не сцена и не предмет. Охват только город и остров.
      - id: character
        name: Характер
        tags:
          - { id: mystic, name: Мистический }
          - { id: ominous, name: Зловещий }
          - { id: political, name: Политический }
          - { id: dramatic, name: Драматический }
          - { id: civic, name: Общественный }
          - { id: solemn, name: Торжественный }
          - { id: austere, name: Суровый }
          - { id: grim, name: Мрачный }
          - { id: restless, name: Неспокойный }
          - { id: sacred, name: Священный }
          - { id: bitter, name: Горький }
          - { id: ancient, name: Древний }
          - { id: foreign, name: Чужой }
          - { id: feverish, name: Лихорадочный }
      - id: sphere
        name: Сфера
        tags:
          - { id: prosperity, name: Достаток/Провизия }
          - { id: faith, name: Вера }
          - { id: culture, name: Культура/Обычаи }
          - { id: order, name: Порядок/Закон }
          - { id: knowledge, name: Знание }
          - { id: might, name: Мощь/Оборона }
      - id: source
        name: Источник
        tags:
          - { id: any, name: По желанию - как удобно истории, weight: 3 }
          - { id: frontier, name: Внешние рубежи/что-то пришло совсем извне, weight: 1 }
          - { id: city, name: Сам город/люди/здание внутри города, weight: 1 }
          - { id: outskirts, name: Пригород/деревни/крестьяне, weight: 1 }
          - { id: isle, name: Необжитые земли острова/природа острова, weight: 0.5 }
          - { id: depths, name: Недра острова/пещеры/шахты, weight: 1 }
          - { id: sky, name: Небо/погодные явления, weight: 1 }
          - { id: past, name: Прошлое/легенды/раскопки/истории, weight: 1 }
      - id: scale
        name: Масштаб
        tags:
          - { id: city, name: Весь город/Весь остров, weight: 1.5 }
          - { id: quarter, name: Квартал/большая группа жителей/гильдия/организация, weight: 2 }
          - { id: neighborhood, name: Соседство/Несколько домов/Небольшая группа людей, weight: 1 }
          - { id: person, name: Один или несколько человек, weight: 0.5 }
    # Тайна: причинный граф, жёсткий тип, мягкая окраска ассоциативным полем.
    mystery:
      graph:
        minNodes: 4
        maxNodes: 5
        sideRevealChance: 0.5
        # linear_4 и linear_side — по 50%. linear_5 пока выключен (вес 0).
        # Каскад Luna→Terra: полная попытка = граф дошёл до judge. Провал — новый жребий.
        judgeAttempts: 3
        generateTries: 6
        shapes:
          - { id: linear_4, weight: 1 }
          - { id: linear_5, weight: 0 }
          - { id: linear_side, weight: 1 }
      # Каталог сущностей города: агент cityEntities после генезиса. Модели-тайне не отдаём —
      # система кладёт 1 якорь, совсем изредка 2 (иногда слот «изобрети новое»).
      entities:
        minCatalog: 32
        maxCatalog: 48
        pickMin: 1
        pickMax: 2
        twoChance: 0.12
        inventChance: 0.15
      tagGroups:
        - id: association
          name: Ассоциативное поле
          tags:
            - { id: trace, name: след }
            - { id: boundary, name: граница }
            - { id: residue, name: остаток }
            - { id: memory, name: память }
            - { id: echo, name: эхо }
            - { id: difference, name: различие }
            - { id: link, name: связь }
            - { id: void, name: пустота }
            - { id: rhythm, name: ритм }
            - { id: layer, name: слой }
            - { id: pressure, name: давление }
            - { id: exchange, name: обмен }
            - { id: asymmetry, name: асимметрия }
            - { id: inertia, name: инерция }
            - { id: threshold, name: порог }
            - { id: repeat, name: повтор }
            - { id: shift, name: смещение }
            - { id: distance, name: расстояние }
            - { id: dependence, name: зависимость }
            - { id: wear, name: износ }

        - id: type
          name: Тип тайны
          tags:
            - id: conspiracy
              name: заговор
              kind: institution
              about: несколько участников скрытно координируют действия ради общей цели, которую им нельзя или невыгодно преследовать открыто

            - id: crime
              name: преступление
              kind: tension
              about: кто-то сознательно причинил запрещённый или тяжёлый вред; скрыты виновник, способ, мотив или связь между ними

            - id: disappearance
              name: пропажа людей
              kind: place
              about: один или несколько людей отсутствуют там, где должны были находиться; скрыта общая причина их исчезновения, перемещения или недоступности

            - id: loss
              name: потеря
              kind: artifact
              about: нечто значимое больше недоступно тем, кому принадлежало или было нужно; скрыто, что с ним произошло, почему или кто к этому причастен

            - id: cult
              name: культ
              kind: cult
              about: существует закрытая система общей веры, практики или подчинения, чьи реальные цели, устройство или действия существенно отличаются от того, что видно извне

            - id: poisoning
              name: отравление
              kind: substance
              about: вред передаётся через материальный, биологический или иной физический носитель; скрыты источник, путь распространения, состав или причина воздействия

            - id: impostor
              name: самозванец
              kind: tension
              about: человек воспринимается как носитель личности, роли, происхождения или полномочий, которые в действительности ему не принадлежат

            - id: betrayal
              name: предательство
              kind: institution
              about: участник отношений доверия или обязательства сознательно действует против интересов тех, кому обязан лояльностью, и скрывает это противоречие

            - id: forbidden
              name: запретное знание
              kind: secret_place
              about: существует факт, закономерность, способ или понимание, доступ к которому ограничивают либо распространение которого считают опасным; форма знания может быть любой

            - id: artifact
              name: артефакт
              kind: artifact
              about: конкретная вещь имеет важное для тайны происхождение, назначение, свойство или историю использования, которые скрыты либо поняты неверно

            - id: locus
              name: таинственное место
              kind: secret_place
              about: реальные свойства, происхождение, назначение или происходящие процессы определённого места существенно отличаются от того, что о нём известно

            - id: kidnapping
              name: похищение
              kind: place
              about: человека или людей сознательно лишили свободы, переместили или удерживают против их воли; скрыты участники, цель, способ или место удержания

            - id: false_miracle
              name: ложное чудо
              kind: cult
              about: наблюдаемое событие принимают за божественное, магическое или сверхъестественное явление, но его действительная причинная природа иная

            - id: sabotage
              name: саботаж
              kind: infrastructure
              about: кто-то сознательно нарушает работу важной системы, чтобы вызвать определённое последствие, скрыть другое действие или помешать нормальной работе

            - id: blackmail
              name: шантаж
              kind: tension
              about: один участник принуждает другого действовать против собственной воли, используя угрозу раскрытия, утраты, наказания или иного конкретного вреда
    seedRoles:
      - { role: смотритель цистерн, about: обходит водосборы на рассвете }
      - { role: писец управы, about: ведёт списки дворов и пайков }
      - { role: дозор у края, about: стоит смену на западной тропе }
      - { role: носильщик воды, about: таскает вёдра по ярусам }
      - { role: садовник яруса, about: обрезает лозы на среднем уступе }
      - { role: мельник, about: держит жернова у нижнего ряда }
      - { role: костоправ, about: правит вывихи после каменоломни }
      - { role: фонарщик, about: зажигает чаши вдоль мостков }
      - { role: певчий часовни, about: ведёт общий звон по праздникам }
      - { role: торговка солью, about: держит лавку у рыночной лестницы }
      - { role: мостовщик, about: чинит кладку между ярусами }
      - { role: скорняк, about: шьёт мех в холодный сезон }
      - { role: гончар, about: обжигает кувшины для цистерн }
      - { role: пчеловод, about: держит ульи на солнечном склоне }
      - { role: цирюльник, about: бреет и пускает кровь в нижнем ряду }
      - { role: звонарь, about: бьёт часы с городской башни }
      - { role: кровельщик, about: ладит щепу на крутых крышах }
      - { role: бондарь, about: собирает бочки для сусла и воды }
      - { role: верёвочник, about: вьёт канаты для подъёмников }
      - { role: стекольщик, about: вставляет стёкла в ставнях }
      - { role: повитуха, about: принимает роды в трёх кварталах }
      - { role: прачка, about: полощет бельё у общего жёлоба }
      - { role: углежог, about: жжёт уголь за каменоломней }
      - { role: колесник, about: делает колёса для тележек ярусов }
  # Долгая память без раздувания промптов (оригиналы хроники/писем хранятся целиком).
  memory:
    chronicleRecent: 15
    chronicleDigestMaxLines: 20
    dialogPromptMessages: 16
    compressTickNewsOlderThan: 2
  # Покровитель молчит: письмо месяца пишет tickNews, стюард только заводит дела.
  steward:
    # После стольких писем без ответа следующее письмо — «потерял игрока».
    loseAfterLetters: 2
    # С стольких уже ушедших писем без ответа стюард ходит каждый месяц, пока игрок молчит.
    afterSilentMonths: 3

llm:
  defaultProvider: openai
  openai:
    apiKeyEnv: OPENAI_API_KEY
    defaultModel: gpt-4o-mini
  # Учёт токенов → logs/worlds/<worldId>/usage.jsonl; после wipe — data/archives/<worldId>/logs/
  usage:
    enabled: true
    filePrefix: usage
  # USD за 1M токенов (ориентир API GPT-5.6 / 4o-mini; правь при смене прайса).
  pricing:
    default:
      input: 0
      output: 0
      unknown: true
    models:
      gpt-5.6-luna:
        input: 0.20
        output: 1.20
        cachedInput: 0.02
      gpt-5.6-terra:
        input: 2.00
        output: 12.00
        cachedInput: 0.20
      gpt-5.6-sol:
        input: 4.00
        output: 24.00
        cachedInput: 0.40
      gpt-4o-mini:
        input: 0.15
        output: 0.60
        cachedInput: 0.075

world:
  # Ключ сезона/шаблона (не уникален). Уникальный id экземпляра мира
  # выдаётся при создании / wipe: world_<hex>. Один мир = один запуск до wipe.
  id: season-1
  name: «Облачный шир» — сезон I
  description: |
    Мир летающих островов в небесном просторе.
    Каждый домен игрока — город-государство на своём волшебном летающем острове.
    Игроки говорят с правителем от лица божества-покровителя.
  cosmology: |
    КОСМОЛОГИЯ (обязательна для генезиса и всех агентов мира):
    - Город стоит на волшебном летающем острове. Сам полёт острова — закон мира, не бытовая магия жителей.
    - Это low-magic сеттинг: магия существует, но не проявляется повсеместно.
      Быт, ремёсла, дороги и власть держатся на труде, дереве, камне и договоре.
      Чудо редко и заметно; заклинание не заменяет плотника, лекаря и стражу как норму улицы.
      Не насыщай город магическими школами, лампами, пропитками и контурами как повседневностью.
    - Город занимает центр острова. Вокруг города — примерно до 20-50 км освоенной
      и полуосвоенной земли (поля, леса, каменоломни, деревушки, тропы).
    - Дальше земля обрывается: край острова, бездна облаков и ветра.
    - На острове нет «далекого континента» и нет бесконечных границ королевства —
      это город-государство на одном острове, не империя.
    - В небе бывают силуэты других летающих островов — это закон природы, неподвластный
      людям и богам-покровителям: курс чужих островов нельзя направлять, договариваться
      о встрече или «назначать» сопряжение. Жители лишь видят пролёты издалека.
    - Время от времени два острова сходятся краями. Это называют сопряжением:
      достаточно редкое, но не феноменальное событие мира. На время сопряжения между
      краями появляется проход — узкий или широкий, ровный или с перепадом высот.
    - Конкретных соседних летающих островов не придумывай, их все создаст система, когда нужно.
    - Люди по умолчанию не летают. Нет небесных пристаней, доков, верфей и флота в воздухе.
      С острова ходят по земле: тропы, мосты, лестницы, подъёмники. В небо не поднимаются.

# Абстрактные статы 0–100. На старте — нормальное распределение к центру (не сумма 300).
# Население — отдельное поле (см. genesis.population).
# Эпитет в скобках у значения: ближайшая нижняя ступень шкалы.
statEpithets:
  0: ужасающе
  12: плачевно
  25: скудно
  37: скромно
  50: обычно
  62: заметно
  75: сильно
  87: блистательно
  100: божественно

stats:
  - id: prosperity
    name: Благосостояние
    about: Запасы, сытость, торговля внутри острова, крыша над головой.
    covers: Еда, вода, склады, рынок, плата мастерам, нищета и зажиточность дворов.
    changeWhen: Урожай, раздача, кража запасов, разорение квартала, удачная сделка, голод.
    scale:
      0: "Нищета, пустые склады, голод на улицах"
      25: "Скудная жизнь, едва сводят концы с концами"
      50: "Устойчивый достаток среднего торгового города"
      75: "Богатый город с запасами и витринами зажиточности"
      100: "Легендарное изобилие, сокровищницы полны"
  - id: faith
    name: Вера
    about: Доверие к покровителю и сила культа в быту.
    covers: Храмы, обряды, жрецы, знамения, ересь, насколько люди слушаются бога.
    changeWhen: Чудо, сорванный обряд, кощунство, явленный знак, пустые праздники, исцеление.
    scale:
      0: "Безверие и цинизм; храмы пустуют"
      25: "Слабые обряды, мало кто всерьёз верит"
      50: "Обычная набожность; праздники соблюдают"
      75: "Глубокая религиозность пронизывает быт"
      100: "Фанатальная преданность богам и знамениям"
  - id: culture
    name: Культура
    about: Искусства, вкус, школы ремесла и память обычаев.
    covers: Песни, театр, зодчество, праздники, грамотность быта, как город говорит о себе.
    changeWhen: Новый мастер, сожжённая школа, праздник удался или сорван, запрет песен.
    scale:
      0: "Грубый быт без искусств и школ"
      25: "Редкие песни и ремёсла без изыска"
      50: "Живые традиции, ярмарки, местные мастера"
      75: "Славится поэзией, зодчеством или театром"
      100: "Культурная столица островов, эталон вкуса"
  - id: stability
    name: Стабильность
    about: Порядок на улице и то, слушается ли город власти.
    covers: Стража, бунт, суд, слухи против правителя, управляемость кварталов.
    changeWhen: Бунт, казнь, справедливый суд, голодный бунт унят, власть осмеяна, указ принят.
    scale:
      0: "Хаос, бунты, власть не держит улицу"
      25: "Хрупкий порядок, частые вспышки недовольства"
      50: "Спокойная управляемость, редкие волнения"
      75: "Жёсткий порядок и предсказуемые законы"
      100: "Незыблемый строй; мятеж почти немыслим"
  - id: knowledge
    name: Знание
    about: Грамотность, учёность, тайны ремесла и архивы.
    covers: Школы, книги, инженерия, магия учёных, карты, память мастеров.
    changeWhen: Открыли способ, сожгли архив, пришёл учитель, забыли ремесло, нашли чертёж.
    scale:
      0: "Невежество; грамотных единицы"
      25: "Устные предания, мало книг и мастеров"
      50: "Школы, архивы, практические умения"
      75: "Сильные академии, инженерия или магия учёных"
      100: "Хранилище тайн эпохи; опережает соседние острова"
  - id: might
    name: Мощь
    about: Войско, стены, способность ударить и удержать край.
    covers: Ополчение, стража у обрыва, оружие, укрепления, готовность к бою.
    changeWhen: Набор в строй, разгром отряда, новые стены, потеря оружия, победа в схватке.
    scale:
      0: "Беззащитный город: нет армии и укреплений"
      25: "Слабая стража, держится скорее удачей"
      50: "Обычное ополчение и стены среднего острова"
      75: "Сильная армия, уважаемая в округе"
      100: "Легендарная армия; враги обходят остров стороной"

genesis:
  # Статы: N(mean, std), клип в [statMin, statMax]
  statMean: 50
  statStd: 12
  statMin: 18
  statMax: 82
  population:
    min: 5000
    max: 100000
  # Минимальный объём каждого аспекта (символов).
  aspectMinChars: 280
  aspectBatchSize: 4
  openingLoreCount:
    min: 8
    max: 16
  # Короткие живые истории сразу после создания города — чтобы было чем заняться.
  openingPlots:
    min: 1
    max: 2
  # Картина острова после генезиса. Содержание — из описания города; стиль общий.
  image:
    enabled: true
    provider: openai
    model: gpt-image-2
    size: 1792x1024
    quality: medium
    dir: data/images
    style: |
      A sober Northern-Renaissance veduta in thin oil on oak panel: van Eyck patience
      in the glazes, the cool distance of a 17th-century Dutch sky study.
      Mineral pigments only — terre verte, yellow ochre, lead-tin yellow, azurite,
      bone black, lead white. Overcast daylight. No sunburst, no god-rays, no neon,
      no bloom. Clouds are heavy weather, not decoration.
      Architecture is masonry, timber, tile and rope, slightly weathered, human-scaled.
      No sky-ships, no hanging harbors, no docks on the rim.
      Plants follow the island climate but are painted with botanical care, not
      glowing fantasy flora. The island floats in a deep grey-blue sky; below is
      pale mist, not an ocean and not a starfield.
      Calm wide establishing view from far away: a LARGE flying island, city in the
      CENTER, most of the land rural. The cliff-edge is a distant rim, never flush
      with the walls. Tiny figures if any. No anime, no comic ink, no modern CGI sheen,
      no heroic poster lighting, no gold frames, no coats of arms.
  aspects:
    - id: overview
      title: Общий облик
      hint: "Устойчивый силуэт города и острова: чем запоминается веками, не новость недели"
    - id: history
      title: История и основание
      hint: "Основание, ключевые эпохи, старые травмы и гордости — то, что уже вошло в предание"
    - id: geography
      title: География и климат
      hint: "Рельеф, воды, почвы, край обрыва, характер сезонов — постоянные условия острова"
    - id: districts
      title: Районы и планировка
      hint: "Устоявшиеся кварталы, центр и окраины, как устроены пути по острову"
    - id: economy
      title: Хозяйство и торговля
      hint: "Долгая опора хозяйства НА СВОЁМ острове: чем кормятся поколениями, внутренние рынки — без регулярных гостей с чужих островов"
    - id: crafts
      title: Ремёсла, техника или магия труда
      hint: "Традиционные умения, цеха, инструменты — то, чему учат детей"
    - id: society
      title: Общество и сословия
      hint: "Устойчивые слои, семьи, отношение к чужакам — структура, не скандал месяца"
    - id: customs
      title: Обычаи и праздники
      hint: "Календарь обрядов, табу, этикет — повторяющиеся традиции"
    - id: faith
      title: Вера и культы
      hint: "Храмы, жречество, ереси, место покровителя в культе — институты веры"
    - id: governance
      title: Власть и закон
      hint: "Как устроена власть и суд издавна: должности, налоги, обычай преемственности"
    - id: defense
      title: Оборона и сила
      hint: "Укрепления, стража, дозор у края — обычный способ отражать угрозы, не текущая война"
    - id: knowledge
      title: Знание и обучение
      hint: "Школы, архивы, ремёсла знания, хранимые тайны"
    - id: landmarks
      title: Места силы и достопримечательности
      hint: "3–6 постоянных мест с характером и старыми преданиями о каждом"
    - id: sustenance
      title: Еда, вода, ресурсы
      hint: "Как остров кормит и поит город в принципе: источники, цистерны, склады, сезонный ритм"
    - id: transport
      title: Пути и край
      hint: "Тропы, мосты, лестницы, подъёмники по острову; жизнь у обрыва. Нет пристаней, доков и полётов"
    - id: dailyLife
      title: Повседневность
      hint: "Типичный уклад дня разных сословий — ритм жизни, не события этой недели"
    - id: relations
      title: Внешний горизонт
      hint: "Как город относится к небу и чужим островам, сопрягающимся и пролетающим мимо."
    - id: threats
      title: Хронические риски
      hint: "Устойчивые уязвимости своего острова (вода, край, культы, внутренняя рознь). Проблемы с которыми население исторически сталкивается."
    - id: rumors
      title: Предания и тайны
      hint: "Старые слухи и загадки своего города; не сплетни про выдуманные чужие острова"
