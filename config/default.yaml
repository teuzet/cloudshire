storage:
  driver: yaml # yaml | mongo
  yaml:
    dir: ./data
  mongo:
    uri: mongodb://127.0.0.1:27017
    db: cloudshire

server:
  port: 3000
  host: 127.0.0.1

# session JSONL → logs/session-*.log
logging:
  level: debug
  dir: ./logs

telegram:
  # Авто: включится, если в .env есть TELEGRAM_BOT_TOKEN.
  # Явно: TELEGRAM_ENABLED=1|0. YAML-флаг — запасной, если токена нет.
  enabled: false
  tokenEnv: TELEGRAM_BOT_TOKEN

tick:
  # 1 реальные сутки = 1 игровой год → тик = 1 игровой месяц
  intervalHours: 2
  enabled: true
  chronicleEvents:
    min: 2
    max: 4
  # После процессов — ориентир побочных событий месяца (не раздувать хронику).
  sideEventsMax: 2
  # Ориентир для резолвера: обычные месячные сдвиги мелкие.
  # Жёсткого потолка нет — катастрофа может обвалить стат почти до нуля за одну запись.
  typicalStatDelta: 5
  # Сколько длительных дел может идти параллельно (5-е и далее declare_process отклоняет программно).
  maxActiveProcesses: 4
  # Conflux: матчмейкинг и геометрия стыка — только код (не LLM).
  # Approaching считается соло для доли времени; docked — конфлюкс.
  conflux:
    enabled: true
    targetDockedFraction: 0.5
    minDomainAgeMonths: 6
    preferNeverMet: true
    rematchChronicle: true
    maxNewPairsPerTick: 2
    etaMonths:
      min: 2
      max: 4
    durationMonths:
      min: 2
      max: 4
    # Ширина прохода: ГСЧ выбирает kind, LLM только описывает.
    contactWeights:
      hairline: 1
      bridge: 1.2
      gap_jump: 1
      causeway: 1
      landmass: 0.9
  plotlines:
    enabled: true
    heatPerTick: 10
    maxOpen: 6
    softMax: 4
    hooksMaxLen: 120
    attention:
      initial: 20
      bumpFactor: 1
      chronicleLink: 12
      breakthroughBonus: 8
      decayPerTick: 3
    survival:
      minAgeTicks: 3
      keepBarBase: 8
      keepBarPerAge: 4
    spawn:
      baseChance: 0.10
      emptyBoardBonus: 0.25
      perPlotPenalty: 0.03
      perTempSumPenalty: 0.0004
      softMaxFactor: 0.45
      minChance: 0.02
      maxChance: 0.45
    # Посев для мандата «новой крови» (режиссёр, не генезис города).
    seedTagGroups:
      - id: spark_source
        name: Источник искры
        tags:
