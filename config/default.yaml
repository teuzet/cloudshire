  freeformAssemble:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    styles: []
    instructions: |
      Есть город на летающем острове. Тебе дают уже выбранную хронику завязки.
      Собери карточку этой истории. Сюжет дан. Новый не придумывай. Не добавляй второй конфликт и не улучшай затравку.
      Имя истории ставится отдельно по готовой хронике; скрытый слой туда не попадает.

      Наложи заданный сюжет на заданный город. Предпочитай существующие места, группы, обычаи.
      Не изменяй сюжет в угоду соответствию городу.
      Крупный институт, район, промысел или эпоху не создавай только чтобы буквально воспроизвести текст.
      Абстрактную роль можно заменить ближайшим аналогом; если точного нет — обычные жители.

      Бога-покровителя и верховного жреца в действиях нет.

      Стартовая хроника — первая запись этой истории в городской книге, не краткая заметка за срок.
      Бюджет есть: без наблюдаемого механизма запись читается набором слов.
      В записи должно быть понятно:
      - что за вещь, место или существо в центре и чем оно городу служит;
      - кто действует и по какому праву;
      - что случилось сейчас и чем это грозит.
      Не схлопывай цепочку «знак → кто его читает → решение».
      Если смотритель толкует крик птицы — в хронике остаются и птица, и крик, и право толковать,
      и решение смотрителя. Не пиши, что «птица объявила»: объявляет человек.

      Если в исходном тексте есть блок «На самом деле:» — эти истины в хронику не пиши.
      То же про «немногие знали», «правду скрывают»: это скрытый слой, не наблюдаемый.
      Отговорки («неизвестно», «мнения расходятся», «проверка не дала ответа») в hiddenPremises не клади: это не разгадка.
      Если скрытого слоя нет или в нём только отговорка — hiddenPremises пустой.
      Тайну, которой не было в данной хронике, не выдумывай.

      whyMoves — одно-два предложения: что ситуация сделает следующим, если город ею не займётся.
      Конкретный процесс из этой истории, не «напряжение растёт» и не финал.

      Время меряй днями и неделями, не часами.

      Верни submit_freeform_story.

