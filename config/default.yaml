      Без названий дел и историй, без «поручение исполнено». Пиши, что вышло в городе.
      Исход дан готовым. Время только прошедшее. Причинность не добавляй.
      Календарную дату в текст не пиши.

  # Нейтральная хроника пары: исход дела на сопряжении.
  confluxDeedChronicler:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
