world:
  # Ключ сезона/шаблона (не уникален). Уникальный id экземпляра мира
  # выдаётся при создании / wipe: world_<hex>. Один мир = один запуск до wipe.
  id: season-1
  name: «Облачный шир» — сезон I
  description: |
    Мир летающих островов в небесном просторе.
    Каждый домен игрока — город-государство на своём волшебном летающем острове.
    Игроки говорят с правителем от лица божества-покровителя.
  cosmology: |
    КОСМОЛОГИЯ (обязательна для генезиса и всех агентов мира):
    - Город стоит на волшебном летающем острове. Сам полёт острова — закон мира, не бытовая магия жителей.
    - Это low-magic сеттинг: магия существует, но не проявляется повсеместно.
      Быт, ремёсла, дороги и власть держатся на труде, дереве, камне и договоре.
      Чудо редко и заметно; заклинание не заменяет плотника, лекаря и стражу как норму улицы.
      Не насыщай город магическими школами, лампами, пропитками и контурами как повседневностью.
    - Город занимает центр острова. Вокруг города — примерно до 20-50 км освоенной
      и полуосвоенной земли (поля, леса, каменоломни, деревушки, тропы).
    - Дальше земля обрывается: край острова, бездна облаков и ветра.
    - На острове нет «далекого континента» и нет бесконечных границ королевства —
      это город-государство на одном острове, не империя.
    - В небе существуют другие летающие острова, иногда они пролетают мимо. Это закон природы,
      управление островами недоступно ни людям, ни богам-покровителям: курс островов нельзя менять.
    - Время от времени два острова сходятся краями. Это называют "сопряжением":
      достаточно редкое, но не феноменальное событие мира. Острова стыкются и между ними можно ходить.
    - Сопряжение - это строгий термин, который используют только для события стыковки двух островов.
    - Люди по умолчанию не летают. Нет небесных пристаней, доков, верфей и флота в воздухе.
      С острова ходят по земле: тропы, мосты, лестницы, подъёмники. В небо не поднимаются.
    - Разговор с богом-покровителем идёт только в особой закрытой святыне, у священного алтаря.
      Жрец совершает для этого особый ритуал. Другие люди этот ритуал совершить не могут:
      даже если попытаются, ничего не выйдет. Почему получается только у жреца — неизвестно.

# Вера — не стат сановника: среднее четырёх, domain.state.faith.
# Текст — игроку в миниапке; агентам веру в список статов не отдаём.
faith:
  name: Вера
  about: Насколько город ещё верит, что ты — его бог. Когда вера слабеет, обряд становится привычкой, а привычка — забвением.

mana:
  name: Мана
  about: Сила, которой ты говоришь со жрецом и благословляешь дела. Прибывает непрерывно — за игровой год столько, сколько у города веры.

# Четыре стата города. Вера — среднее, лежит в domain.state.faith, не здесь.
# На старте бюджет 220, клип [35, 75] (см. genesis.statBudget).
# Население — отдельное поле (см. genesis.population).
# Эпитет в скобках у значения: ближайшая нижняя ступень шкалы.
# about — голос игроку (миниапка и речь жреца). covers / changeWhen — каталог агентам.
statEpithets:
  0: ужасающе
  12: плачевно
  25: скудно
  37: скромно
  50: обычно
  62: заметно
  75: сильно
  87: блистательно
  100: божественно

stats:
  - id: prosperity
    name: Благосостояние
    about: Сыты ли дворы и полны ли склады. Есть ли крыша, плата за труд и праздник, который город может себе позволить.
    covers: Еда, вода, склады, рынок, ремёсла, кров, нищета и зажиточность дворов.
    changeWhen: Урожай, раздача, кража запасов, разорение квартала, удачная сделка, голод.
    scale:
      0: "Нищета, пустые склады, голод на улицах"
      25: "Скудная жизнь, едва сводят концы с концами"
      50: "Устойчивый достаток среднего торгового города"
      75: "Богатый город с запасами и витринами зажиточности"
      100: "Легендарное изобилие, сокровищницы полны"
  - id: security
    name: Безопасность
    about: "Спит ли улица спокойно. Стража, стены и порядок — одно: знает ли город, что его защищают, и боится ли тот, кто пришёл с ножом."
    covers: Ополчение, дозор у обрыва, оружие, укрепления, бунт, суд как порядок.
    changeWhen: Набор в строй, разгром отряда, новые стены, бунт, казнь, справедливый суд.
    scale:
      0: "Беззащитный город: нет армии и укреплений, улица не слушается"
      25: "Слабая стража, держится скорее удачей"
      50: "Обычное ополчение, стены и редкие волнения"
      75: "Сильная стража и предсказуемый порядок"
      100: "Незыблемый строй; враги и мятеж почти немыслимы"
  - id: knowledge
    name: Знание
    about: Помнит ли город, как лечить, строить и читать. Школы, архивы и ремесло — память, без которой остров слепнет.
    covers: Школы, книги, экспедиции, алхимия, карты, память мастеров.
    changeWhen: Открыли способ, сожгли архив, пришёл учитель, забыли ремесло, нашли чертёж, болезнь.
    scale:
      0: "Невежество; грамотных единицы"
      25: "Устные предания, мало книг и мастеров"
      50: "Школы, архивы, практические умения"
      75: "Сильные академии, инженерия или учёное ремесло"
      100: "Хранилище тайн эпохи; опережает соседние острова"
  - id: influence
    name: Влияние
    about: Слушают ли город его собственные дома — и помнят ли чужие острова его имя. Гильдии, слухи, обычаи и лицо на площади.
    covers: Гильдии, дома, суд как политика, слухи, обычаи, лицо города, праздник как смысл.
    changeWhen: Новый союз, унижение на площади, указ принят или осмеян, чужой остров запомнил имя.
    scale:
      0: "Город никто не слушает, даже свои"
      25: "Слабый голос, споры без исхода"
      50: "Обычная связность домов и цехов"
      75: "Город умеет договариваться и задавать тон"
      100: "Слово города весит как закон для своих и память для чужих"

genesis:
  # Игроку один раз, отдельным сообщением, как только началась генерация острова.
  # Полоска прогресса это сообщение не затирает. Сановников и статов здесь нет.
  tutorial: |
    Пока остров поднимается — коротко о том, как здесь живут.

    Время одно на все города и идёт непрерывно: реальные сутки — это игровой год, а игровой день проходит за четыре реальные минуты. Проиграть можно, если власть над городом потеряна, город захвачен или он перестал верить в тебя как в бога-покровителя. Время от времени острова сходятся краями — это сопряжение: на срок стыковки твой город соседствует с городом другого игрока.

    Правитель — твой жрец. Он пишет не по расписанию, а когда что-то случилось: кончилось дело, стряслась беда, началась новая история. Если вестей нужно меньше, попроси его. У него есть лояльность и ужас: от них зависит, насколько он послушен и каким тоном говорит с тобой.

    Картина города — статы, истории, дела и постоянный порядок — открывается командой /city (информация о городе) или кнопкой «Город» рядом с полем ввода.

    На острове всегда что-то происходит — тайны, распри, беды. Он расскажет сам; можно спросить, как дела, и узнать об острове больше. У города есть свойства: они влияют на жизнь и меняются почти от любого поступка.

    Два главных инструмента. Дело — разовое поручение. Жрец скажет, сколько оно займёт и насколько оно трудно. Его можно поторопить на одну ступень: тогда успех менее вероятен. Можно велеть не спешить — шансы выше. Постоянный порядок — воля, которая остаётся в городе навсегда, пока её не отменят; объявить его — тоже дело. Отдельно задаётся наказ на время сопряжения.
  # Статы после прозы: бюджет 220, клип [35, 75].
  statBudget: 220
  statMin: 35
  statMax: 75
  population:
    min: 5000
    max: 100000
  # Минимальный объём каждого аспекта (символов).
  aspectMinChars: 280
  aspectBatchSize: 4
  openingLoreCount:
    min: 8
    max: 16
  # Стартовый посев генезиса: всегда ситуация + эпизод (конвейер городских историй).
  openingPlots:
    min: 2
    max: 2
  # Картина острова после генезиса. Содержание — из описания города; стиль общий.
  image:
    enabled: true
    provider: openai
    model: gpt-image-2
    size: 1792x1024
    quality: medium
    dir: data/images
    style: |
      A sober Northern-Renaissance veduta in thin oil on oak panel: van Eyck patience
      in the glazes, the cool distance of a 17th-century Dutch sky study.
      Mineral pigments only — terre verte, yellow ochre, lead-tin yellow, azurite,
      bone black, lead white. Overcast daylight. No sunburst, no god-rays, no neon,
      no bloom. Clouds are heavy weather, not decoration.
      Architecture is masonry, timber, tile and rope, slightly weathered, human-scaled.
      No sky-ships, no hanging harbors, no docks on the rim.
      Plants follow the island climate but are painted with botanical care, not
      glowing fantasy flora. The island floats in a deep grey-blue sky; below is
      pale mist, not an ocean and not a starfield.
      Calm wide establishing view from far away: a LARGE flying island, city in the
      CENTER, most of the land rural. The cliff-edge is a distant rim, never flush
      with the walls. Tiny figures if any. No anime, no comic ink, no modern CGI sheen,
      no heroic poster lighting, no gold frames, no coats of arms.
  officers:
    image:
      enabled: true
      provider: openai
      model: gpt-image-2
      size: 1024x1024
      quality: medium
      dir: data/images/officers
      style: |
        Square Northern-Renaissance bust portrait in thin oil on oak panel.
        Same mineral palette as the island vedute: terre verte, yellow ochre,
        lead-tin yellow, azurite, bone black, lead white. Overcast indoor daylight.
        No sunburst, no neon, no bloom. One living person, half-length or bust,
        facing the viewer. Period clothing of a city officer, not a king.
        No letters, no frames, no coats of arms, no anime, no CGI sheen.
    offices:
      - { office: treasurer, statId: prosperity, title: Казначей, titleGen: казначея, focus: "хозяйство: казна, склады, закуп, раздача, стройка, кровля, укрепление склонов и оград руками мастеров, рынок, цех, голод", strategy: "В основном интересуется ресурсами, собственностью и инфраструктурой, даже в ущерб людям." }
      - { office: marshal, statId: security, title: Маршал, titleGen: маршала, focus: "общественный порядок, война, преступления, стража, арест, дозор улиц; не стройка и не укрепление стен", strategy: "Всегда действует решительно, даже не разобравшись в вопросе." }
      - { office: keeper, statId: knowledge, title: Хранитель, titleGen: хранителя, focus: "архив, школа, болезнь, чертёж, исследование, алхимия", strategy: "Предпочитает сбор сведений. Часто медлит и не всегда действует решительно." }
      - { office: chancellor, statId: influence, title: Канцлер, titleGen: канцлера, focus: "переговоры, гильдия, слух, дипломатия сопряжения, суд чести, указ в народе", strategy: "В основном интересуется людьми и наплевательски относится к ресурсам и собственности." }
  aspects:
    - id: overview
      title: Общий облик
      hint: "Устойчивый силуэт города и острова: чем запоминается веками, не новость недели"
    - id: history
      title: История и основание
      hint: "Основание, ключевые эпохи, старые травмы и гордости — то, что уже вошло в предание"
    - id: geography
      title: География и климат
      hint: "Рельеф, воды, почвы, край обрыва, характер сезонов — постоянные условия острова"
    - id: districts
      title: Районы и планировка
      hint: "Устоявшиеся кварталы, центр и окраины, как устроены пути по острову"
    - id: economy
      title: Хозяйство и ресурсы
      hint: "Долгая опора хозяйства НА СВОЁМ острове: чем кормятся поколениями, внутренние рынки. Вода, еда и топливо — фон в одну-две строки, если это не defining feature. Без цистерн как нормы, без регулярных гостей с чужих островов"
    - id: crafts
      title: Ремёсла, техника или магия труда
      hint: "Традиционные умения, цеха, инструменты — то, чему учат детей"
    - id: society
      title: Общество и сословия
      hint: "Устойчивые слои, семьи, отношение к чужакам — структура, не скандал месяца"
    - id: customs
      title: Обычаи и праздники
      hint: "Календарь обрядов, табу, этикет — повторяющиеся традиции"
    - id: faith
      title: Вера и культ покровителя
      hint: "Один реальный культ покровителя: храм, жречество, обряды. Не пантеон и не бытовая магия"
    - id: governance
      title: Власть и закон
      hint: "Как устроена власть и суд издавна: должности, налоги, обычай преемственности"
    - id: defense
      title: Оборона и сила
      hint: "Укрепления, стража, дозор у края — обычный способ отражать угрозы, не текущая война"
    - id: knowledge
      title: Знание и обучение
      hint: "Школы, архивы, ремёсла знания, хранимые тайны"
    - id: landmarks
      title: Места силы и достопримечательности
      hint: "3–6 постоянных мест с характером и старыми преданиями о каждом"
    - id: transport
      title: Пути и пространство острова
      hint: "Как люди ходят по острову: тропы, мосты, лестницы, подъёмники. Не повторяй географию. Нет пристаней, доков и полётов"
    - id: dailyLife
      title: Повседневность
      hint: "Типичный уклад дня разных сословий — ритм жизни, не события этой недели"
    - id: relations
      title: Внешний горизонт и сопряжения
      hint: "Как город относится к небу и чужим островам; сопряжение — редкая пора, не бытовая торговля"
    - id: threats
      title: Хронические риски
      hint: "Устойчивые уязвимости своего острова (вода, край, культы, внутренняя рознь). Проблемы с которыми население исторически сталкивается."
    - id: rumors
      title: Предания, спорные сведения и неизвестные области
      hint: "Старые слухи своего города; малоизвестная земля может быть просто неудобной. Unknown ≠ mystery. Не выдумывай чужие острова"
