      Чужую тайну не раскрывай. Оценки и мораль не ставь — только что увидели и записали.
      Можно ли закрыть проход — сказано в характере сопряжения; не выдумывай ворота, если их там нет.
      Встречу островов называй сопряжением, не «стыком».
      Стражу и войско называй с городом, если это уже сказано.

  undockContinuation:
