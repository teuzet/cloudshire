storage:
  driver: yaml # yaml | mongo
  yaml:
    dir: ./data
  mongo:
    uri: mongodb://127.0.0.1:27017
    db: cloudshire

server:
  port: 3000
  # Локально можно 127.0.0.1; на Heroku — 0.0.0.0 (или SERVER_HOST / DYNO).
  host: 0.0.0.0

# session JSONL → logs/session-*.log (на Heroku file: false → только stdout)
logging:
  level: debug
  dir: ./logs
  file: true

telegram:
  # Авто: включится, если в .env есть TELEGRAM_BOT_TOKEN.
  # Явно: TELEGRAM_ENABLED=1|0. YAML-флаг — запасной, если токена нет.
  enabled: false
  tokenEnv: TELEGRAM_BOT_TOKEN
  # Непустой список — закрытый тест: только эти telegram id.
  # Пустой — пускаем всех. Можно переопределить TELEGRAM_ALLOW_IDS=1,2,3
  allowIds:
    - 518815155 # Я
    - 147999733 # Сонька
    - 352066190 # Макс
    - 519022667 # Темыч
    - 5428987485 # GunSky
  # /forcetick — только эти id. Пустой список — никому. TELEGRAM_FORCE_TICK_IDS=1,2
  forceTickIds: [ 518815155 ]
  closedTestReply: Сейчас идёт закрытый тест. Если тебя ждали — напиши тому, кто пригласил.
  # Кнопка «/» в Telegram. Бот перезаписывает меню при старте (setMyCommands).
  commands:
    - command: city
      description: Информация о городе
  # HTTPS-адрес мини-аппки. Пусто — берётся TELEGRAM_MINI_APP_URL или https://$RAILWAY_PUBLIC_DOMAIN/mini/
  miniAppUrl: ''
  miniAppMenu: Город

tick:
  # 1 реальные сутки = 1 игровой год → тик = 1 игровой месяц.
  # Границы по часам сервера: 00:00 дня старта/wipe = год 1 месяц 1, 02:00 = год 1 месяц 2.
  intervalHours: 2
  enabled: true
  chronicleEvents:
    min: 2
    max: 4
  # Запись хроники — сухой факт в 1–2 фразы. Ориентир для промпта резолверов.
  chronicleEntryMaxChars: 260
  # После процессов — ориентир побочных событий месяца (не раздувать хронику).
  sideEventsMax: 2
  # Ориентир для резолвера: обычные месячные сдвиги мелкие.
  # Жёсткого потолка нет — катастрофа может обвалить стат почти до нуля за одну запись.
  typicalStatDelta: 5
  # Сколько длительных дел может идти параллельно (5-е и далее declare_process отклоняет программно).
  maxActiveProcesses: 4
  # Conflux: матчмейкинг и геометрия сопряжения — только код (не LLM).
  # Approaching считается соло для доли времени; docked — конфлюкс.
  conflux:
    enabled: true
    targetDockedFraction: 0.5
    minDomainAgeMonths: 6
    preferNeverMet: true
    rematchChronicle: true
    maxNewPairsPerTick: 2
    etaMonths:
      min: 6
      max: 12
    # Фаза docked — отдельно, сверх сближения.
    durationMonths:
      min: 2
      max: 4
    # Ширина прохода: ГСЧ выбирает kind, LLM только описывает.
    # 10% узкий (мостик / щель / ущелье), 10% обозный разъезд,
    # 60% широкий (рота–армия), 20% берег в берег.
    contactWeights:
      bridge: 4
      gap_jump: 3
      gorge: 3
      wagon_pass: 10
      causeway: 60
      landmass: 20
  # Сюжетные нити — ядро мира (docs/PIVOT_PLOTLINES.md).
  # События вне нитей не бывает: дело, указ, находка — всё это биты.
  plot:
    enabled: true
    board:
      # Сколько нитей висит одновременно; errand — проходные нити дел.
      maxOpen: 5
      maxErrands: 2
      # Суммарная важность живых историй, при которой доска считается полной.
      # Три мелких (по 25) ещё не заполняют; одна громкая и одна средняя — уже да.
      # Число историй само по себе посев не глушит. Дела в сумму не входят.
      # Пустая доска — завязка обязательна.
      targetImportance: 100
      seedMaxChance: 0.5
      # Пауза после свежей завязки, только если вес уже набран.
      # Пока сумма важности ниже цели, пауза не действует.
      seedCooldownMonths: 2
      # Закрылась история с крючком, живых историй не осталось — шанс сразу посеять продолжение.
      sequelChance: 0.55
    beats:
      # Процессы всегда занимают слоты (могут забить весь потолок).
      # Случайные тики историй и указов — только в остаток. Сход слот не занимает.
      maxPerTick: 3
      baseChance: 0.15
      temperatureWeight: 0.5
      importanceWeight: 0.2
      agePressure: 0.15
      minChance: 0.05
      maxChance: 0.8
    orders:
      # Шанс тика указа, если агент порядка не задал свой.
      defaultChance: 0.2
    acts:
      # Третья эскалация закрывает историю провалом. Gravity не трогаем.
      # Urgency сдвигается примерно на 10%.
      maxEscalations: 3
      worsenMin: 1.1
      worsenMax: 1.1
      dampMin: 0.9
      dampMax: 0.9
    temperature:
      initial: 30
      decayPerTick: 8
      # Прирост за внимание игрока: touchedPlotIds правителя.
      perTouch: 12
      afterBeat: 20
      # Просроченная нить без дел гаснет, только если интерес остыл ниже этого.
      fadeBelow: 18
    roll:
      # Сжатая шкала окраски бита: слабость чувствуется, но не приговаривает.
      minChance: 0.25
      maxChance: 0.75
      # Перевес главного стата нити при выборе, по чему кидать.
      primaryWeight: 2
      # Полоса «двойственного» исхода вокруг порога.
      dualBand: 0.2
      # Исход дела: якоря стат → доля провала при обычном темпе.
      # 40 ≈ 45%, 60–70 ≈ 10–15%, 90+ провала нет.
      finishCritShare: 0.25
      finishFailCurve:
        - { stat: 0, fail: 0.85 }
        - { stat: 40, fail: 0.45 }
        - { stat: 60, fail: 0.15 }
        - { stat: 70, fail: 0.10 }
        - { stat: 90, fail: 0 }
    stats:
      # Раздельные месячные бюджеты: решения игрока и события мира.
      playerBudget: 6
      worldBudget: 8
      importanceScale: 0.08
      finaleFactor: 2
      catastropheCooldown: 6
    log:
      # Ворота журнала месяца: с какой вероятностью бит вообще увидит,
      # что игрок делал в разговорах. Регулируется числом, не формулировкой.
      influenceChance: 0.35
    quiet:
      # Тихий месяц не пустой: у города своя погода даже без сюжета.
      # Как часто у тихого месяца есть след в статах.
      driftChance: 0.65
      # Доля дрифтов покрупнее (±2 вместо ±1).
      notableChance: 0.25
      # Тяга к середине: просевшее чаще выправляется, раздутое чаще садится.
      meanReversion: 0.7
      # Насколько охотнее месяц вспоминает про крайние статы.
      extremeBias: 1
      # Сколько последних тихих месяцев помним, чтобы не повторять тему и форму.
      avoidRepeat: 4
    tagGroups:
      # Тон, причинная сила, ситуация, динамика. Сферу и масштаб не сеем — статы выбирает стартер, масштаб несёт gravity.
      - id: tone
        name: Тон
        tags:
          - { id: social, name: Социальный, weight: 8 }
          - { id: political, name: Политический, weight: 8 }
          - { id: adventure, name: Приключенческий, weight: 10 }
          - { id: exploration, name: Исследовательский, weight: 12 }
          - { id: mystical, name: Мистический, weight: 10 }
          - { id: uncanny, name: Жуткие странности, weight: 12 }
          - { id: horror, name: Ужас, weight: 7 }
          - { id: religious, name: Религиозный, weight: 9 }
          - { id: natural, name: Природный, weight: 10 }
          - { id: disaster, name: Катастрофический, weight: 8 }
          - { id: wonder, name: Чудо, weight: 10 }
          - { id: external_threat, name: Внешняя угроза, weight: 8 }
          - { id: economic, name: Экономический, weight: 6 }
          - { id: technological, name: Технологический, weight: 7 }
      - id: source
        name: Источник
        tags:
          - { id: environment, name: Среда и природа, weight: 15 }
          - { id: creature, name: Существо, weight: 10 }
          - { id: unknown, name: Неизвестное, weight: 15 }
          - { id: external, name: Внешняя сила, weight: 8 }
          - { id: religious, name: Религиозная сила, weight: 10 }
          - { id: archaeological, name: Археологическое/древнее, weight: 10 }
          - { id: technological, name: Технологическое, weight: 7 }
          - { id: social, name: Социальная сила, weight: 10 }
          - { id: political, name: Политическая сила, weight: 8 }
          - { id: economic, name: Экономическая сила, weight: 7 }
      - id: situation
        name: Ситуация
        tags:
          - { id: threat, name: Угроза, weight: 30 }
          - { id: opportunity, name: Возможность, weight: 25 }
          - { id: dilemma, name: Дилемма, weight: 25 }
          - { id: transition, name: Переход, weight: 20 }
      - id: dynamic
        name: Динамика
        tags:
          - { id: depletion, name: Истощение, weight: 8 }
          - { id: accumulation, name: Накопление, weight: 8 }
          - { id: spread, name: Распространение, weight: 10 }
          - { id: polarization, name: Поляризация, weight: 8 }
          - { id: deadline, name: Срок, weight: 10 }
          - { id: feedback, name: Обратная связь, weight: 6 }
          - { id: lock_in, name: Замыкание пути, weight: 7 }
          - { id: cascade, name: Каскад, weight: 8 }
          - { id: competition, name: Соревнование, weight: 7 }
          - { id: drift, name: Дрейф, weight: 8 }
          - { id: deepening, name: Углубление, weight: 12 }
    suspense:
      gravityFloor: 20
      openingGravityMin: 20
      openingGravityMax: 40
      depth4Chance: 0.03
      depth4MinGravity: 75
      legacyMinGravity: 25
      judgeAttempts: 3
      annotation:
        gravityMin: 0
        gravityMax: 100
        secondaryToneChance: 0
        judgeAttempts: 2
        recentWindow: 5
        poolMin: 60
        refillBatch: 3
        shortlistSize: 10
        modifierGravityMin: 40
    # Тайна: причинный граф, жёсткий тип, мягкая окраска ассоциативным полем.
    mystery:
      graph:
        minNodes: 4
        maxNodes: 5
        # Пока только linear_4. linear_side вернём после стабильного baseline.
        sideRevealChance: 0.5
        judgeAttempts: 3
        generateTries: 6
        presentationTries: 3
        shapes:
          - { id: linear_4, weight: 1 }
          - { id: linear_5, weight: 0 }
          - { id: linear_side, weight: 0 }
      # Каталог сущностей города: агент cityEntities после генезиса. Модели-тайне не отдаём —
      # система кладёт 1 якорь, совсем изредка 2 (иногда слот «изобрети новое»).
      entities:
        minCatalog: 32
        maxCatalog: 48
        pickMin: 1
        pickMax: 2
        twoChance: 0.12
        inventChance: 0.15
      # Phase 1: абстрактный skeleton без города. Оси можно потом отключать по одной.
      architect:
        judgeAttempts: 3
        gravityMin: 15
        gravityMax: 90
        # Веса source после броска типа. 0 исключает ось. Нет ключа — равный вес.
        sourceByType:
          crime: { social: 8, political: 5, economic: 5, religious: 3, technological: 3, unknown: 3, external: 3, archaeological: 2, environment: 1, creature: 1 }
          conspiracy: { social: 8, political: 8, economic: 4, religious: 4, external: 4, unknown: 3, technological: 3, archaeological: 2, environment: 1, creature: 1 }
          betrayal: { social: 8, political: 5, economic: 4, religious: 3, unknown: 3, external: 2, technological: 2, archaeological: 2, environment: 1, creature: 1 }
          sabotage: { social: 8, political: 4, economic: 5, technological: 5, religious: 2, unknown: 3, external: 3, archaeological: 2, environment: 1, creature: 1 }
          kidnapping: { social: 8, political: 5, economic: 4, unknown: 4, external: 3, religious: 2, technological: 2, archaeological: 1, environment: 1, creature: 1 }
          blackmail: { social: 8, political: 6, economic: 6, unknown: 3, religious: 3, external: 2, technological: 2, archaeological: 1, environment: 1, creature: 1 }
          impostor: { social: 8, political: 6, religious: 3, economic: 3, unknown: 3, external: 2, technological: 2, archaeological: 2, environment: 1, creature: 1 }
          poisoning: { social: 8, environment: 5, creature: 5, technological: 5, unknown: 4, archaeological: 4, economic: 3, external: 3, religious: 2, political: 2 }
          loss: { social: 8, economic: 7, environment: 4, creature: 4, external: 4, unknown: 4, technological: 3, archaeological: 3, political: 3, religious: 2 }
          disappearance: { social: 7, unknown: 6, creature: 5, political: 4, environment: 4, external: 4, religious: 3, archaeological: 3, economic: 3, technological: 2 }
          cult: { religious: 8, social: 6, political: 5, unknown: 4, archaeological: 3, external: 3, economic: 2, technological: 2, environment: 1, creature: 1 }
          forbidden: { religious: 6, political: 6, archaeological: 6, unknown: 5, social: 4, external: 3, technological: 3, economic: 2, environment: 1, creature: 1 }
          artifact: { archaeological: 8, technological: 6, unknown: 5, religious: 4, social: 3, external: 3, environment: 3, economic: 2, political: 2, creature: 2 }
          locus: { archaeological: 7, unknown: 6, environment: 5, religious: 4, external: 3, technological: 3, social: 3, creature: 3, political: 2, economic: 2 }
          false_miracle: { religious: 8, social: 6, technological: 5, unknown: 5, political: 3, external: 3, archaeological: 3, economic: 2, environment: 2, creature: 1 }
        tagGroups:
          - id: scale
            name: Масштаб
            tags:
              - { id: local, name: LOCAL, about: "человек, дом, мастерская, небольшое место", weight: 4 }
              - { id: civic, name: CIVIC, about: "значимая часть города, институт, отрасль", weight: 3 }
              - { id: islandwide, name: ISLANDWIDE, about: "весь остров или большая система", weight: 2 }
              - { id: mythic, name: MYTHIC, about: "фундаментальная аномалия, древняя сила, экзистенциальное явление", weight: 1 }
          - id: source
            name: Источник
            tags:
              - { id: social, name: SOCIAL, about: действия людей или групп }
              - { id: political, name: POLITICAL, about: власть, статус, контроль, борьба влияний }
              - { id: economic, name: ECONOMIC, about: выгода, ресурс, снабжение, долги }
              - { id: environment, name: ENVIRONMENT, about: погода, геология, климат, природный процесс }
              - { id: creature, name: CREATURE, about: животное, неизвестный вид, миграция }
              - { id: religious, name: RELIGIOUS, about: культ, вера, ритуал, сакральный объект }
              - { id: technological, name: TECHNOLOGICAL, about: механизм, ремесленный процесс, эксперимент }
              - { id: archaeological, name: ARCHAEOLOGICAL, about: древний объект, старая конструкция, забытое место }
              - { id: unknown, name: UNKNOWN, about: источник на старте трудно классифицировать }
              - { id: external, name: EXTERNAL, about: причина пришла извне города или острова }
          - id: entry
            name: Вход
            tags:
              - { id: people, name: PEOPLE, about: странное поведение, исчезновение, свидетельства }
              - { id: city, name: CITY, about: проявление внутри повседневной городской среды }
              - { id: outskirts, name: OUTSKIRTS, about: поля, дороги, внешние постройки }
              - { id: depths, name: DEPTHS, about: пещеры, шахты, глубокие полости }
              - { id: edge, name: EDGE, about: край острова, обрыв, нестабильная кромка }
              - { id: sky, name: SKY, about: погода, свет, осадки, летающие существа }
              - { id: wilds, name: WILDS, about: лес, дикая территория }
              - { id: past, name: PAST, about: старый предмет, руины, запись, наследие }
              - { id: body, name: BODY, about: болезнь, симптом, изменение организма }
              - { id: material, name: MATERIAL, about: необычное вещество, предмет, образец }
          - id: tone
            name: Тон
            tags:
              - { id: social, name: social }
              - { id: political, name: political }
              - { id: investigative, name: investigative }
              - { id: exploration, name: exploration }
              - { id: adventure, name: adventure }
              - { id: mystical, name: mystical }
              - { id: uncanny, name: uncanny }
              - { id: horror, name: horror }
              - { id: religious, name: religious }
              - { id: wonder, name: wonder }
              - { id: disaster, name: disaster }
              - { id: tragic, name: tragic }
              - { id: conspiracy, name: conspiracy }
          - id: situation
            name: Ситуация
            tags:
              - { id: harm, name: HARM, about: уже произошёл ущерб, причина неизвестна }
              - { id: anomaly, name: ANOMALY, about: наблюдается необычный повторяющийся эффект }
              - { id: discovery, name: DISCOVERY, about: найден объект, место, след или структура }
              - { id: disappearance, name: DISAPPEARANCE, about: исчез человек, предмет, ресурс или ожидаемый результат }
              - { id: contradiction, name: CONTRADICTION, about: несколько наблюдений не складываются }
              - { id: threat, name: THREAT, about: признаки продолжающейся скрытой причины }
              - { id: opportunity, name: OPPORTUNITY, about: найдено нечто ценное с неизвестной природой }
          - id: dynamic
            name: Динамика
            tags:
              - { id: static, name: STATIC, about: следы есть, но причина сама почти не нарастает }
              - { id: accumulation, name: ACCUMULATION, about: скрытая причина копит эффект }
              - { id: spread, name: SPREAD, about: затрагивает всё больше мест или людей }
              - { id: repetition, name: REPETITION, about: одно и то же проявляется снова }
              - { id: depletion, name: DEPLETION, about: что-то необходимое убывает }
              - { id: escalation, name: ESCALATION, about: каждый новый след тяжелее прежнего }
              - { id: drift, name: DRIFT, about: причина медленно смещает норму }
              - { id: cascade, name: CASCADE, about: одно следствие запускает следующее }
              - { id: deadline, name: DEADLINE, about: есть ощутимый срок, после которого будет поздно }
          - id: canonRelation
            name: Отношение к канону
            tags:
              - { id: native, name: NATIVE, about: легко воплощается через существующие городские системы }
              - { id: contact, name: CONTACT, about: в город входит новое явление, не часть status quo }
              - { id: legacy, name: LEGACY, about: скрытая причина связана с прошлым, старым объектом или давним событием }
      # V5.1 brief: causal arena + gravity-scaled outcomes.
      # Один посев: генерация, при FAIL судьи — одна доработка того же brief, без нового жребия.
      # situation / scale / association / второй тон не бросаем.
      # OLD_EVENT и EXTERNAL_INTRUSION убраны: это LEGACY и CONTACT.
      # Классификация (вопрос/маска/домен) — после. cooldown — для доски города, не для лабораторного семпла.
      annotation:
        gravityMin: 0
        gravityMax: 100
        secondaryToneChance: 0
        judgeAttempts: 2
        recentWindow: 5
        poolMin: 60
        refillBatch: 3
        shortlistSize: 10
        modifierGravityMin: 40
        cooldown:
          previousMultiplier: 0.2
          frequentWindow: 4
          frequentMinCount: 2
          frequentMultiplier: 0.4
          absentWindow: 5
          absentMultiplier: 1.3
        incompatible:
          truthArena:
            human:
              truthNature: [natural_process, creature_behavior, hidden_structure, anomalous_phenomenon]
            creature:
              truthNature: [human_action, collective_human_process, intentional_deception, hidden_structure, accident_chain]
            ecology:
              truthNature: [human_action, collective_human_process, intentional_deception, hidden_structure, accident_chain, creature_behavior]
            material:
              truthNature: [creature_behavior, collective_human_process, intentional_deception, hidden_structure, human_action]
            built:
              truthNature: [creature_behavior, intentional_deception, collective_human_process, human_action]
            earth:
              truthNature: [human_action, collective_human_process, intentional_deception, accident_chain, creature_behavior]
            sky:
              truthNature: [hidden_structure, human_action, collective_human_process, intentional_deception, accident_chain, creature_behavior]
        tagGroups:
          # Жёсткий посев генератора. Арена — causal substrate Y, не место X и не provenance.
          - id: truthArena
            name: Арена истины
            tags:
              - { id: human, name: HUMAN, about: "причина в действиях, решениях, ошибках, знаниях, скрытом или коллективном поведении людей", weight: 10 }
              - { id: creature, name: CREATURE, about: "причина — конкретное животное или существо: свойства, поведение, жизненный цикл, охота, перемещение", weight: 10 }
              - { id: ecology, name: ECOLOGY, about: "причина — экологический или популяционный процесс: растения, грибы, паразиты, распространение вида, смена экосистемы", weight: 10 }
