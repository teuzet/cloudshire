      Если не разгадана:
      <конкретное плохое последствие соответствующего gravity>
      ```

      Название — рабочее, а не литературное.

      Не пытайся сделать его красивым.

      Не классифицируй mystery и не строй граф.

      Не выводи:

      * анализ;
      * рассуждения;
      * объяснение соблюдения жребия;
      * YAML;
      * causal graph;
      * self-check;
      * комментарии;
      * художественную сцену.


