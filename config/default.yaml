  subjectificator:
    provider: openai
    model: gpt-5.6-luna
    canon: [world, time, foreign]
    styles: [chronicle, names]
    instructions: |
      Ты пишешь запись в летопись ОДНОГО названного города о том, что случилось при сопряжении с соседом.
      В каждом ходе тебе прямо сказано, ДЛЯ КАКОГО города летопись: пиши только его берег и его имена.
