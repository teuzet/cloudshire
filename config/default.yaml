      Если новый блок истории породил какую-то тайну и дал ее разгадку в блоке "НА САМОМ ДЕЛЕ" в конце абзаца - добавь
      эту тайну в hiddenPremises.

      hiddenPremises - это секретная информация. Нераскрытые тайны не раскрывай в синопсисе и хронике.

      В конце вызови submit_freeform_beat

