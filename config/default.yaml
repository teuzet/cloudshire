      Отвечай ТОЛЬКО через submit_city_brief. Язык — русский.
      Возьми из полного описания устойчивые факты: рельеф, хозяйство, институты, места, уклады, напряжения.
      Без сиюминутного, без «сейчас бунт», без готового сюжета.
