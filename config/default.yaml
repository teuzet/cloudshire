      Дело не придумывай. Событие не пересказывай. Верни submit_proxy.
      act=true только если постоянный текст прямо касается случившегося.

  subjectificator:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    styles: [chronicle]
    instructions: |
      Есть два города на летающих островах, края сошлись, между ними проход.
      Это явление называется "сопряжение".

      Пиши запись в летопись ОДНОГО названного города о том, что случилось, пока острова вместе.
      В каждом ходе тебе прямо сказано, ДЛЯ КАКОГО города летопись: пиши только его берег и его имена.
      Соседа не делай «нами». Если в случившемся напал город А, а город Б принял удар — так и оставь:
      не пиши, что Б ходил на А. «Атака Керсая» — это удар Керсая, не удар по Керсаю.
      Тебе дают, что произошло, и то, что этому городу уже известно о другом.
      Пиши так, как могли зафиксировать ЗДЕСЬ: со своего берега, своими именами, со своими пробелами.
      Не рассказывай то, чего этот город не мог видеть и не мог уже знать.
      Не выдумывай деталей, которых нет ни в случившемся, ни в известных этому городу сведениях.
      Если город знает мало — опиши только то, что видно с этого острова: проход, шум, чужие люди у края.
      Чужую тайну не раскрывай. Оценки и мораль не ставь — только что увидели и записали.
      И источник, и архив пары писали у соседа, там своих людей знают по именам и по нуждам.
      Здесь — нет. Имя, должность и звание человека из соседнего города в запись не переноси
      ниоткуда, как бы прямо они там ни стояли: кто вёл чужих людей, с этого берега не видно —
      видно самих людей. Своих горожан называй как обычно.
      ЧУЖОЙ ЗАМЫСЕЛ ОТСЮДА ТОЖЕ НЕ ВИДЕН. Что у нас взяли, сломали, принесли, где прошли —
      видно и записывается. Зачем это было соседу, чего ему не хватало, на что он рассчитывал
      и чем это для него важно — не видно, даже если в источнике сказано прямо.
      «Взяли нужное им зерно», «пришли за тем, чего им недоставало», «хотели припугнуть» —
      это чужая нужда, выданная за нашу запись. Пиши: взяли зерно.
      Догадка города допустима, но прямо как догадка и от своих причин, не от соседских.
      Можно ли закрыть проход — сказано в характере сопряжения; не выдумывай ворота, если их там нет.
      Встречу островов называй сопряжением, но помни: сопряжение — событие и пора, а не место.
      Ходят по проходу и на ту сторону, а не «через сопряжение».
      Города сходятся редко, и такое здесь помнят долго: пиши развёрнуто, не сводкой.
      Но развёрнуто — про случившееся и про своих людей, а не про сам проход: где он идёт,
      из чего он и как по нему ходят, здесь уже знают и уже записали. Заново его не описывай.
      Стражу и войско называй с городом, если это уже сказано.
      Если в источнике назван человек с полом — согласуй род. Пол в скобках в текст не копируй.
      Календарную дату в текст не пиши и не копируй из источника.
      Это живая запись берега, не перевод сводки в одно предложение.

  confluxForecast:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Сейчас их края сошлись, между ними есть проход.
      Острова снова разойдутся — это неизбежно. Тебе дают, что уже случилось, пока они вместе.
      Вопрос: если края разойдутся ПРЯМО СЕЙЧАС, что из уже случившегося останется фактом
      для каждого города.

      Для каждого города — свой короткий текст с его берега. Тексты могут совпадать или нет;
      не выворачивай одно случившееся в «беду одному, удачу другому», если этого нет в данном.
      Отдельно — короткая нейтральная сводка без суда, кто прав.

      Новых событий не выдумывай: сжимай только то, что уже дано.
      Если пока ничего не случилось — так и скажи, не досочиняй.
      Пометки «уже отошло» — старый фон, не сегодняшняя новость: учитывай, не пересказывай как новое.
      Ответь вызовом submit_forecast.

  confluxLeak:
    provider: openai
    model: gpt-4o-mini
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Сейчас их края сошлись, между ними есть проход.
      Тебе дают одно событие, связанное с первым городом.
      Ответь: затрагивает ли ЭТО СОБЫТИЕ второй город напрямую.

      Смотри только текст события. Историю вокруг не подмешивай.
      Напрямую: случившееся реально коснулось второго города, людей на проходе
      между островами или берега второго острова.
      Намёка, сходства темы и «могло бы» недостаточно.
      Если всё осталось внутри первого города — не затрагивает.

      Не придумывай пересечений, которых нет в тексте события.
      Ответь вызовом submit_leak: both=true если затрагивает напрямую, both=false если нет.

  undockPassage:
    provider: openai
    model: gpt-4o-mini
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Их края стояли вместе, между ними был проход.
      Сейчас острова расходятся, проход пропадает: ходить к другому городу больше нельзя.
      Тебе дают список работ, которые ещё идут в одном из городов.
      Отметь те, которые имеют смысл только пока проход жив.

      Нужен проход, если сама работа — переход людей, посольство, удар по другому городу,
      встреча или оборона именно у прохода, ждать гостей с того берега, идти туда.
      Если другой город в тексте работы не назван — отмечай только когда без прохода
      этой работе явно нечего делать.

      Не нужен проход, если работа целиком на своём острове. Соседство островов само
      по себе работу не делает парной.

      Верни id таких работ в processIds. Если ни одной — пустой список.

  undockChronicle:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    styles: []
    instructions: |
      Есть два города на летающих островах. Их края стояли вместе, между ними был проход,
      люди могли ходить из города в город. Сейчас острова расходятся в небе.
      Проход пропадает. Между городами снова нет пути.

      Ты пишешь ОДНУ запись об этом моменте — общую, не от лица одного города.
      Это уже случилось: не прогноз, не письмо, не мораль.

      Тебе дают, что уже было сказано как остаток «если острова разойдутся сейчас»
      (каждому городу со своего берега и общая сухая сводка) — это теперь факт:
      впиши как случившееся, не как будущее.
      И работы, которые оборвались, потому что ходить больше нельзя, и какая судьба
      людей на них: вплети в ту же запись событиями, не списком поручений.

      3–6 предложений. Оба имени городов — обязательно.
      Главное: два летающих острова разошлись в небе, пути нет.
      Не своди к тому, что обвалился мост или рухнула перемычка: переход кончается
      потому, что острова ушли, а не потому, что сломалась дорога.
      Новых войн, людей, островов и событий сверх данного не выдумывай.
      Не суди, кто прав. Не называй случившееся «делом», «поручением» или «историей».
      Не закрывай всё нравоучением: в случившемся должен остаться след,
      из которого жизнь городов может расти дальше.

      Верни submit_undock.

  undockContinuation:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Проход между ними только что исчез: острова разошлись.
      Тебе дают одну уже идущую историю. Может ли она продолжаться в ОДНОМ названном городе без соседа?

      keep=true только если причина живёт здесь сама: место, люди, вещь, обряд этого острова.
      keep=false если история держалась на соседе, на проходе, на вещи, которую унёс другой город.
      Хозяин истории не получает «да» автоматически. Если сомневаешься — keep=false.
      Новых событий не выдумывай. Верни submit_continuation.

  confluxCrystal:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Края сошлись, проход есть, общей истории ещё нет.
      По тому, что уже случилось у прохода, сложи краткую историю, которая теперь висит над обоими.
      Не бойся решительно менять расстановку сил.
      Верни submit_crystal: краткий синопсис, тяжесть CRISIS или RUPTURE и две-три помехи.
      Летопись не пиши. Концовок у сопряжения нет и придумывать их не надо:
      оно кончается, когда острова расходятся, а чем кончилось — сложится из случившегося.

      СИНОПСИС — про то, что уже случилось и чем это грозит, а не про придуманный спор.
      Если города ещё ничего друг другу не сделали, так и пиши: проход открыт, дальше решат люди.
      Не выдумывай требований, переговоров и сторон, которых в поданном нет.
      Номер дня в синопсис не пиши: счёт дней — движковый, в мире его не знают.

      ПОМЕХА — конкретное событие, которое случится само, если ни один город не вмешается.
      Свойство прохода помехой не является: «проход нельзя перекрыть», «нового сопряжения
      не будет», «обязательства должны выдержать срок» — это устройство мира, а не беда.
      Беда — это «на осыпи под обозом уйдёт кладка» или «у весов на проходе сойдутся две стражи».

  passageScribe:
    provider: openai
    model: gpt-5.6-luna
    canon: [world]
    instructions: |
      Есть два города на летающих островах. Края сошлись, между ними проход.
      Опиши проход как место: один абзац, без сюжета и без поручений.
      Не советуй запирать или перегораживать проход.
      Верни submit_passage с полем text.

