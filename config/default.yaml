storage:
  driver: yaml # yaml | mongo
  yaml:
    dir: ./data
  mongo:
    uri: mongodb://127.0.0.1:27017
    db: cloudshire

server:
  port: 3000
  # Локально можно 127.0.0.1; на Heroku — 0.0.0.0 (или SERVER_HOST / DYNO).
  host: 0.0.0.0

# session JSONL → logs/session-*.log (на Heroku file: false → только stdout)
logging:
  level: debug
  dir: ./logs
  file: true

telegram:
  # Авто: включится, если в .env есть TELEGRAM_BOT_TOKEN.
  # Явно: TELEGRAM_ENABLED=1|0. YAML-флаг — запасной, если токена нет.
  enabled: false
  tokenEnv: TELEGRAM_BOT_TOKEN
  # Непустой список — закрытый тест: только эти telegram id.
  # Пустой — пускаем всех. Можно переопределить TELEGRAM_ALLOW_IDS=1,2,3
  allowIds:
    - 518815155 # Я
    - 147999733 # Сонька
    - 352066190 # Макс
    - 519022667 # Темыч
    - 5428987485 # GunSky
  # /forcetick — только эти id. Пустой список — никому. TELEGRAM_FORCE_TICK_IDS=1,2
  forceTickIds: [ 518815155 ]
  closedTestReply: Сейчас идёт закрытый тест. Если тебя ждали — напиши тому, кто пригласил.
  # Кнопка «/» в Telegram. Бот перезаписывает меню при старте (setMyCommands).
  commands:
    - command: city
      description: Информация о городе
  # HTTPS-адрес мини-аппки. Пусто — берётся TELEGRAM_MINI_APP_URL или https://$RAILWAY_PUBLIC_DOMAIN/mini/
  miniAppUrl: ''
  miniAppMenu: Город

tick:
  # 1 реальные сутки = 1 игровой год → тик = 1 игровой месяц.
  # Границы по часам сервера: 00:00 дня старта/wipe = год 1 месяц 1, 02:00 = год 1 месяц 2.
  intervalHours: 2
  enabled: true
  # Запись хроники — сухой факт в 1–2 фразы.
  chronicleEntryMaxChars: 260
  officerStatPerMonth: 1
  # Fallback, если у домена нет столпов. Иначе слот дела = свободный столп.
  maxActiveProcesses: 4
  # Conflux: матчмейкинг и геометрия сопряжения — только код (не LLM).
  # Approaching считается соло для доли времени; docked — конфлюкс.
  conflux:
    enabled: true
    targetDockedFraction: 0.5
    minDomainAgeMonths: 6
    preferNeverMet: true
    maxNewPairsPerTick: 2
    etaMonths:
      min: 6
      max: 12
    # Фаза docked — отдельно, сверх сближения.
    durationMonths:
      min: 2
      max: 4
    # Ширина прохода: ГСЧ выбирает kind, LLM только описывает.
    # 10% узкий (мостик / щель / ущелье), 10% обозный разъезд,
    # 60% широкий (рота–армия), 20% берег в берег.
    contactWeights:
      bridge: 4
      gap_jump: 3
      gorge: 3
      wagon_pass: 10
      causeway: 60
      landmass: 20
  # Сюжетные нити — ядро мира (docs/PLOTS.md).
  # События вне нитей не бывает: дело, указ, находка — всё это биты.
  plot:
    enabled: true
    board:
      # Сколько нитей висит одновременно; errand слот доски не занимает.
      maxOpen: 5
      # Суммарная важность живых историй, при которой доска считается полной.
      # Три мелких (по 25) ещё не заполняют; одна громкая и одна средняя — уже да.
      # Число историй само по себе посев не глушит. Дела в сумму не входят.
      # Пустая доска — завязка обязательна.
      targetImportance: 100
      seedMaxChance: 0.5
      # Пауза после свежей завязки, только если вес уже набран.
      # Пока сумма важности ниже цели, пауза не действует.
      seedCooldownMonths: 2
      # Закрылась история с крючком, живых историй не осталось — шанс сразу посеять продолжение.
      sequelChance: 0.55
    beats:
      # Процессы всегда занимают слоты (могут забить весь потолок).
      # Случайные тики историй и указов — только в остаток. Сход слот не занимает.
      maxPerTick: 3
      baseChance: 0.15
      temperatureWeight: 0.5
      importanceWeight: 0.2
      agePressure: 0.15
      minChance: 0.05
      maxChance: 0.8
    orders:
      # Шанс тика указа, если агент порядка не задал свой.
      defaultChance: 0.2
    acts:
      # Третья эскалация закрывает историю провалом. Gravity не трогаем.
      # Urgency сдвигается примерно на 10%.
      maxEscalations: 3
      worsenMin: 1.1
      worsenMax: 1.1
      dampMin: 0.9
      dampMax: 0.9
    temperature:
      initial: 30
      decayPerTick: 8
      # Прирост за внимание игрока: touchedPlotIds правителя.
      perTouch: 12
      afterBeat: 20
      # Просроченная нить без дел гаснет, только если интерес остыл ниже этого.
      fadeBelow: 18
    roll:
      # Сжатая шкала окраски бита: слабость чувствуется, но не приговаривает.
      minChance: 0.25
      maxChance: 0.75
      # Перевес главного стата нити при выборе, по чему кидать.
      primaryWeight: 2
      # Полоса «двойственного» исхода вокруг порога.
      dualBand: 0.2
      # Исход дела: якоря стат → доля провала при обычном темпе.
      # 40 ≈ 45%, 60–70 ≈ 10–15%, 90+ провала нет.
      finishCritShare: 0.25
      finishFailCurve:
        - { stat: 0, fail: 0.85 }
        - { stat: 40, fail: 0.45 }
        - { stat: 60, fail: 0.15 }
        - { stat: 70, fail: 0.10 }
        - { stat: 90, fail: 0 }
    stats:
      gravityDivisor: 5
      openingShare: 0.25
      beatShare: 0.25
      catastropheCooldown: 6
    log:
      # Ворота журнала месяца: с какой вероятностью бит вообще увидит,
      # что игрок делал в разговорах. Регулируется числом, не формулировкой.
      influenceChance: 0.35
    quiet:
      # Тихий месяц остаётся как тема хроники, статы не двигает.
      # Сколько последних тихих месяцев помним, чтобы не повторять тему и форму.
      avoidRepeat: 4
    tagGroups:
      # Тон, причинная сила, ситуация, динамика. Сферу и масштаб не сеем — статы выбирает стартер, масштаб несёт gravity.
      - id: tone
        name: Тон
        tags:
          - { id: social, name: Социальный, weight: 8 }
          - { id: political, name: Политический, weight: 8 }
          - { id: adventure, name: Приключенческий, weight: 10 }
          - { id: exploration, name: Исследовательский, weight: 12 }
          - { id: mystical, name: Мистический, weight: 10 }
          - { id: uncanny, name: Жуткие странности, weight: 12 }
          - { id: horror, name: Ужас, weight: 7 }
          - { id: religious, name: Религиозный, weight: 9 }
          - { id: natural, name: Природный, weight: 10 }
          - { id: disaster, name: Катастрофический, weight: 8 }
          - { id: wonder, name: Чудо, weight: 10 }
          - { id: external_threat, name: Внешняя угроза, weight: 8 }
          - { id: economic, name: Экономический, weight: 6 }
          - { id: technological, name: Технологический, weight: 7 }
      - id: source
        name: Источник
        tags:
          - { id: environment, name: Среда и природа, weight: 15 }
          - { id: creature, name: Существо, weight: 10 }
          - { id: unknown, name: Неизвестное, weight: 15 }
          - { id: external, name: Внешняя сила, weight: 8 }
          - { id: religious, name: Религиозная сила, weight: 10 }
          - { id: archaeological, name: Археологическое/древнее, weight: 10 }
          - { id: technological, name: Технологическое, weight: 7 }
          - { id: social, name: Социальная сила, weight: 10 }
          - { id: political, name: Политическая сила, weight: 8 }
          - { id: economic, name: Экономическая сила, weight: 7 }
      - id: situation
        name: Ситуация
        tags:
          - { id: threat, name: Угроза, weight: 30 }
          - { id: opportunity, name: Возможность, weight: 25 }
          - { id: dilemma, name: Дилемма, weight: 25 }
          - { id: transition, name: Переход, weight: 20 }
      - id: dynamic
        name: Динамика
        tags:
          - { id: depletion, name: Истощение, weight: 8 }
          - { id: accumulation, name: Накопление, weight: 8 }
          - { id: spread, name: Распространение, weight: 10 }
          - { id: polarization, name: Поляризация, weight: 8 }
          - { id: deadline, name: Срок, weight: 10 }
          - { id: feedback, name: Обратная связь, weight: 6 }
          - { id: lock_in, name: Замыкание пути, weight: 7 }
          - { id: cascade, name: Каскад, weight: 8 }
          - { id: competition, name: Соревнование, weight: 7 }
          - { id: drift, name: Дрейф, weight: 8 }
          - { id: deepening, name: Углубление, weight: 12 }
    suspense:
      gravityFloor: 20
      openingGravityMin: 20
      openingGravityMax: 40
      depth4Chance: 0.03
      depth4MinGravity: 75
      legacyMinGravity: 25
      judgeAttempts: 3
      annotation:
        gravityMin: 0
        gravityMax: 100
        secondaryToneChance: 0
        judgeAttempts: 2
        recentWindow: 5
        poolMin: 10
        refillBatch: 3
        shortlistSize: 10
        modifierGravityMin: 40
    # Тайна: причинный граф, жёсткий тип, мягкая окраска ассоциативным полем.
    mystery:
      graph:
        minNodes: 4
        maxNodes: 5
        # Пока только linear_4. linear_side вернём после стабильного baseline.
        sideRevealChance: 0.5
        judgeAttempts: 3
        generateTries: 6
        presentationTries: 3
        shapes:
          - { id: linear_4, weight: 1 }
          - { id: linear_5, weight: 0 }
          - { id: linear_side, weight: 0 }
      # Каталог сущностей города: агент cityEntities после генезиса. Модели-тайне не отдаём —
      # система кладёт 1 якорь, совсем изредка 2 (иногда слот «изобрети новое»).
      entities:
        minCatalog: 32
        maxCatalog: 48
        pickMin: 1
        pickMax: 2
        twoChance: 0.12
        inventChance: 0.15
      # V5.1 brief: causal arena + gravity-scaled outcomes.
      # Один посев: генерация, при FAIL судьи — одна доработка того же brief, без нового жребия.
      # situation / scale / association / второй тон не бросаем.
      # OLD_EVENT и EXTERNAL_INTRUSION убраны: это LEGACY и CONTACT.
      # Классификация (вопрос/маска/домен) — после. cooldown — для доски города, не для лабораторного семпла.
      annotation:
        gravityMin: 0
        gravityMax: 100
        secondaryToneChance: 0
        judgeAttempts: 2
        recentWindow: 5
        poolMin: 10
        refillBatch: 3
        shortlistSize: 10
        modifierGravityMin: 40
        cooldown:
          previousMultiplier: 0.2
          frequentWindow: 4
          frequentMinCount: 2
          frequentMultiplier: 0.4
          absentWindow: 5
          absentMultiplier: 1.3
        incompatible:
          truthArena:
            human:
              truthNature: [natural_process, creature_behavior, hidden_structure, anomalous_phenomenon]
            creature:
              truthNature: [human_action, collective_human_process, intentional_deception, hidden_structure, accident_chain]
            ecology:
              truthNature: [human_action, collective_human_process, intentional_deception, hidden_structure, accident_chain, creature_behavior]
            material:
              truthNature: [creature_behavior, collective_human_process, intentional_deception, hidden_structure, human_action]
            built:
              truthNature: [creature_behavior, intentional_deception, collective_human_process, human_action]
            earth:
              truthNature: [human_action, collective_human_process, intentional_deception, accident_chain, creature_behavior]
            sky:
              truthNature: [hidden_structure, human_action, collective_human_process, intentional_deception, accident_chain, creature_behavior]
        tagGroups:
          # Жёсткий посев генератора. Арена — causal substrate Y, не место X и не provenance.
          - id: truthArena
            name: Арена истины
            tags:
              - { id: human, name: HUMAN, about: "причина в действиях, решениях, ошибках, знаниях, скрытом или коллективном поведении людей", weight: 10 }
              - { id: creature, name: CREATURE, about: "причина — конкретное животное или существо: свойства, поведение, жизненный цикл, охота, перемещение", weight: 10 }
              - { id: ecology, name: ECOLOGY, about: "причина — экологический или популяционный процесс: растения, грибы, паразиты, распространение вида, смена экосистемы", weight: 10 }
              - { id: material, name: MATERIAL, about: "причина в веществе или свойствах материала: реакция, коррозия, примесь, минерал, загрязнение", weight: 10 }
              - { id: built, name: BUILT, about: "причина в устройстве созданной людьми физической системы: здание, механизм, водоотвод, дорога, резервуар, кладка", weight: 10 }
              - { id: earth, name: EARTH, about: "причина — естественный процесс острова как ландшафта: скала, грунт, эрозия, оползень, подземная вода, геологический пласт; не колодец и не сток", weight: 10 }
              - { id: sky, name: SKY, about: "причина — процесс воздуха, погоды или открытого неба: ветер, облака, температура, атмосферный перенос, оптический эффект", weight: 10 }
          - id: truthNature
            name: Природа истины
            tags:
              - { id: human_action, name: HUMAN_ACTION, about: "действие одного или нескольких людей, не обязательно преступление" }
              - { id: collective_human_process, name: COLLECTIVE_HUMAN_PROCESS, about: "норма, привычка, решение группы; нет обязательного единственного виновника" }
              - { id: natural_process, name: NATURAL_PROCESS, about: "физический, биологический, климатический или геологический процесс" }
              - { id: creature_behavior, name: CREATURE_BEHAVIOR, about: "поведение животного, неизвестного существа или вида" }
              - { id: accident_chain, name: ACCIDENT_CHAIN, about: "связанные ошибки и случайности дали необычный итог" }
              - { id: hidden_structure, name: HIDDEN_STRUCTURE, about: "устройство скрытого места, объекта или системы" }
              - { id: misidentification, name: MISIDENTIFICATION, about: "на старте принимают не за то, чем оно является" }
              - { id: intentional_deception, name: INTENTIONAL_DECEPTION, about: "кто-то сознательно создаёт ложную картину" }
              - { id: anomalous_phenomenon, name: ANOMALOUS_PHENOMENON, about: "редкое явление со стабильным конкретным правилом" }
          - id: truthDomain
            name: Домен истины
            # Классификация после генерации, не жребий.
            tags:
              - { id: people, name: PEOPLE, about: "истина в людях, решении, привычке или скрытом человеческом действии", weight: 4 }
              - { id: ecology, name: ECOLOGY, about: "истина в живой среде: растения, почва, вода, пищевая цепь", weight: 3 }
              - { id: creatures, name: CREATURES, about: "истина в поведении животного, существа или вида", weight: 3 }
              - { id: surface, name: SURFACE, about: "истина на поверхности острова: край, рельеф, поля, дороги, открытый камень", weight: 4 }
              - { id: sky, name: SKY, about: "истина в небе, ветре, свете или явлении над островом", weight: 2 }
              - { id: body, name: BODY, about: "истина в теле, симптоме, болезни или ране", weight: 3 }
              - { id: material, name: MATERIAL, about: "истина в веществе, осадке, предмете или следе материала", weight: 3 }
              - { id: built_environment, name: BUILT_ENVIRONMENT, about: "истина в постройке, пути, очаге, колодце или обычной конструкции", weight: 4 }
              - { id: underisland, name: UNDERISLAND, about: "истина в пустоте, шахте или устройстве под островом", weight: 1 }
              - { id: external, name: EXTERNAL, about: "истина пришла извне обычной жизни этого острова", weight: 3 }
              - { id: past, name: PAST, about: "истина в конкретном прошлом событии, старом решении или забытом следе", weight: 3 }
          - id: manifestation
            name: Проявление
            tags:
              - { id: body, name: BODY, about: "симптомы, раны, болезнь" }
              - { id: behavior, name: BEHAVIOR, about: "необычное поведение людей или существ" }
              - { id: absence, name: ABSENCE, about: "пропажа людей, вещей, ресурса или ожидаемого" }
              - { id: creatures, name: CREATURES, about: "животные, миграции, гибель или появление вида" }
              - { id: material, name: MATERIAL, about: "вещество, осадок, след, остаток" }
              - { id: object, name: OBJECT, about: "странный предмет или находка" }
              - { id: place, name: PLACE, about: "необычное место или изменение знакомого" }
              - { id: structure, name: STRUCTURE, about: "повреждение или странное устройство конструкции" }
              - { id: landscape, name: LANDSCAPE, about: "рельеф, край, почва, лес, скалы" }
              - { id: sky, name: SKY, about: "небо, свет, явление над островом" }
              - { id: weather, name: WEATHER, about: "дождь, ветер, холод, туман" }
              - { id: light_or_sound, name: LIGHT_OR_SOUND, about: "огни, тени, шумы, эхо, голоса" }
              - { id: resource, name: RESOURCE, about: "изменение важного ресурса" }
              - { id: social_pattern, name: SOCIAL_PATTERN, about: "одинаковое решение независимых людей" }
              - { id: memory_or_knowledge, name: MEMORY_OR_KNOWLEDGE, about: "противоречивые воспоминания или свидетельства" }
          - id: situation
            name: Ситуация
            # Каталог классификации, не жребий V5.1.
            tags:
              - { id: harm, name: HARM, about: "уже произошёл вред" }
              - { id: anomaly, name: ANOMALY, about: "странное и повторяемое" }
              - { id: discovery, name: DISCOVERY, about: "найден предмет, место, след, существо или структура" }
              - { id: disappearance, name: DISAPPEARANCE, about: "кто-то или что-то исчезло" }
              - { id: contradiction, name: CONTRADICTION, about: "наблюдения не складываются" }
              - { id: threat, name: THREAT, about: "признаки продолжающейся скрытой опасности" }
              - { id: opportunity, name: OPPORTUNITY, about: "неизвестное может оказаться ценным" }
          - id: epistemicMask
            name: Эпистемическая маска
            # Классификация после генерации, не жребий.
            tags:
              - { id: delay, name: DELAY, about: "причина и эффект разделены временем" }
              - { id: distance, name: DISTANCE, about: "причина и X в разных местах" }
              - { id: hidden_stage, name: HIDDEN_STAGE, about: "критический промежуточный этап невидим" }
              - { id: common_mediator, name: COMMON_MEDIATOR, about: "обычный ресурс, процедура или среда скрывают источник" }
              - { id: rare_condition, name: RARE_CONDITION, about: "механизм только при редком условии" }
              - { id: lookalike, name: LOOKALIKE, about: "истинная причина выглядит как более обычная" }
              - { id: false_correlation, name: FALSE_CORRELATION, about: "X совпадает с более правдоподобной кажущейся причиной" }
              - { id: old_assumption, name: OLD_ASSUMPTION, about: "верное знание здесь вводит в заблуждение" }
              - { id: partial_visibility, name: PARTIAL_VISIBILITY, about: "видна только часть происходящего" }
              - { id: indirect_effect, name: INDIRECT_EFFECT, about: "X вторичен, первичная причина в другом месте или форме" }
              - { id: scale_mismatch, name: SCALE_MISMATCH, about: "маленькая причина — большой эффект или наоборот" }
          - id: worldRelation
            name: Отношение к миру
            tags:
              - { id: native, name: NATIVE, about: "причина выросла из уже существующей обычной жизни", weight: 35 }
              - { id: contact, name: CONTACT, about: "в привычную жизнь вошло новое явление", weight: 40 }
              - { id: legacy, name: LEGACY, about: "X — следствие прошлого, старого объекта или забытой структуры", weight: 25 }
          - id: scale
            name: Масштаб
            # Каталог классификации, не жребий V5.
            tags:
              - { id: local, name: LOCAL, about: "один человек, группа, место или небольшой участок", weight: 4 }
              - { id: civic, name: CIVIC, about: "значимая часть города или городской жизни", weight: 3 }
              - { id: islandwide, name: ISLANDWIDE, about: "большая часть острова или островная система", weight: 2 }
