# Посев историй: до скольких живых историй досаживать город (без строек игрока)
# и как часто проверять. Первая история приходит вскоре после генезиса.
# Пока бед без ответа fronts.director.calmTroubles и больше, режиссёр не сажает.
# Какую заготовку взять, решает режиссёр по осям (см. fronts.director).
seeding:
  activeStories: 2
  checkEveryDays: 30
  firstStoryDay: 3
  # Поиск или дело истории, за которые никто не взялся за столько дней, тихо уходят из дел города
  # (их люди, места и вещи остаются): так брошенный город не копит нетронутое и посев идёт дальше.
  dormantDays: 240
  # История по зерну (заготовки кончились) не больше стольких фронтов, из них идущих к сроку сами —
  # не больше freeMaxDrifting: иначе одна история заваливает город бедами.
  freeMaxFronts: 3
  freeMaxDrifting: 1
  # Масштаб фронта истории по зерну не выше этого: судьбоносное приходит только из заготовок.
  freeMaxImpact: SIGNIFICANT
  # Сколько имён из пула мира давать агенту, который может завести людей.
  namesPerCall: 6
  # Посаженная история на новой модели: ёмкость по масштабу заготовки
  # и срок (в игровых месяцах), если история движется сама.
  capacity:
    NONE: 2
    MINOR: 4
    SIGNIFICANT: 9
    MAJOR: 16
    DEFINING: 34
  driftMonths:
    NONE: 0
    SLOW: 8
    STEADY: 4
    FAST: 2

priest:
  # Сколько последних реплик разговора видит жрец.
  dialogDepth: 12
