# Игровые числа v2. Промпты агентов здесь не живут: они в src/agents/<имя>/prompt.md.
# Ни одно число отсюда не видит LLM.

time:
  realHoursPerYear: 24
stats:
  - id: prosperity
    name: Благосостояние
    about: >-
      Сыты ли дворы и полны ли склады. Есть ли крыша, плата за труд и праздник, который город может
      себе позволить.
    covers: Еда, вода, склады, рынок, ремёсла, кров, нищета и зажиточность дворов.
    changeWhen: Урожай, раздача, кража запасов, разорение квартала, удачная сделка, голод.
    scale:
      '0': Нищета, пустые склады, голод на улицах
      '25': Скудная жизнь, едва сводят концы с концами
      '50': Устойчивый достаток среднего торгового города
      '75': Богатый город с запасами и витринами зажиточности
      '100': Легендарное изобилие, сокровищницы полны
  - id: security
    name: Безопасность
    about: >-
      Спит ли улица спокойно. Стража, стены и порядок — одно: знает ли город, что его защищают, и
      боится ли тот, кто пришёл с ножом.
    covers: Ополчение, дозор у обрыва, оружие, укрепления, бунт, суд как порядок.
    changeWhen: Набор в строй, разгром отряда, новые стены, бунт, казнь, справедливый суд.
    scale:
      '0': 'Беззащитный город: нет армии и укреплений, улица не слушается'
      '25': Слабая стража, держится скорее удачей
      '50': Обычное ополчение, стены и редкие волнения
      '75': Сильная стража и предсказуемый порядок
      '100': Незыблемый строй; враги и мятеж почти немыслимы
  - id: knowledge
    name: Знание
    about: >-
      Помнит ли город, как лечить, строить и читать. Школы, архивы и ремесло — память, без которой
      остров слепнет.
    covers: Школы, книги, экспедиции, алхимия, карты, память мастеров.
    changeWhen: Открыли способ, сожгли архив, пришёл учитель, забыли ремесло, нашли чертёж, болезнь.
    scale:
      '0': Невежество; грамотных единицы
      '25': Устные предания, мало книг и мастеров
      '50': Школы, архивы, практические умения
      '75': Сильные академии, инженерия или учёное ремесло
      '100': Хранилище тайн эпохи; опережает соседние острова
  - id: influence
    name: Влияние
    about: >-
      Слушают ли город его собственные дома — и помнят ли чужие острова его имя. Гильдии, слухи,
      обычаи и лицо на площади.
    covers: Гильдии, дома, суд как политика, слухи, обычаи, лицо города, праздник как смысл.
    changeWhen: Новый союз, унижение на площади, указ принят или осмеян, чужой остров запомнил имя.
    scale:
      '0': Город никто не слушает, даже свои
      '25': Слабый голос, споры без исхода
      '50': Обычная связность домов и цехов
      '75': Город умеет договариваться и задавать тон
      '100': Слово города весит как закон для своих и память для чужих
statEpithets:
  '0': ужасающе
  '12': плачевно
  '25': скудно
  '37': скромно
  '50': обычно
  '62': заметно
  '75': сильно
  '87': блистательно
  '100': божественно
faith:
  name: Вера
  about: >-
    Насколько город ещё верит, что ты — его бог. Когда вера слабеет, обряд становится привычкой, а
    привычка — забвением.
mana:
  name: Мана
  about: >-
    Сила, которой ты говоришь со жрецом. Прибывает непрерывно — за игровой год столько, сколько у
    города веры.
  max: 100
  turnCost: 1
  turnCostWithAction: 2
genesis:
  statBudget: 220
  statMin: 35
  statMax: 75
officers:
  - office: treasurer
    statId: prosperity
    title: Казначей
    titleGen: казначея
    focus: >-
      хозяйство: казна, склады, закуп, раздача, стройка, кровля, укрепление склонов и оград руками
      мастеров, рынок, цех, голод
    strategy: В основном интересуется ресурсами, собственностью и инфраструктурой, даже в ущерб людям.
  - office: marshal
    statId: security
    title: Маршал
    titleGen: маршала
    focus: >-
      общественный порядок, война, преступления, стража, арест, дозор улиц; не стройка и не
      укрепление стен
    strategy: Всегда действует решительно, даже не разобравшись в вопросе.
  - office: keeper
    statId: knowledge
    title: Хранитель
    titleGen: хранителя
    focus: архив, школа, болезнь, чертёж, исследование, алхимия
    strategy: Предпочитает сбор сведений. Часто медлит и не всегда действует решительно.
  - office: chancellor
    statId: influence
    title: Канцлер
    titleGen: канцлера
    focus: переговоры, гильдия, слух, дипломатия сопряжения, суд чести, указ в народе
    strategy: В основном интересуется людьми и наплевательски относится к ресурсам и собственности.
