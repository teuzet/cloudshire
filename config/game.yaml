# Игровые числа v2. Промпты агентов здесь не живут: они в src/agents/<имя>/prompt.md.
# Ни одно число отсюда не видит LLM.

time:
  realHoursPerYear: 24
stats:
  - id: prosperity
    name: Благосостояние
    about: >-
      Сыты ли дворы и полны ли склады. Есть ли крыша, плата за труд и праздник, который город может
      себе позволить.
    covers: Еда, вода, склады, рынок, ремёсла, кров, нищета и зажиточность дворов.
    changeWhen: Урожай, раздача, кража запасов, разорение квартала, удачная сделка, голод.
    scale:
      '0': Нищета, пустые склады, голод на улицах
      '25': Скудная жизнь, едва сводят концы с концами
      '50': Устойчивый достаток среднего торгового города
      '75': Богатый город с запасами и витринами зажиточности
      '100': Легендарное изобилие, сокровищницы полны
  - id: security
    name: Безопасность
    about: >-
      Спит ли улица спокойно. Стража, стены и порядок — одно: знает ли город, что его защищают, и
      боится ли тот, кто пришёл с ножом.
    covers: Ополчение, дозор у обрыва, оружие, укрепления, бунт, суд как порядок.
    changeWhen: Набор в строй, разгром отряда, новые стены, бунт, казнь, справедливый суд.
    scale:
      '0': 'Беззащитный город: нет армии и укреплений, улица не слушается'
      '25': Слабая стража, держится скорее удачей
      '50': Обычное ополчение, стены и редкие волнения
      '75': Сильная стража и предсказуемый порядок
      '100': Незыблемый строй; враги и мятеж почти немыслимы
  - id: knowledge
    name: Знание
    about: >-
      Помнит ли город, как лечить, строить и читать. Школы, архивы и ремесло — память, без которой
      остров слепнет.
    covers: Школы, книги, экспедиции, алхимия, карты, память мастеров.
    changeWhen: Открыли способ, сожгли архив, пришёл учитель, забыли ремесло, нашли чертёж, болезнь.
    scale:
      '0': Невежество; грамотных единицы
      '25': Устные предания, мало книг и мастеров
      '50': Школы, архивы, практические умения
      '75': Сильные академии, инженерия или учёное ремесло
      '100': Хранилище тайн эпохи; опережает соседние острова
  - id: influence
    name: Влияние
    about: >-
      Слушают ли город его собственные дома — и помнят ли чужие острова его имя. Гильдии, слухи,
      обычаи и лицо на площади.
    covers: Гильдии, дома, суд как политика, слухи, обычаи, лицо города, праздник как смысл.
    changeWhen: Новый союз, унижение на площади, указ принят или осмеян, чужой остров запомнил имя.
    scale:
      '0': Город никто не слушает, даже свои
      '25': Слабый голос, споры без исхода
      '50': Обычная связность домов и цехов
      '75': Город умеет договариваться и задавать тон
      '100': Слово города весит как закон для своих и память для чужих
statEpithets:
  '0': ужасающе
  '12': плачевно
  '25': скудно
  '37': скромно
  '50': обычно
  '62': заметно
  '75': сильно
  '87': блистательно
  '100': божественно
faith:
  name: Вера
  about: >-
    Насколько город ещё верит, что ты — его бог. Когда вера слабеет, обряд становится привычкой, а
    привычка — забвением.
  # Вера тянется к среднему четырёх статов: такая доля разрыва уходит за игровой месяц.
  pullPerMonth: 0.1
  # Импульсы от событий: случай выбирает Оценщик веры, число даёт эта таблица.
  impulses:
    minor:
      harm_willed: -1
      harm_unguarded: 0
      harm_averted: 1
      boon_willed: 1
    notable:
      harm_willed: -3
      harm_unguarded: -1
      harm_averted: 2
      boon_willed: 2
    grave:
      harm_willed: -6
      harm_unguarded: -3
      harm_averted: 4
      boon_willed: 4
    shock:
      harm_willed: -12
      harm_unguarded: -6
      harm_averted: 8
      boon_willed: 8
mana:
  name: Мана
  about: >-
    Сила, которой ты говоришь со жрецом. Прибывает непрерывно — за игровой год столько, сколько у
    города веры.
  max: 100
  # Сколько маны у нового города.
  start: 20
  turnCost: 1
  turnCostWithAction: 2
genesis:
  statBudget: 220
  statMin: 35
  statMax: 75
officers:
  - office: treasurer
    statId: prosperity
    title: Казначей
    titleGen: казначея
    focus: >-
      хозяйство: казна, склады, закуп, раздача, стройка, кровля, укрепление склонов и оград руками
      мастеров, рынок, цех, голод
    strategy: В основном интересуется ресурсами, собственностью и инфраструктурой, даже в ущерб людям.
  - office: marshal
    statId: security
    title: Маршал
    titleGen: маршала
    focus: >-
      общественный порядок, война, преступления, стража, арест, дозор улиц; не стройка и не
      укрепление стен
    strategy: Всегда действует решительно, даже не разобравшись в вопросе.
  - office: keeper
    statId: knowledge
    title: Хранитель
    titleGen: хранителя
    focus: архив, школа, болезнь, чертёж, исследование, алхимия
    strategy: Предпочитает сбор сведений. Часто медлит и не всегда действует решительно.
  - office: chancellor
    statId: influence
    title: Канцлер
    titleGen: канцлера
    focus: переговоры, гильдия, слух, дипломатия сопряжения, суд чести, указ в народе
    strategy: В основном интересуется людьми и наплевательски относится к ресурсам и собственности.
# Система фронтов. Все значения условные: баланс сводится позже.
# Единица работы — труд одного сановника за игровую неделю. Описание: docs/design/fronts.md.
fronts:
  # Вес объектов генезиса и посаженных историй (не новая система оценки).
  impact:
    levels:
      - NONE
      - MINOR
      - SIGNIFICANT
      - MAJOR
      - DEFINING
    rawBudget:
      NONE: 0
      MINOR: 1
      SIGNIFICANT: 3
      MAJOR: 6
      DEFINING: 10
  work:
    # Выработка сановника за игровой месяц.
    unitsPerMonth: 4
    # Поправка сановника: fitFloor + fitSpan * стат/100, плюс profileBonus за дело своего профиля.
    fitFloor: 0.75
    fitSpan: 0.3
    profileBonus: 0.15
  # Класс вклада в пунктах стата.
  contribution:
    small: 2
    medium: 5
    large: 12
    huge: 30
  basePrice:
    edit: 1
    fact: 1
    byType:
      policy: 2
      practice: 2
      object: 2
      resource: 2
      landmark: 2
      community: 3
      person: 3
      capability: 3
      mystery: 3
      threat: 3
      organization: 4
      site: 4
      district: 4
      building: 4
      structure: 8
      settlement: 8
  # Масштаб по ёмкости: до какой ёмкости и сколько вех. Последняя строка без верхней границы.
  scale:
    - id: minor
      upTo: 6
      milestones: 1
    - id: medium
      upTo: 15
      milestones: 2
    - id: major
      upTo: 35
      milestones: 3
    - id: grand
      upTo: null
      milestones: 4
  # Доля вклада занятого объекта, пока идёт дело.
  occupiedShare: 0.75
  verdict:
    spot_on: 1.5
    fits: 1
    'off': 0.5
  # Шаг одного рычага темпа: к скорости и к шансу осложнения.
  tempoStep: 0.2
  helper:
    unitsPerMonth: 2
    # Ёмкость дела «собрать помощника» не больше этой доли ёмкости самого дела.
    maxShare: 0.3
  hindrance:
    unitsPerMonth: -2
    removalShare: 0.15
    removalMin: 2
  # Атомарное дело «разовый вклад»: доля ёмкости родителя.
  push:
    share: 0.15
    min: 2
  threat:
    capacityShare: 0.4
    capacityMin: 2
  tension:
    quenchShare: 0.2
    quenchMin: 1
    burstMonthsMin: 2
    burstMonthsMax: 4
  opportunity:
    capacityShare: 0.5
    capacityMin: 1
  deadlines:
    ownRiskMonths: 1
    worldMonths: 4
  risk:
    chance:
      safe: 0
      normal: 0.15
      hard: 0.35
      risky: 0.6
      impossible: 1
    # Доля тяжёлых осложнений среди выпавших.
    heavyShare:
      safe: 0
      normal: 0
      hard: 0.5
      risky: 1
      impossible: 1
    # Недостижимое дело: каждая N-я беда заменяется находкой. Обычным делам долю
    # удобных случаев задаёт режиссёр (director.plusBase … plusMax).
    plusEvery: 3
    # Авария: какая доля набранного прогресса теряется.
    accidentLoss: 0.25
  # Исход этапа, который не известен заранее: веса жребия.
  outcome:
    asPlanned: 0.6
    twist: 0.4
  director:
    freshWeight: 3
    freshDays: 360
    # Сколько пар «запись и объект» Примерщик проверяет за одно осложнение.
    fitterCalls: 6
    # Режиссёр помнит, что рождалось за последние windowDays дней, и предпочитает другое:
    # повтор двигателя, источника или сферы делит вес на (1 + repeatPenalty × сколько раз было),
    # занятый сановник — на (1 + loadPenalty × сколько дел он ведёт).
    windowDays: 180
    repeatPenalty: 0.7
    loadPenalty: 0.4
    # Тайна (заранее посаженный скрытый объект или факт): желаемая доля среди рождённого.
    # Меньше доли — история с тайной в mysteryBoost раз желаннее, больше — во столько же раз реже.
    mysteryShare: 0.3
    mysteryBoost: 2
    # Беды без ответа (без ведущего): при calmTroubles новых бед от срывов и посева не рождается,
    # а доля удобных случаев среди выпавших растёт от plusBase до plusMax.
    calmTroubles: 3
    plusBase: 0.2
    plusMax: 0.7
    # Слова для свободных генераторов: режиссёр заказывает им то, чего давно не было.
    engines:
      refusal: "кто-то нужный городу перестал делать своё"
      feud: "две силы открыто бьются за одно и то же"
      discovery: "город нашёл или узнал то, чего у него не было"
      betrayal: "кто-то внутри круга доверия действует против города"
      dilemma: "два законных требования, оба выполнить нельзя"
      crisis: "рушится одна из основ быта города"
      success: "что-то вышло слишком хорошо, и город не выдерживает своей удачи"
      ideology: "столкнулись два взгляда на мир"
      opportunity: "городу выпал шанс, который уйдёт, если его не взять"
    sources:
      people: "поступок, решение или умысел конкретных людей"
      custom: "обычай, привычка, слух или репутация"
      creature: "животное или существо: нрав, голод, гнездо"
      ecology: "живая среда целиком: заросли, паразит, цветение"
      matter: "вещество, вещь или механизм: редкий материал, изобретение, устройство со своим нравом"
      sky: "воздух, погода и открытое небо"
      phenomenon: "редкое явление с устойчивым правилом"
    spheres:
      prosperity: "хлеб, ремесло, торговля и запасы"
      security: "стража, стены и порядок на улицах"
      knowledge: "учёность, лечение, дозор и разведка"
      influence: "люди, дома, слухи и умение договориться"
  # Срыв: когда беда случилась, она может потянуть за собой новую (записи словаря с when: failure).
  # chance — как часто при спокойном городе; режиссёр снижает его с числом бед без ответа
  # и решает, беда это или удобный случай. heavyShare — доля тяжёлых бед.
  failure:
    chance: 0.5
    heavyShare: 0.3
  refresh:
    maxFronts: 3
  # Сколько дней действует предупреждение о недостижимой цели: повторный приказ запускает дело.
  unattainableWarnDays: 60
  objects:
    types:
      - building
      - structure
      - landmark
      - district
      - settlement
      - site
      - object
      - resource
      - organization
      - community
      - person
      - practice
      - capability
      - policy
      - threat
      - mystery
    nameMax: 80
    descriptionMax: 560
  genesisObjects:
    minCount: 20
    maxCount: 100
    profileRange: 5
  # Словарь динамик: скелеты осложнений без конкретики города.
  #   class    — bound (бьёт по делу), side (бьёт по объекту), plus (удобный случай);
  #   when     — на вехе, при завершении или при срыве (беда случилась);
  #   light / heavy — во что выливается лёгкое и тяжёлое осложнение (null: такой тяжести нет);
  #   from     — откуда берётся объект в роль: отношения отпечатка, helper, site, result, nearby, same-type,
  #              struck (то, по чему ударила беда);
  #   hits     — по чему бьёт: parent, role, result;
  #   condition — вопрос Примерщику (пустой: подходит всегда);
  #   needsNew — Костюмер обязан описать нового участника; newHidden — он скрыт от игрока;
  #   requires — noLead (дело без ведущего) или null; minStep — с какой ступени риска.
  #   engine, source, sphere — оси режиссёра: что движет историей, где живёт причина, какой сфере
  #              города (и её сановнику) она достанется; тайна выводится из newHidden.
  dynamics:
    - id: key-refuse
      title: Ключевые отказывают
      enabled: true
      class: bound
      when: [milestone]
      light: tension
      heavy: threat
      from: [occupies, helper]
      types: [community, organization, person]
      hits: parent
      condition: Этим людям от работы стало заметно тяжелее?
      skeleton: Люди, без которых работа не идёт, устали или обижены и готовы её бросить.
      helps: уступка в оплате или отдыхе, уважение к старшим мастерам
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: refusal
      source: people
      sphere: influence
    - id: touched-resist
      title: Задетые сопротивляются
      enabled: true
      class: bound
      when: [milestone]
      light: tension
      heavy: threat
      from: [pressures]
      types: [community, organization, person]
      hits: parent
      condition: У этих людей есть сила и причина сопротивляться?
      skeleton: Те, чьи интересы работа задевает, открыто или тайно мешают ей.
      helps: договориться с задетыми, дать им долю или показать твёрдость
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: feud
      source: people
      sphere: influence
    - id: touched-revenge
      title: Задетые сопротивляются (после завершения)
      enabled: true
      class: side
      when: [completion]
      light: tension
      heavy: threat
      from: [pressures]
      types: [community, organization, person]
      hits: result
      condition: У этих людей есть сила и причина сопротивляться?
      skeleton: Те, кого готовый результат задел, подтачивают его и мешают им пользоваться.
      helps: уступка задетым, общее дело с ними или защита результата
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: feud
      source: people
      sphere: influence
    - id: squatters
      title: Заняли бесхозное
      enabled: true
      class: bound
      when: [milestone]
      light: hindrance
      heavy: hindrance
      from: [site]
      types: []
      hits: parent
      condition: ''
      skeleton: Место работ осталось без присмотра, и его заняли чужие, люди или существа.
      helps: прогнать, выкупить или переселить занявших
      needsNew: true
      newHidden: false
      requires: noLead
      minStep: normal
      engine: feud
      source: people
      sphere: security
    - id: occupied-strained
      title: Занятое надорвалось
      enabled: true
      class: side
      when: [milestone]
      light: tension
      heavy: threat
      from: [occupies]
      types: []
      hits: role
      condition: Это может надорваться или истощиться от такой работы?
      skeleton: То, что работа заняла, не выдерживает нагрузки и приходит в упадок.
      helps: дать передышку, подменить другим источником, вложиться в починку
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: crisis
      source: matter
      sphere: prosperity
    - id: bystanders
      title: Пострадали посторонние
      enabled: true
      class: side
      when: [milestone]
      light: tension
      heavy: threat
      from: [nearby]
      types: []
      hits: role
      condition: Это место или эти люди могут пострадать от работ по соседству?
      skeleton: Работа вредит тем, кто рядом и кого она прямо не касалась.
      helps: отвести вред от соседей, возместить ущерб, изменить порядок работ
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: dilemma
      source: matter
      sphere: influence
    - id: accident
      title: Авария
      enabled: true
      class: bound
      when: [milestone]
      light: null
      heavy: accident
      from: [site]
      types: []
      hits: parent
      condition: ''
      skeleton: На месте работ случилось несчастье, часть сделанного потеряна, после него осталась помеха.
      helps: разобрать последствия и наладить надзор
      needsNew: true
      newHidden: false
      requires: null
      minStep: risky
      engine: crisis
      source: matter
      sphere: security
    - id: find-at-works
      title: Находка при работах
      enabled: true
      class: plus
      when: [milestone]
      light: opportunity
      heavy: opportunity
      from: [site]
      types: []
      hits: role
      condition: ''
      skeleton: На месте работ нашли то, чего никто не ждал, и это можно обратить на пользу городу, пока есть время.
      helps: быстро изучить находку и приставить к ней знающих людей
      needsNew: true
      newHidden: false
      requires: null
      minStep: safe
      engine: discovery
      source: matter
      sphere: knowledge
    - id: rival
      title: Соперник за плоды
      enabled: true
      class: side
      when: [completion]
      light: tension
      heavy: tension
      from: [linked, benefits]
      types: [community, organization, person]
      hits: result
      condition: У этих людей есть влияние и желание прибрать результат к рукам?
      skeleton: Влиятельные люди хотят забрать готовый результат под себя.
      helps: закрепить результат за городом, поделить выгоду или найти противовес
      needsNew: false
      newHidden: false
      requires: null
      minStep: normal
      engine: feud
      source: people
      sphere: influence
    - id: abuse
      title: Злоупотребление новым
      enabled: true
      class: side
      when: [completion]
      light: tension
      heavy: tension
      from: [result]
      types: []
      hits: result
      condition: ''
      skeleton: Кто-то тайно пользуется новым во вред городу, виновник пока неизвестен.
      helps: розыск виновника, надзор и ясные правила пользования
      needsNew: true
      newHidden: true
      requires: null
      minStep: normal
      engine: betrayal
      source: people
      sphere: security
    - id: displacement
      title: Вытеснение старого
      enabled: true
      class: side
      when: [completion]
      light: clock
      heavy: clock
      from: [same-type]
      types: []
      hits: role
