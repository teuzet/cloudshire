# Книга клерка: данные, которые код подаёт клерку по частям. В промпт агента целиком не попадает.
#   spirits   — духи городов для набросков игроку, который просит выбрать за него:
#               код берёт по одному из разных семей, клерк по каждому пишет свой город.
#   questions — вопросы для игрока, который не может сформулировать город:
#               первый случайный, дальше клерк выбирает из шорт-листа.
#               kind: fork — выбор из образов, open — приглашение придумать деталь.
#               theme: island, economy, people, threat, strange, past, faith.
sketches: 3
shortlist: 6
perTheme: 2

spirits:
  - { id: s1, family: суровое, name: "Осаждённая крепость", line: "Город живёт от набега до набега и гордится каждой пережитой зимой" }
