questions:
  - { id: q1, kind: fork, theme: threat, text: "На ночь в твоём городе запирают ворота или дверей не запирают вовсе?" }
  - { id: q2, kind: fork, theme: island, text: "Город любит смотреть с края вниз или отвернулся от края и старается о нём не думать?" }
  - { id: q3, kind: fork, theme: island, text: "Здесь тесно, дома друг у друга на плечах, или просторно, и до соседа надо идти?" }
  - { id: q4, kind: fork, theme: island, text: "На острове чаще тепло или холодно, а свет резкий или мягкий?" }
  - { id: q5, kind: fork, theme: economy, text: "Чем пахнет главная улица утром: хлебом, дымом, железом или чем-то, чему нет названия?" }
  - { id: q6, kind: fork, theme: economy, text: "Здесь больше чинят старое или строят новое?" }
  - { id: q7, kind: fork, theme: economy, text: "Город богат и боится потерять или беден и не боится ничего?" }
  - { id: q8, kind: fork, theme: economy, text: "Самое высокое в городе: храм, дозорная башня, труба мастерской или дерево?" }
  - { id: q9, kind: fork, theme: people, text: "В городе громко или тихо?" }
  - { id: q10, kind: fork, theme: people, text: "Провинившегося тут стыдят всем миром или прощают по-тихому?" }
  - { id: q11, kind: fork, theme: people, text: "Дети тут рано берутся за дело или долго остаются детьми?" }
  - { id: q12, kind: fork, theme: past, text: "Старики тут вспоминают лучшие времена или худшие?" }
  - { id: q13, kind: fork, theme: past, text: "Город построили те, кто в нём живёт, или он достался им готовым?" }
  - { id: q14, kind: fork, theme: faith, text: "Тебе здесь верят из любви, из страха или по привычке?" }
  - { id: q15, kind: fork, theme: faith, text: "Твой храм стоит в самом центре или там, куда надо долго идти?" }
  - { id: q16, kind: fork, theme: strange, text: "Странное здесь прячут или выставляют напоказ?" }
  - { id: q17, kind: open, theme: strange, text: "Есть место, куда в городе не ходят. Что там?" }
  - { id: q18, kind: open, theme: strange, text: "Что видно с самой высокой точки острова, чего не видно больше ниоткуда?" }
  - { id: q19, kind: open, theme: strange, text: "Что здесь считают обычным делом, хотя это чудо?" }
  - { id: q20, kind: open, theme: island, text: "Что на острове растёт само, без спроса?" }
  - { id: q21, kind: open, theme: island, text: "Какой звук слышен здесь всегда?" }
  - { id: q22, kind: open, theme: economy, text: "Что в этом городе делают лучше, чем где бы то ни было?" }
  - { id: q23, kind: open, theme: economy, text: "Какое животное здесь главное и что оно делает: кормит, возит, сторожит или пугает?" }
  - { id: q24, kind: open, theme: people, text: "Про что здесь шутят?" }
  - { id: q25, kind: open, theme: people, text: "За что здесь можно лишиться доброго имени?" }
  - { id: q26, kind: open, theme: people, text: "О чём в городе спорят уже сто лет и никак не доспорят?" }
  - { id: q27, kind: open, theme: threat, text: "Что горожане всегда носят с собой?" }
  - { id: q28, kind: open, theme: threat, text: "Чего город ждёт каждый год, с радостью или со страхом?" }
  - { id: q29, kind: open, theme: past, text: "Что досталось городу от тех, кто жил тут раньше?" }
  - { id: q30, kind: open, theme: past, text: "Что здесь случилось однажды, о чём до сих пор говорят шёпотом?" }
  - { id: q31, kind: open, theme: faith, text: "О чём тебя здесь просят чаще всего?" }
  - { id: q32, kind: open, theme: faith, text: "Если бы город мог попросить тебя об одной вещи раз и навсегда, что бы это было?" }
