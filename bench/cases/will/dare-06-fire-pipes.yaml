title: "Огненные трубы против бунтовщиков"
note: "Строка 6: цель на грани мира. Страж может счесть огнемёт достижимым ремеслом (кузни, алхимия); важно, чтобы подробности приказа дошли до планировщика и он строил огнемёт, а не дымоходы."
state: dare-isle
messages:
  - "Постройте огненные трубы, которые бьют пламенем на сотню шагов, и сожгите бунтовщиков в башне."
