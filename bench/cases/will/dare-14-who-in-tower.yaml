title: "Узнать, кто подбивает бунтовщиков (казначей отвлекается)"
note: "Вторая часть: узнать скрытое малым делом; казначей занята стеной, отвлекается и вернётся."
state: dare-isle
messages:
  - "Пусть казначей ненадолго отвлечётся от стены и выяснит, кто в башне подбивает беглых держаться вместе."
