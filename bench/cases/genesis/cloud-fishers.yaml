title: Рыбаки облаков — игрок описывает город сам
note: Обычный путь онбординга. Проверяем, что проводник вытягивает имя и пол покровителя и не тянет разговор.
dialog:
  - Привет. Я Тарн, бог ветров и дальних течений.
  - Хочу город рыбаков, которые закидывают сети прямо в облака и ловят там серебристых летучих рыб. Город бедный, но гордый, живёт на краю большого острова.
  - Да, так и есть. Начинай.
