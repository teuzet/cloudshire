title: Город-библиотека — готовая «рыба», без проводника
note: Генезис без онбординга. Удобно для тюнинга агентов генезиса на одном и том же входе.
city:
  city_name: Кейр-Ассаль
  patron_name: Мирра
  patron_gender: female
  pitch: >-
    Город, вырезанный в одной огромной скале. Его жители хранят библиотеку,
    куда со всех летающих островов свозят книги, и считают знание единственной
    настоящей валютой. Внизу под скалой — туман, из которого иногда слышны голоса.
